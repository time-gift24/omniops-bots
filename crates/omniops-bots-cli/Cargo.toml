[package]
name = "omniops-bots-cli"
description = "CLI binary of the omniops-bots workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
omniops-bots-test = ["dep:async-trait", "dep:omniops-bots-provider", "dep:futures-util", "dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier", "dep:tokio"]

[dependencies]
async-trait = { workspace = true, optional = true }
omniops-bots-collector.workspace = true
tracing.workspace = true
clap = { workspace = true, features = ["derive"] }
omniops-bots-core.workspace = true
omniops-bots-provider = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
opentelemetry-proto.workspace = true
prost.workspace = true
serde_json.workspace = true
tokio.workspace = true
