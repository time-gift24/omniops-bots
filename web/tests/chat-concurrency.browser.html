<!doctype html>
<meta charset="utf-8" />
<title>Chat task isolation regression</title>
<div id="fixture" style="height:800px;max-width:900px"></div>
<pre id="result">Running…</pre>
<script>
const reportEarlyFailure = error => {
  const result = document.querySelector("#result")
  result.textContent = `FAIL: ${error?.stack ?? error}`
  result.dataset.passed = "false"
}
window.addEventListener("error", event => reportEarlyFailure(event.error ?? event.message))
window.addEventListener("unhandledrejection", event => reportEarlyFailure(event.reason))
</script>
<script type="module">
import React from "react"
import { createRoot } from "react-dom/client"
import { flushSync } from "react-dom"
import "/src/index.css"
import { ChatScreen } from "/src/components/chat/chat-screen.tsx"
import { createTestDependencies, withDependencies } from "/tests/support.tsx"
import { DEMO_MODELS } from "/src/adapters/demo/resources.ts"

const fixture = document.querySelector("#fixture"), result = document.querySelector("#result")
const root = createRoot(fixture), listeners = new Set(), requests = [], snapshots = []
const taskA = { runId: "a-run", threadId: "a", title: "Selected browser task", phase: "running" }
const taskB = { runId: "b-run", threadId: "b", title: "Own task", phase: "running" }
let state = { simulated: false, tasks: [taskA], task: taskA, browserThreadId: "a", browserRequest: 0, browser: { url: "", title: "", status: "empty", canGoBack: false, canGoForward: false } }
const stopAck = Promise.withResolvers()
const notify = () => flushSync(() => { for (const listener of listeners) listener() })
const updateTasks = (tasks, publish = true) => { state = { ...state, tasks, task: tasks.find(task => task.threadId === "a") ?? null }; if (publish) notify() }
const desktop = {
  getState: () => state,
  subscribe(listener) { listeners.add(listener); return () => listeners.delete(listener) },
  async decide() {}, async navigate() {}, async back() {}, async forward() {}, async reload() {},
  async stop(runId) {
    updateTasks(state.tasks.map(task => task.runId === runId ? { ...task, phase: "stopping" } : task))
    await stopAck.promise
    updateTasks(state.tasks.filter(task => task.runId !== runId))
  },
}
const metadata = { providerName: "test", protocolName: "test", requestedModel: "pine-1" }
const dependencies = createTestDependencies({
  desktop,
  gatewayFor: threadId => ({
    abort() {},
    async *stream(request) {
      requests.push({ threadId, request })
      yield { type: "completed", response: { assistant: { parts: [{ type: "text", text: `Reply for ${threadId}` }] }, finish: { reason: "stop" }, usage: {}, metadata } }
    },
  }),
  runs: { bindSession() {}, async list() { return [] }, async get() { throw new Error("unused") }, async snapshot(threadId) { snapshots.push(threadId); return { model: "pine-1" } } },
})
const assert = (condition, message) => { if (!condition) throw new Error(message) }
const wait = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms))
const until = async (condition, message) => { const deadline = Date.now() + 10000; while (!condition() && Date.now() < deadline) await wait(); assert(condition(), message) }
const button = label => [...fixture.querySelectorAll("button")].find(element => element.getAttribute("aria-label") === label || element.textContent.trim() === label)
const editor = () => fixture.querySelector('[role="textbox"]')
const type = text => flushSync(() => { editor().textContent = text; editor().dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: text })) })
const click = element => { assert(element && !element.disabled, "Expected enabled action"); flushSync(() => element.click()) }
const render = threadId => flushSync(() => root.render(withDependencies(React.createElement(ChatScreen, { threadId, models: DEMO_MODELS, suggestions: ["尝试并行建议"] }), dependencies)))
const retries = () => [...fixture.querySelectorAll("button")].filter(element => element.getAttribute("aria-label") === "重试" || ["重试", "重新生成"].includes(element.textContent.trim()))
const bRequests = () => requests.filter(request => request.threadId === "b").length
try {
  render("suggestion")
  assert(!button("尝试并行建议").disabled, "A selected task must not disable an idle thread's suggestions")
  updateTasks([taskA, { ...taskB, threadId: "suggestion" }])
  assert(button("尝试并行建议").disabled, "Suggestions must detect their own task even while another page is selected")
  updateTasks([taskA])
  click(button("尝试并行建议"))
  await until(() => requests.some(request => request.threadId === "suggestion"), "Suggestion send must be independent of A")
  render("b")
  type("Independent B request")
  assert(button("发送") && !button("发送").disabled, "Idle B must remain sendable while browser page A owns a task")
  updateTasks([taskA, taskB], false)
  click(button("发送"))
  assert(bRequests() === 0 && dependencies.threads.get("b").getDraft().text === "Independent B request", "The immediate submit guard must block a newly busy B before subscription delivery")
  notify()
  assert(button("停止任务") && !button("停止任务").disabled, "B must display its own task even when the selected browser task is A")
  assert(!fixture.textContent.includes("Agent 正在执行任务") && !fixture.textContent.includes("其他会话正在运行任务。"), "Running tasks must not add a status strip above the composer")
  updateTasks([taskA, { ...taskB, error: "停止未能完成，请重试。" }])
  assert(fixture.querySelector('[role="alert"]')?.textContent.includes("停止未能完成"), "Removing task status must preserve actionable stop errors")
  updateTasks([taskA])
  const stoppingA = desktop.stop(taskA.runId)
  assert(!button("发送").disabled, "Stopping A must not disable B's composer")
  click(button("发送"))
  await until(() => bRequests() === 1 && dependencies.threads.get("b").getState().status === "idle", "B must submit while A is stopping")
  await until(() => snapshots.includes("b"), "An unrelated browser task must not block B's persisted model snapshot")
  await until(() => retries().length > 0, "Completed B reply must expose retry")
  assert(retries().every(element => !element.disabled), "An unrelated stopping task must not disable B retry")
  updateTasks([{ ...taskA, phase: "stopping" }, taskB], false)
  click(retries()[0])
  assert(bRequests() === 1, "The immediate retry guard must block a newly busy B before subscription delivery")
  notify()
  assert(retries().every(element => element.disabled), "Own B task must disable historical retry")
  updateTasks([{ ...taskA, phase: "stopping" }])
  click(retries()[0])
  await until(() => bRequests() === 2 && dependencies.threads.get("b").getState().status === "idle", "B retry must proceed independently of stopping A")
  stopAck.resolve()
  await stoppingA
  type("Legacy draft")
  const { tasks: _tasks, ...legacy } = state
  state = { ...legacy, task: taskA }
  notify()
  assert(button("发送")?.disabled && retries().every(element => element.disabled), "Legacy singleton demo snapshots must retain global blocking")
  updateTasks([])
  assert(!button("发送").disabled && retries().every(element => !element.disabled), "Modern empty task lists must restore this thread's controls")
  result.textContent = "PASS: selected A versus idle B composer/suggestions, own-thread immediate guards, isolated stop, model snapshot, retry, legacy singleton fallback"
  result.dataset.passed = "true"
} catch (error) { result.textContent = `FAIL: ${error.stack}`; result.dataset.passed = "false"; throw error }
finally { stopAck.resolve(); root.unmount() }
</script>
