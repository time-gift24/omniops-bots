<!doctype html>
<meta charset="utf-8" />
<title>Reading navigation and animation lifecycle regression</title>
<!-- Run npm run dev, then open /tests/reading-navigation.browser.html. -->
<style>#fixture { width: 1800px; height: 650px; } #fixture > div { height: 100%; } #result { white-space: pre-wrap; }</style>
<div id="fixture"></div>
<div id="probe"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { createTestDependencies, withDependencies } from "/tests/support.tsx";
  import { AgentBuilder } from "/src/components/premium/agent-builder/agent-builder.tsx";
  import { SkillScreen } from "/src/components/skills/skill-screen.tsx";
  import { BranchedMenu } from "/src/components/skills/branched-menu.tsx";
  import { useHeadingScroll } from "/src/components/markdown/markdown-reading.tsx";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const root = createRoot(fixture);
  const probeRoot = createRoot(document.querySelector("#probe"));
  const dependencies = createTestDependencies();
  const h = React.createElement;
  const wait = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const until = async (condition, message) => {
    const deadline = performance.now() + 5000;
    while (!condition() && performance.now() < deadline) await wait();
    assert(condition(), message);
  };
  const paragraphs = (label, count = 20) => Array.from({ length: count }, (_, index) => `${label} 阅读段落 ${index + 1}。`).join("\n\n");
  const outlineHeadings = [
    ["总览", 1], ["共享章节", 2], ["三级章节", 3], ["四级章节", 4],
    ["五级章节", 5], ["六级章节", 6], ["返回三级", 3], ["尾部章节", 2],
    ["跳级四级", 4], ["第二总览", 1], ["另一组章节", 2], ["另一组细节", 3],
  ];
  const markdown = (label, guide = false) => `# 总览\n\n${guide
    ? "[回到主文件](../SKILL.md#共享章节)"
    : "[本页定位](#共享章节)\n\n[跨文件定位](reference/guide.md#共享章节)"}\n\n${paragraphs(label)}\n\n${outlineHeadings.slice(1).map(([heading, level]) => `${"#".repeat(level)} ${heading}\n\n${paragraphs(label, level > 2 ? 4 : 20)}`).join("\n\n")}`;
  const skills = ["FIRST", "SECOND"].map((label, index) => ({
    id: `reading-${index}`, name: `${label} skill`, description: "Reading navigation fixture",
    files: [
      { path: "SKILL.md", content: markdown(`${label}_MAIN`) },
      { path: "reference/guide.md", content: markdown(`${label}_GUIDE`, true) },
    ],
  }));
  const agent = {
    name: "Reading agent", description: "Reading navigation fixture", instructions: markdown("AGENT"),
    mcpServerIds: [], toolIds: [], skillIds: [], requireApproval: false,
  };
  function Pages({ visible, skillId }) {
    const [toolbarTarget, setToolbarTarget] = React.useState(null);
    return h("div", { className: "flex h-full min-h-0 flex-col" },
      h("header", { className: "@container/skill-header flex h-12 shrink-0 items-center gap-2 px-4" },
        h("span", { className: "min-w-0 flex-1 truncate" }, visible === "skill" ? skills.find(skill => skill.id === skillId).name : agent.name),
        h("div", { ref: setToolbarTarget, className: "flex shrink-0 items-center" })),
      h("div", { className: "min-h-0 flex-1" },
        h("div", { id: "skill-page", className: "h-full min-h-0", style: { display: visible === "skill" ? "block" : "none" } },
          h(SkillScreen, { skills, skillId, active: visible === "skill" })),
        h("div", { id: "agent-page", className: "h-full min-h-0", style: { display: visible === "agent" ? "block" : "none" } },
          h(AgentBuilder, { initialConfiguration: agent, mcpServers: [], tools: [], skills: [], active: visible === "agent", toolbarTarget: visible === "agent" ? toolbarTarget : null, onSave() {} }))),
    );
  }
  const render = (visible, skillId = skills[0].id) => flushSync(() => root.render(withDependencies(h(Pages, { visible, skillId }), dependencies)));
  const page = name => fixture.querySelector(`#${name}-page`);
  const scroll = name => page(name).querySelector(".doc-reading-scroll");
  const heading = (name, label = "共享章节") => page(name).querySelector(`[data-docs-section="${label}"]`);
  const outline = name => page(name).querySelector('nav[aria-label="本页目录"]');
  const outlineButton = (name, label) => [...outline(name).querySelectorAll("button")].find(button => button.textContent.trim() === label);
  const outlineToggle = (name, action, label) => [...outline(name).querySelectorAll("button")].find(button =>
    button.getAttribute("aria-label")?.replace(/\s/g, "") === `${action}${label}`);
  const activeHeading = name => outline(name)?.querySelector('[aria-current="true"]')?.textContent.trim();
  const click = element => { assert(element, "Expected navigation control is missing"); flushSync(() => element.click()); };
  const checkActions = async name => {
    const dock = page(name).querySelector('[data-slot="document-actions"]');
    assert(dock && !dock.closest("header") && !fixture.querySelector("header button"), "Document actions must stay in the body, outside the shared Header");
    assert(dock.querySelector('button[aria-label="编辑"]'), "The active document must expose editing in its dock");
    if (name === "skill") assert(dock.querySelector('button[aria-label="浏览技能文件"]'), "File navigation and editing must share one Skill dock");
    assert(!page(name === "skill" ? "agent" : "skill").querySelector('[data-slot="document-actions"]'), "Inactive pages must not retain document actions");
    fixture.style.width = `${innerWidth}px`;
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const bounds = dock.getBoundingClientRect();
    const body = page(name).querySelector('[data-slot="document-body"]');
    const bodyBounds = body.getBoundingClientRect();
    assert(!body.contains(dock), `${name} actions must remain outside the bordered document body`);
    assert(Math.abs(bounds.left - bodyBounds.left) <= 1 && bounds.bottom <= bodyBounds.top + 1,
      `${name} actions must align with the frame's left edge above its outer border`);
    for (const section of [...body.querySelectorAll('.doc-reading-scroll, .skill-file-sidebar, aside[aria-label="Agent 配置"]')].filter(element => element.getClientRects().length > 0)) {
      assert(section.getBoundingClientRect().top >= bounds.bottom - 1,
        `${name} content and sidebar must start below the horizontal action row`);
    }
    const controls = [...dock.querySelectorAll("button")].filter(button => button.getClientRects().length > 0);
    const primary = [...dock.querySelectorAll("button")].find(action => action.getAttribute("aria-label") === "编辑" || action.getAttribute("aria-label")?.startsWith("保存"));
    assert(primary && getComputedStyle(primary).backgroundColor !== "rgba(0, 0, 0, 0)",
      `${name} edit/save must carry a filled background`);
    assert(controls[0] === primary, `${name} edit/save must start the horizontal action row`);
    for (const [index, control] of controls.entries()) {
      const bounds = control.getBoundingClientRect();
      assert(bounds.left >= -1 && bounds.right <= innerWidth + 1, `${name} body action must fit the viewport`);
      assert(control.getAttribute("aria-label") && control.textContent.trim() === "",
        "Body actions must remain accessible icon buttons");
      if (index) {
        const previous = controls[index - 1].getBoundingClientRect();
        assert(previous.right <= bounds.left + 1 && Math.abs((previous.top + previous.bottom) / 2 - (bounds.top + bounds.bottom) / 2) <= 1, `${name} actions must form one horizontal row without overlap`);
      }
    }
    fixture.style.width = "1800px";
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  };
  const link = label => [...page("skill").querySelectorAll(".doc-preview a")].find(anchor => anchor.textContent === label);
  const aligned = (name, label = "共享章节") => {
    const container = scroll(name);
    const target = heading(name, label);
    return container.scrollTop > 100 && Math.abs(target.getBoundingClientRect().top - container.getBoundingClientRect().top - 32) < 3;
  };
  const checkOutlineHierarchy = name => {
    const buttons = [...outline(name).querySelectorAll("button")].filter(button => !/^(收起|展开)/.test(button.getAttribute("aria-label") ?? ""));
    assert(JSON.stringify(buttons.map(button => button.textContent.trim())) === JSON.stringify(outlineHeadings.map(([label]) => label)),
      `${name} outline must include h1–h6 in document order without invented headings`);
    const textLeft = label => {
      const walker = document.createTreeWalker(outlineButton(name, label), NodeFilter.SHOW_TEXT);
      for (let node = walker.nextNode(); node; node = walker.nextNode()) {
        if (node.textContent.trim() !== label) continue;
        const range = document.createRange();
        range.selectNodeContents(node);
        return range.getBoundingClientRect().left;
      }
      throw new Error(`Missing outline text: ${label}`);
    };
    const base = textLeft("总览");
    const firstChild = textLeft("共享章节");
    const indent = textLeft("三级章节") - firstChild;
    assert(indent > 0 && firstChild - base > indent,
      `${name} outline must reserve the first branch indentation and indent deeper headings consistently`);
    for (const [label, level] of outlineHeadings) assert(Math.abs(textLeft(label) - (level === 1 ? base : firstChild + (level - 2) * indent)) <= 1,
      `${name} outline must align level ${level} for ${label}, including returning to parents and skipped levels`);
  };
  const checkOutlineBranches = async name => {
    await until(() => [...outline(name).querySelectorAll("svg.branched-menu__lines")].some(svg =>
      svg.getBoundingClientRect().width > 0 && svg.getBoundingClientRect().height > 0 && Number(getComputedStyle(svg).opacity) > 0 &&
      [...svg.querySelectorAll("path.branched-menu__base")].some(path => path.getTotalLength() > 0 && getComputedStyle(path).stroke !== "none")),
      `${name} outline must render visible tree branch lines like the file menu`);
  };
  const checkActiveBranch = async (name, label) => {
    await until(() => [...outline(name).querySelectorAll("svg.branched-menu__lines path.branched-menu__reach")].some(path => {
      const style = getComputedStyle(path);
      const base = path.parentElement.querySelector("path.branched-menu__base");
      if (!base || Number(getComputedStyle(path.parentElement).opacity) === 0 || Math.abs(Number.parseFloat(style.strokeDashoffset)) >= 0.01 ||
        style.stroke === "none" || style.stroke === getComputedStyle(base).stroke) return false;
      const end = path.getPointAtLength(path.getTotalLength());
      const point = new DOMPoint(end.x, end.y).matrixTransform(path.getScreenCTM());
      const row = outlineButton(name, label).getBoundingClientRect();
      return Math.abs(point.y - (row.top + row.bottom) / 2) <= 1;
    }), `${name} active branch must highlight the path to ${label}`);
  };
  const checkParentNavigation = async name => {
    click(outlineButton(name, "总览"));
    await until(() => scroll(name).scrollTop < 1 && activeHeading(name) === "总览",
      `${name} parent heading must navigate to its document position`);
    checkOutlineHierarchy(name);
    for (const [label] of outlineHeadings) {
      const row = outlineButton(name, label);
      const rectangle = row.getBoundingClientRect();
      const fold = row.closest(".branched-menu__fold")?.getBoundingClientRect();
      assert(rectangle.width > 0 && rectangle.height > 0 && row.tabIndex >= 0 && (!fold ||
        (rectangle.top >= fold.top - 1 && rectangle.bottom <= fold.bottom + 1)),
        `${name} parent navigation must keep ${label} visible and keyboard reachable`);
    }
  };
  const outlineRowVisible = (name, label) => {
    const row = outlineButton(name, label);
    if (!row || row.closest('[hidden], [inert], [aria-hidden="true"]') || getComputedStyle(row).visibility === "hidden") return false;
    const bounds = row.getBoundingClientRect();
    let top = bounds.top;
    let bottom = bounds.bottom;
    for (let parent = row.parentElement; parent && outline(name).contains(parent); parent = parent.parentElement) {
      if (["hidden", "clip"].includes(getComputedStyle(parent).overflowY)) {
        const clip = parent.getBoundingClientRect();
        top = Math.max(top, clip.top);
        bottom = Math.min(bottom, clip.bottom);
      }
    }
    return bounds.width > 0 && bottom - top > 0.5;
  };
  const checkCollapsedRows = async (name, labels) => {
    await until(() => labels.every(label => !outlineRowVisible(name, label)), `${name} collapsed headings must hide all descendants`);
    for (const label of labels) {
      const row = outlineButton(name, label);
      assert(!row || row.tabIndex < 0 || row.getClientRects().length === 0 || row.closest("[hidden], [inert]") || getComputedStyle(row).visibility === "hidden",
        `${name} collapsed descendant ${label} must leave keyboard navigation`);
    }
  };
  const checkOutlineFolding = async name => {
    for (const label of ["总览", "共享章节", "三级章节", "四级章节", "五级章节", "尾部章节", "第二总览", "另一组章节"]) {
      assert(outlineToggle(name, "收起", label)?.getAttribute("aria-expanded") === "true",
        `${name} parent ${label} must have a separate collapse control and start expanded`);
    }
    assert(outlineHeadings.every(([label]) => outlineRowVisible(name, label)), `${name} all root groups must start expanded`);
    for (const [label, children, sibling] of [
      ["三级章节", ["四级章节", "五级章节", "六级章节"], "返回三级"],
      ["四级章节", ["五级章节", "六级章节"], "返回三级"],
      ["五级章节", ["六级章节"], "返回三级"],
      ["尾部章节", ["跳级四级"], "共享章节"],
      ["另一组章节", ["另一组细节"], "共享章节"],
    ]) {
      click(outlineToggle(name, "收起", label));
      await checkCollapsedRows(name, children);
      assert(outlineRowVisible(name, sibling), `${name} collapsing ${label} must not hide its sibling branch`);
      click(outlineToggle(name, "展开", label));
      await until(() => children.every(child => outlineRowVisible(name, child) && outlineButton(name, child).tabIndex >= 0),
        `${name} expanding ${label} must restore selectable descendants`);
    }
    click(outlineToggle(name, "收起", "共享章节"));
    await checkCollapsedRows(name, ["三级章节", "四级章节", "五级章节", "六级章节", "返回三级"]);
    assert(outlineRowVisible(name, "尾部章节") && outlineRowVisible(name, "另一组细节"), `${name} an inner fold must preserve sibling and other-root branches`);
    click(outlineToggle(name, "收起", "总览"));
    await checkCollapsedRows(name, outlineHeadings.slice(1, 9).map(([label]) => label));
    assert(outlineRowVisible(name, "第二总览") && outlineRowVisible(name, "另一组细节"), `${name} collapsing one root must preserve the other root`);
    click(outlineToggle(name, "展开", "总览"));
    await until(() => outlineRowVisible(name, "共享章节") && outlineRowVisible(name, "跳级四级"), `${name} reopening a root must restore its expanded branches`);
    assert(outlineToggle(name, "展开", "共享章节")?.getAttribute("aria-expanded") === "false", `${name} reopening a root must preserve an inner collapsed state`);
    await checkCollapsedRows(name, ["三级章节", "四级章节", "五级章节", "六级章节", "返回三级"]);
    click(outlineButton(name, "共享章节"));
    await until(() => aligned(name) && activeHeading(name) === "共享章节", `${name} collapsed parent text must still navigate to its heading`);
    assert(outlineToggle(name, "展开", "共享章节")?.getAttribute("aria-expanded") === "false", `${name} heading navigation must not toggle its collapsed state`);
    click(outlineToggle(name, "展开", "共享章节"));
    await until(() => outlineHeadings.every(([label]) => outlineRowVisible(name, label)), `${name} expanding the inner branch must restore the full outline`);
    await checkOutlineBranches(name);
    checkOutlineHierarchy(name);
  };
  const uniqueIds = () => {
    const ids = [...fixture.querySelectorAll("[id]")].map(element => element.id);
    assert(ids.length === new Set(ids).size, "Simultaneously mounted pages must not duplicate HTML IDs");
  };
  let writes = 0;
  let top = 0;
  let startScroll;
  const scrolling = document.createElement("div");
  Object.defineProperty(scrolling, "scrollTop", { get: () => top, set: value => { top = value; writes += 1; } });
  const resolve = () => scrolling;
  function ScrollProbe({ targetKey }) {
    const { scrollToY } = useHeadingScroll(resolve, targetKey);
    startScroll = scrollToY;
    return null;
  }
  const renderProbe = targetKey => flushSync(() => probeRoot.render(withDependencies(h(ScrollProbe, { targetKey }), dependencies)));
  let probeMounted = true;
  try {
    flushSync(() => probeRoot.render(h(BranchedMenu, {
      items: [{ label: "这是一段需要截断的很长的目录根标题，用于验证箭头与标题不会重叠", value: "long-title", children: [{ label: "子章节", value: "child" }] }],
      active: "long-title", selectableParents: true, defaultOpen: "all", width: 180,
    })));
    const probe = document.querySelector("#probe");
    assert(probe.querySelector(".branched-menu__head .branched-menu__label").getBoundingClientRect().right <=
      probe.querySelector(".branched-menu__toggle").getBoundingClientRect().left + 1,
      "A long active root heading must leave the disclosure button clear");
    render("agent");
    await until(() => heading("skill") && heading("agent") && outline("agent"), "Both real reading pages must mount");
    assert(!fixture.querySelector(".skill-doc-bar"), "Skill content must not retain the old document toolbar");
    assert(!fixture.querySelector("header button"), "An inactive Skill page must not render Header controls");
    await checkActions("agent");
    uniqueIds();
    assert(heading("skill").id !== heading("agent").id, "Matching Chinese headings must have distinct document IDs");
    await checkOutlineBranches("agent");
    checkOutlineHierarchy("agent");
    await checkOutlineFolding("agent");
    const hiddenSkillScroll = scroll("skill").scrollTop;
    click(outlineButton("agent", "共享章节"));
    await until(() => aligned("agent"), "Agent outline must scroll its own heading past the hidden Skill page");
    await until(() => activeHeading("agent") === "共享章节", "Agent scrollspy must highlight its own heading");
    await checkActiveBranch("agent", "共享章节");
    click(outlineButton("agent", "六级章节"));
    await until(() => aligned("agent", "六级章节"), "Agent outline must navigate to a level-six heading");
    await until(() => activeHeading("agent") === "六级章节", "Agent scrollspy must highlight level-six headings");
    await checkActiveBranch("agent", "六级章节");
    await checkParentNavigation("agent");
    assert(scroll("skill").scrollTop === hiddenSkillScroll, "Agent navigation must not scroll the hidden Skill page");

    render("skill", skills[1].id);
    await until(() => page("skill").querySelector(".doc-preview")?.textContent.includes("SECOND_MAIN"), "Switching Skill must render its current file");
    await until(() => page("skill").querySelector('[data-slot="document-actions"] button[aria-label="浏览技能文件"]') && page("skill").querySelector('[data-slot="document-actions"] button[aria-label="编辑"]'),
      "The active Skill page must keep file navigation and Edit in the same body dock");
    await checkActions("skill");
    uniqueIds();
    await checkOutlineBranches("skill");
    checkOutlineHierarchy("skill");
    await checkOutlineFolding("skill");
    const hiddenAgentScroll = scroll("agent").scrollTop;
    click(outlineButton("skill", "六级章节"));
    await until(() => aligned("skill", "六级章节"), "Skill outline must navigate to a level-six heading");
    await until(() => activeHeading("skill") === "六级章节", "Skill scrollspy must highlight level-six headings");
    await checkActiveBranch("skill", "六级章节");
    await checkParentNavigation("skill");
    click(link("本页定位"));
    await until(() => aligned("skill"), "Same-file hash must scroll the current Skill container");
    await until(() => activeHeading("skill") === "共享章节", "Skill scrollspy must highlight its own heading");
    click(link("跨文件定位"));
    await until(() => page("skill").querySelector(".doc-preview")?.textContent.includes("SECOND_GUIDE") && aligned("skill"), "Cross-file hash must target the switched Skill's reference file");
    uniqueIds();
    click(link("回到主文件"));
    await until(() => page("skill").querySelector(".doc-preview")?.textContent.includes("SECOND_MAIN") && aligned("skill"), "Returning across files must resolve the current document heading");
    assert(scroll("agent").scrollTop === hiddenAgentScroll, "Skill links must not scroll the hidden Agent page");
    uniqueIds();
    render("agent", skills[1].id);
    assert(!fixture.querySelector("header button"), "Leaving Skill must remove its shared Header controls");

    renderProbe("first");
    startScroll(10000);
    await until(() => writes > 0, "The real scroll hook must begin updating its target");
    renderProbe("second");
    const afterTargetChange = writes;
    await wait(180);
    assert(writes === afterTargetChange, "Changing targetKey must stop the previous animation");
    startScroll(0);
    await until(() => writes > afterTargetChange, "The new target must still support scrolling");
    probeRoot.unmount();
    probeMounted = false;
    const afterUnmount = writes;
    await wait(180);
    assert(writes === afterUnmount, "Unmounting must stop all later scroll writes");
    result.dataset.passed = "true";
    result.textContent = "PASS: Agent/Skill h1–h6 tree branches, nested folding with retained state, active paths and independent heading navigation; deep-heading scrollspy; isolated headings and unique IDs; switched Skill same/cross-file links; scroll cleanup on target change and unmount";
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}`;
    throw error;
  } finally {
    if (probeMounted) probeRoot.unmount();
    root.unmount();
  }
</script>
