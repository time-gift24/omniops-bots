<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desktop approval flow regression</title>
<!-- Run npm run dev, then open /tests/desktop-flow.browser.html. Add ?preview for the pending-approval view. -->
<div id="fixture"></div>
<pre
  id="result"
  style="
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 100;
    max-width: 100%;
    font-size: 11px;
    white-space: pre-wrap;
    background: Canvas;
    color: CanvasText;
  "
>
Running…</pre>
<script type="module">
  import React from "react"
  import { createRoot } from "react-dom/client"
  import { flushSync } from "react-dom"
  import "/src/index.css"
  import { App } from "/src/App.tsx"
  import { createDemoDesktopRuntime } from "/src/adapters/demo/desktop.ts"
  import { createTestDependencies, withTestTheme } from "/tests/support.tsx"

  const fixture = document.querySelector("#fixture")
  const result = document.querySelector("#result")
  const runtime = createDemoDesktopRuntime({ delayMs: 40 })
  const dependencies = createTestDependencies(runtime)
  const workspace = dependencies.workspaces.addWorkspace({
    name: "omniops-bots",
    path: "/demo/omniops-bots",
  })
  const session = dependencies.workspaces.startSession(workspace.id)
  const thread = dependencies.threads.get(session)
  const root = createRoot(fixture)
  const assert = (condition, message) => {
    if (!condition) throw new Error(message)
  }
  const until = async (condition, message) => {
    const deadline = performance.now() + 8000
    while (!condition() && performance.now() < deadline)
      await new Promise((resolve) => setTimeout(resolve, 20))
    assert(condition(), message)
  }
  const button = (name) =>
    [...fixture.querySelectorAll("button")].find(
      (element) =>
        element.getAttribute("aria-label") === name ||
        element.textContent.trim() === name
    )
  const click = (name) => {
    const target = button(name)
    assert(target && !target.disabled, `Missing enabled control: ${name}`)
    flushSync(() => target.click())
  }
  const panel = () => fixture.querySelector('[data-slot="approval-panel"]')
  const composer = () =>
    fixture.querySelector('[data-slot="chat-composer-anchor"]')
  const task = () => runtime.desktop.getState().task
  const browser = () => runtime.desktop.getState().browser
  const start = () =>
    flushSync(() =>
      assert(
        thread.send("打开 Chrome，访问必应并输入 abcd，不提交搜索"),
        "Demo task was not accepted"
      )
    )

  try {
    flushSync(() =>
      root.render(withTestTheme(React.createElement(App), dependencies))
    )
    await until(() => composer() && button("收起工作台"), "App did not load")
    click("收起工作台")
    await until(() => button("打开工作台"), "Workbench did not collapse")
    start()
    await until(
      () => panel() && fixture.querySelector('[aria-label="地址栏"]'),
      "Browser call must reveal workbench and approval before execution"
    )
    assert(
      browser().url === "" && task().phase === "awaiting-approval",
      "Unapproved navigation executed"
    )
    const currentApproval = task().approval.id
    await until(
      () =>
        composer().getBoundingClientRect().top >
        panel().getBoundingClientRect().bottom,
      "Approval must float above composer"
    )
    if (new URLSearchParams(location.search).has("preview")) {
      result.remove()
    } else {
      const before = composer().getBoundingClientRect().top
      click("收起审批")
      assert(
        !panel() && task().approval.id === currentApproval,
        "Collapsing must keep approval pending"
      )
      assert(
        Math.abs(composer().getBoundingClientRect().top - before) < 1,
        "Collapsing approval moved composer"
      )
      click("等待批准")
      assert(panel(), "Collapsed approval must reopen")

      const otherSession = dependencies.workspaces.startSession(workspace.id)
      const other = dependencies.threads.get(otherSession)
      flushSync(() => other.updateDraft({ text: "留在另一会话的草稿" }))
      await until(
        () => !panel() && button("发送")?.disabled,
        "Other session must not approve or send while occupied"
      )
      assert(
        other.getDraft().text === "留在另一会话的草稿",
        "Blocked session lost draft"
      )
      flushSync(() => dependencies.workspaces.selectSession(session))
      await until(() => panel(), "Return to task did not restore approval")

      click("允许此操作")
      await until(
        () =>
          task()?.approval && task().approval.id !== currentApproval && panel(),
        "Second operation must require fresh approval"
      )
      assert(
        browser().url === "https://www.bing.com/" &&
          browser().preview.field.value === "",
        "Second operation ran before approval"
      )
      click("允许此操作")
      await until(
        () => task() === null && thread.getState().status === "idle",
        "Approved task did not complete"
      )
      assert(
        browser().preview.field.value === "abcd",
        "Approved fill did not appear in browser"
      )

      start()
      await until(() => panel(), "Second task did not request approval")
      const rejected = task().approval
      click("拒绝此操作")
      await until(
        () => task()?.approval && task().approval.id !== rejected.id && panel(),
        "Reject must permit a different plan"
      )
      assert(
        task().approval.toolName !== rejected.toolName,
        "Rejected operation was retried unchanged"
      )
      assert(
        browser().preview.field.value === "abcd",
        "Rejected navigation changed current page"
      )
      click("停止任务")
      await until(
        () => task() === null && thread.getState().status === "idle",
        "Stop must release the task after acknowledgement"
      )
      assert(!panel(), "Stopped task retained actionable approval")
      flushSync(() => dependencies.workspaces.selectSession(otherSession))
      await until(
        () => button("发送") && !button("发送").disabled,
        "Next session did not regain send"
      )
      assert(
        other.getDraft().text === "留在另一会话的草稿",
        "Switching back lost draft"
      )
      result.textContent =
        "PASS: automatic browser reveal, pre-execution approval, anchored popover, cross-session ownership, sequential approvals, changed plan after rejection, stop and draft preservation"
      result.dataset.status = "passed"
    }
  } catch (error) {
    result.textContent = `FAIL: ${error.stack || error}`
    result.dataset.status = "failed"
    console.error(error)
  }
</script>
