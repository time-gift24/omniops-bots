<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>beUI controls behavior regression</title>
<!-- Run npm run dev, then open /tests/beui-controls.browser.html.
     After PASS, press Enter in #enter-input using real browser input; #enter-count must become 1.
     Then click #toggle-enter-submit and press Enter again; the count must stay 1.
     Synthetic KeyboardEvent cannot exercise a browser's native implicit form submission. -->
<style>#fixture { padding: 24px; } form { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; } #result { white-space: pre-wrap; }</style>
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { Button } from "/src/components/motion/button.tsx";
  import { Input } from "/src/components/motion/input.tsx";
  import { Tabs, TabsList, TabsTrigger, TabsContent } from "/src/components/motion/tabs.tsx";
  import { Select } from "/src/components/premium/select/select.tsx";
  import { AnimatedModal, AnimatedModalTitle, AnimatedModalDescription } from "/src/components/motion/animated-modal.tsx";
  import { AnimatedDropdown as DropdownMenu, AnimatedDropdownTrigger as DropdownMenuTrigger, AnimatedDropdownContent as DropdownMenuContent, AnimatedDropdownItem as DropdownMenuItem } from "/src/components/premium/animated-dropdown/index.tsx";

  const h = React.createElement;
  const result = document.querySelector("#result");
  const checks = [];
  const wait = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const until = async (condition, message) => {
    const deadline = performance.now() + 5000;
    while (!condition() && performance.now() < deadline) await wait();
    assert(condition(), message);
  };
  const click = element => flushSync(() => element.click());
  const key = value => flushSync(() => document.activeElement.dispatchEvent(
    new KeyboardEvent("keydown", { key: value, bubbles: true, cancelable: true }),
  ));
  const fill = (input, value) => flushSync(() => {
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(input, value);
    input.dispatchEvent(new Event("input", { bubbles: true }));
  });
  const activeOption = () => {
    const listbox = document.querySelector('[role="listbox"]');
    return document.getElementById(listbox?.getAttribute("aria-activedescendant"))?.textContent;
  };
  const fieldRef = React.createRef();
  const buttonRef = React.createRef();
  const inputChanges = [];
  let submits = 0;
  let plainClicks = 0;
  let disabledClicks = 0;
  let enterSubmits = 0;
  const paneMounts = { first: 0, second: 0 };
  function RetainedPane({ name }) {
    const [count, setCount] = React.useState(0);
    React.useEffect(() => { paneMounts[name] += 1; }, [name]);
    return h(Button, { id: `increment-${name}`, onClick: () => setCount(value => value + 1) }, `${name}: ${count}`);
  }
  function TabsFixture() {
    const [selected, setSelected] = React.useState("first");
    const [secondOpen, setSecondOpen] = React.useState(true);
    return h(Tabs, { value: selected, onValueChange: setSelected, variant: "segment" },
      h(TabsList, { "aria-label": "Fixture tabs" },
        h(TabsTrigger, { value: "first", id: "tab-first", "aria-controls": "panel-first" }, "First"),
        h(TabsTrigger, { value: "disabled", disabled: true, id: "tab-disabled" }, "Disabled"),
        secondOpen ? h("div", { className: "flex" },
          h(TabsTrigger, { value: "second", id: "tab-second", "aria-controls": "panel-second" }, "Second"),
          h(Button, { id: "close-second", "aria-label": "Close second", onClick: () => { setSecondOpen(false); setSelected("first"); } }, "Close")) : null),
      h(TabsContent, { value: "first", id: "panel-first", "aria-labelledby": "tab-first" }, h(RetainedPane, { name: "first" })),
      secondOpen ? h(TabsContent, { value: "second", id: "panel-second", "aria-labelledby": "tab-second" }, h(RetainedPane, { name: "second" })) : null);
  }

  function Fixture() {
    const [dialogOpen, setDialogOpen] = React.useState(false);
    const [model, setModel] = React.useState("alpha");
    const [enterDisabled, setEnterDisabled] = React.useState(false);
    return h(React.Fragment, null,
      h(TabsFixture),
      h("form", { id: "controls-form", onSubmit: event => { event.preventDefault(); submits += 1; } },
        h(Input, {
          id: "validated-input", ref: fieldRef, name: "name", required: true,
          pattern: "[A-Z]{2,4}", maxLength: 4, "aria-label": "Validated name",
          onChange: value => inputChanges.push(value),
          "aria-describedby": "name-help", "aria-invalid": true,
        }),
        h("span", { id: "name-help" }, "Use two to four uppercase letters"),
        h(Input, { id: "number-input", name: "amount", type: "number", min: 2, max: 10, step: 2, defaultValue: "4", "aria-label": "Amount" }),
        h(Button, { id: "plain-button", ref: buttonRef, onClick: () => { plainClicks += 1; } }, "Default action"),
        h(Button, { id: "submit-button", type: "submit" }, "Submit"),
        h(Button, { id: "disabled-button", type: "submit", disabled: true, onClick: () => { disabledClicks += 1; } }, "Disabled submit")),
      h("form", { id: "enter-form", onSubmit: event => {
        event.preventDefault(); enterSubmits += 1;
        document.querySelector("#enter-count").textContent = String(enterSubmits);
      } },
        h(Input, { id: "enter-input", name: "query", defaultValue: "native-enter", "aria-label": "Native Enter submission" }),
        h(Button, { id: "enter-submit", type: "submit", disabled: enterDisabled }, "Native Enter submit"),
        h("output", { id: "enter-count", "aria-label": "Native Enter submit count" }, "0")),
      h(Button, { id: "toggle-enter-submit", onClick: () => setEnterDisabled(disabled => !disabled) }, "Toggle native Enter submit disabled"),
      h(Button, { id: "dialog-trigger", "aria-haspopup": "dialog", onClick: () => setDialogOpen(true) }, "Open model dialog"),
      h(AnimatedModal, { open: dialogOpen, onOpenChange: setDialogOpen, panelClassName: "grid gap-4 p-6", showCloseButton: true },
          h(AnimatedModalTitle, null, "Model selection"),
          h(AnimatedModalDescription, null, "Choose a model without closing the dialog."),
          h(Select, {
            options: [{ id: "alpha", label: "Alpha" }, { id: "blocked", label: "Unavailable", disabled: true }, { id: "beta", label: "Beta" }],
            value: model, onValueChange: setModel, label: "Fixture model", portal: true,
          }),
          h("output", { id: "selected-model" }, model)),
      h(DropdownMenu, null,
        h(DropdownMenuTrigger, { asChild: true }, h(Button, { id: "menu-trigger" }, "Open action menu")),
        h(DropdownMenuContent, null, h(DropdownMenuItem, null, "Menu action"))),
    );
  }

  window.__beuiControlsResult = { status: "running", checks };
  const root = createRoot(document.querySelector("#fixture"));
  try {
    flushSync(() => root.render(h(Fixture)));
    await until(() => document.querySelector("#plain-button"), "Controls did not mount");
    const input = document.querySelector("#validated-input");
    const number = document.querySelector("#number-input");
    const plain = document.querySelector("#plain-button");
    assert(fieldRef.current === input && buttonRef.current === plain, "Input and Button must forward their DOM refs");
    input.focus();
    assert(document.activeElement === input, "Input ref must support focusing the actual field");
    assert(input.required && input.maxLength === 4 && input.pattern === "[A-Z]{2,4}", "Input must preserve required, maxLength and pattern");
    assert(input.getAttribute("aria-describedby") === "name-help" && input.getAttribute("aria-invalid") === "true", "Input must preserve validation ARIA attributes");
    assert(input.validity.valueMissing && !input.checkValidity(), "An empty required Input must remain invalid");
    fill(input, "lower");
    assert(input.validity.patternMismatch && !input.checkValidity(), "Input must retain native pattern validation");
    fill(input, "AB");
    assert(input.checkValidity(), "A valid Input must pass native validation");
    assert(inputChanges.at(-1) === "AB", "Input onChange must receive the edited string value");
    assert(number.type === "number" && number.min === "2" && number.max === "10" && number.step === "2", "Number Input must preserve its type and constraints");
    fill(number, "1");
    assert(number.validity.rangeUnderflow, "Number Input must enforce min");
    fill(number, "11");
    assert(number.validity.rangeOverflow, "Number Input must enforce max");
    fill(number, "3");
    assert(number.validity.stepMismatch, "Number Input must enforce step");
    fill(number, "4");
    assert(number.checkValidity(), "A valid number must pass native validation");
    checks.push("Input DOM refs, native text/number validation and ARIA passthrough");

    click(plain);
    assert(plain.type === "button" && plainClicks === 1 && submits === 0, "Default Button must fire its action without submitting a form");
    click(document.querySelector("#submit-button"));
    assert(submits === 1, "Explicit submit Button must submit a valid form");
    click(document.querySelector("#disabled-button"));
    assert(submits === 1 && disabledClicks === 0, "Disabled Button must neither click nor submit");
    fill(input, "");
    click(document.querySelector("#submit-button"));
    assert(submits === 1, "Button submission must respect native required validation");
    fill(input, "AB");
    checks.push("Button default type, explicit form submission, disabled state and validation");

    const dialogTrigger = document.querySelector("#dialog-trigger");
    dialogTrigger.focus();
    click(dialogTrigger);
    await until(() => document.querySelector('[role="dialog"]'), "AnimatedModal must open from a beUI Button");
    const modelTrigger = () => document.querySelector('button[aria-label="Fixture model"]');
    modelTrigger().focus();
    key("ArrowDown");
    await until(() => document.activeElement === document.querySelector('[role="listbox"]'), "Select must open and receive keyboard focus inside a dialog");
    await until(() => activeOption() === "Alpha", "Select must start keyboard navigation at its selected option");
    key("ArrowDown");
    await until(() => activeOption() === "Beta", "Select keyboard navigation must skip a disabled option");
    key("Enter");
    await until(() => document.querySelector("#selected-model")?.textContent === "beta" && !document.querySelector('[role="listbox"]'), "Select keyboard choice must skip a disabled option and update its value");
    await until(() => document.activeElement === modelTrigger(), "Selecting an option must restore Select trigger focus");
    assert(document.querySelector('[role="dialog"]'), "Selecting an option must keep the parent dialog open");
    key("ArrowDown");
    await until(() => document.activeElement === document.querySelector('[role="listbox"]'), "Select must reopen and receive focus after selection");
    key("Escape");
    await until(() => !document.querySelector('[role="listbox"]') && document.activeElement === modelTrigger(), "Select Escape must close its options and restore trigger focus");
    assert(document.querySelector('[role="dialog"]'), "Select Escape must not dismiss its parent dialog");
    key("Escape");
    await until(() => !document.querySelector('[role="dialog"]') && document.activeElement === dialogTrigger, "Dialog Escape must restore its beUI opener");
    checks.push("Dialog Select keyboard choice, disabled option, nested Escape and focus restoration");

    const menuTrigger = document.querySelector("#menu-trigger");
    menuTrigger.focus();
    flushSync(() => {
      menuTrigger.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true, button: 0, isPrimary: true, pointerType: "mouse" }));
      menuTrigger.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, cancelable: true, button: 0, isPrimary: true, pointerType: "mouse" }));
      menuTrigger.click();
    });
    await until(() => document.querySelector('[role="menu"]'), "DropdownMenuTrigger asChild must forward pointer events through a beUI Button");
    key("Escape");
    await until(() => !document.querySelector('[role="menu"]') && document.activeElement === menuTrigger, "Menu Escape must restore its beUI trigger");
    key("Enter");
    await until(() => document.querySelector('[role="menu"]')?.contains(document.activeElement), "DropdownMenuTrigger asChild must open once by keyboard and focus its menu");
    key("Escape");
    await until(() => !document.querySelector('[role="menu"]') && document.activeElement === menuTrigger, "Keyboard-opened menu Escape must restore its beUI trigger");
    checks.push("DropdownMenu asChild pointer/keyboard opening and Escape focus restoration");

    const first = document.querySelector("#tab-first");
    click(document.querySelector("#increment-first"));
    first.focus();
    key("ArrowRight");
    await until(() => document.activeElement?.id === "tab-second" && document.querySelector("#tab-second").getAttribute("aria-selected") === "true", "ArrowRight must skip disabled tabs and activate the next tab");
    assert(document.querySelector("#panel-first").hidden && !document.querySelector("#panel-second").hidden, "Tab panels must expose the selected panel");
    click(document.querySelector("#increment-second"));
    document.querySelector("#tab-second").focus();
    key("Home");
    await until(() => document.activeElement === first && !document.querySelector("#panel-first").hidden, "Home must activate the first tab");
    assert(document.querySelector("#increment-first").textContent === "first: 1" && paneMounts.first === 1 && paneMounts.second === 1, "Tab switches must retain child state and subscriptions without remounting");
    key("End");
    await until(() => document.activeElement?.id === "tab-second", "End must focus the final enabled tab");
    assert(!document.querySelector("button button"), "Closable tabs must not nest interactive buttons");
    click(document.querySelector("#close-second"));
    await until(() => !document.querySelector("#tab-second") && !document.querySelector("#panel-first").hidden, "Closing a tab must preserve a valid selected panel");
    assert(document.querySelector("#increment-first").textContent === "first: 1" && paneMounts.first === 1, "Closing a sibling tab must preserve the remaining panel state");
    checks.push("Tabs keyboard navigation, disabled choices, retained panels and sibling close actions");

    result.dataset.passed = "true";
    result.textContent = `PASS: ${checks.join("; ")}. Native implicit Enter submission requires trusted browser input in #enter-input.`;
    window.__beuiControlsResult = { status: "passed", checks, nativeEnter: "pending" };
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}`;
    window.__beuiControlsResult = { status: "failed", checks, error: error.message };
    throw error;
  }
</script>
