<!doctype html>
<meta charset="utf-8" />
<title>Chat thread lazy loading regression</title>
<!-- Open normally, or ?mode=delay / ?mode=failure with the chat-thread module request delayed / failed once. -->
<style>#fixture { height: 640px; max-width: 900px; } #result { white-space: pre-wrap; }</style>
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script>performance.setResourceTimingBufferSize(5000);</script>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import { MotionConfig } from "motion/react";
  import "/src/index.css";
  import { createTestDependencies, withDependencies } from "/tests/support.tsx";
  import { DEMO_MODELS } from "/src/adapters/demo/resources.ts";
  import { ChatScreen } from "/src/components/chat/chat-screen.tsx";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const mode = new URLSearchParams(location.search).get("mode");
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const wait = (ms = 0) => new Promise(resolve => setTimeout(resolve, ms));
  async function until(condition, message) {
    const deadline = performance.now() + 10000;
    while (!condition() && performance.now() < deadline) await wait(10);
    assert(condition(), message);
  }
  const requested = path => performance.getEntriesByType("resource").some(entry => new URL(entry.name).pathname.includes(path));
  const metadata = { providerName: "test", protocolName: "test", requestedModel: "sonnet-5" };
  let requests = 0;
  let aborts = 0;
  let finish;
  const dependencies = createTestDependencies({ gatewayFor: () => ({
    async *stream() {
      requests += 1;
      yield { type: "started", metadata };
      yield { type: "part-started", partId: 0, kind: "text" };
      yield { type: "delta", partId: 0, text: "Reply **ready**" };
      await new Promise(resolve => { finish = resolve; });
      finish = undefined;
      yield { type: "completed", response: { assistant: { parts: [{ type: "text", text: "Reply **ready**" }] }, finish: { reason: "stop" }, usage: {}, metadata } };
    },
    abort() { aborts += 1; finish?.(); finish = undefined; },
  }) });
  const store = dependencies.threads.get("thread-loading");
  const root = createRoot(fixture);
  const editor = () => fixture.querySelector('[role="textbox"]');
  const modelButton = () => fixture.querySelector('button[aria-label^="选择模型:"]');
  const button = label => [...fixture.querySelectorAll("button")].find(node => node.getAttribute("aria-label") === label || node.textContent === label);
  const type = text => flushSync(() => {
    editor().textContent = text;
    editor().dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: text }));
  });
  const click = node => { assert(node, "Expected action is missing"); flushSync(() => node.click()); };
  try {
    flushSync(() => root.render(withDependencies(React.createElement(React.StrictMode, null,
      React.createElement(MotionConfig, { reducedMotion: "always" },
        React.createElement(ChatScreen, { threadId: "thread-loading", models: DEMO_MODELS }))), dependencies)));
    await wait(100);
    assert(editor() && !requested("/src/components/chat/chat-thread.tsx") && !requested("/src/components/chat/markdown.tsx") && !requested("/streamdown"), "Empty chat must not request the thread or Markdown rendering modules");
    result.dataset.phase = "empty";
    type("first request");
    if (!mode) {
      await until(() => requested("/src/components/chat/chat-thread.tsx"), "Composer input must preload the thread");
      assert(fixture.querySelector("h2"), "Preloading must keep the welcome screen");
    }
    click(button("发送"));
    if (mode === "delay") {
      await until(() => fixture.querySelector('[role="status"]')?.textContent.includes("正在加载聊天记录"), "A delayed module must show a local loading status");
      result.dataset.phase = "loading";
    }
    if (mode === "failure") {
      await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("聊天记录加载失败"), "A failed module must show a local error");
      result.dataset.phase = "failed";
    }
    type("next draft");
    assert(store.getDraft().text === "next draft" && editor().textContent === "next draft", "Loading or failure must leave the composer usable");
    await until(() => finish && button("停止响应"), "Loading or failure must preserve streaming and Stop");
    assert(modelButton().disabled, "Streaming must keep model selection disabled");
    finish();
    await until(() => store.getState().status === "idle", "Loading must not stop consumption of the reply");
    assert(modelButton().disabled, "Completion must keep the established session model fixed");
    if (mode !== "failure") await until(() => fixture.textContent.includes("Reply ready"), "The loaded thread must render the consumed reply");
    assert(editor().textContent === "next draft" && store.getDraft().text === "next draft", "Loading or failure must preserve the next draft");
    assert(requests === 1 && aborts === 0, "Loading or failure must not send again or abort the thread");
    if (mode === "failure") {
      assert(fixture.querySelector('[role="alert"]').textContent.includes("复制需要保留的草稿"), "Failure must explain how to preserve the draft before refreshing");
      click(button("发送"));
      await until(() => finish && button("停止响应"), "A failed transcript must allow a new request");
      type("draft after stop");
      click(button("停止响应"));
      assert(store.getState().status === "idle" && aborts === 1 && requests === 2 && editor().textContent === "draft after stop" && store.getDraft().text === "draft after stop", "Stop must remain usable after a transcript load failure without clearing the draft");
    }
    result.dataset.passed = "true";
    result.textContent = `PASS: ${mode || "normal"}; empty chat defers rendering modules, input preloads, draft and stream survive loading/failure, composer controls remain usable`;
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}`;
    throw error;
  } finally {
    store.stop();
    root.unmount();
    dependencies.threads.evictIdle();
  }
</script>
