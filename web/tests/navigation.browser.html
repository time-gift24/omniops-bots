<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sidebar and header navigation regression</title>
<!-- Run npm run dev, then open /tests/navigation.browser.html. Both viewport sizes run automatically. -->
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script>performance.setResourceTimingBufferSize(5000);</script>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { App } from "/src/App.tsx";
  import { createTestDependencies, withTestTheme } from "/tests/support.tsx";
  import { createMockGateway } from "/src/adapters/demo/chat.ts";
  import { DEFAULT_AGENT } from "/src/adapters/demo/resources.ts";
  import { DEMO_SKILLS } from "/src/adapters/demo/skills.ts";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const viewport = new URLSearchParams(location.search).get("viewport");
  const mobile = viewport === "mobile";
  const passed = [];
  const agentModule = "/src/components/premium/agent-builder/agent-builder.tsx";
  const skillModule = "/src/components/skills/skill-library-screen.tsx";
  const moduleRequested = path => performance.getEntriesByType("resource")
    .some(entry => new URL(entry.name).pathname === path);
  const wait = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const until = async (condition, message, timeout = 5000) => {
    const deadline = performance.now() + timeout;
    while (!condition() && performance.now() < deadline) await wait();
    assert(condition(), message);
  };
  const visible = element => element && element.getClientRects().length > 0 &&
    !element.closest('[inert], [hidden], [aria-hidden="true"]') && getComputedStyle(element).visibility !== "hidden";
  const label = element => {
    if (element.hasAttribute("aria-label")) return element.getAttribute("aria-label");
    const copy = element.cloneNode(true);
    copy.querySelectorAll('[aria-hidden="true"], [hidden]').forEach(element => element.remove());
    return copy.textContent.trim();
  };
  const button = (name, scope = document) => [...scope.querySelectorAll("button")]
    .find(element => visible(element) && (label(element) === name || (name.startsWith("打开 ") && label(element).startsWith(name))));
  const click = element => {
    assert(visible(element) && !element.disabled, "Expected an enabled, visible control");
    flushSync(() => { element.focus(); element.click(); });
  };
  const setInput = (element, value) => flushSync(() => {
    const prototype = element instanceof HTMLTextAreaElement ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
    Object.getOwnPropertyDescriptor(prototype, "value").set.call(element, value);
    element.dispatchEvent(new Event("input", { bubbles: true }));
  });
  const drawer = () => document.querySelector('[data-mobile="true"]');
  const panel = () => mobile ? drawer() : fixture.querySelector('[data-slot="sidebar"]');
  const dialog = () => document.querySelector('[data-slot="dialog-content"]');
  const breadcrumb = () => [...fixture.querySelectorAll('nav[aria-label="面包屑"]')].find(visible);
  const skillPage = () => fixture.querySelector('[data-testid="skill-library"]');
  const skillDocument = () => skillPage()?.querySelector('[data-slot="skill-screen"]');
  const overview = () => [...fixture.querySelectorAll('[data-slot="navigation-overview"], [data-testid="skill-library"]')]
    .find(element => visible(element) && (element.dataset.slot === "navigation-overview" || element.querySelector("h1")?.textContent === "Skill"));
  const overviewItem = name => button(`打开 ${name}`, overview()) ?? button(name, overview()) ?? [...overview().querySelectorAll("button")]
    .find(element => visible(element) && element.querySelector("span.block")?.textContent.trim() === name);
  const documentActions = () => [...fixture.querySelectorAll('[data-slot="document-actions"]')].find(visible);
  const path = () => [...(breadcrumb()?.querySelectorAll("ol > li") ?? [])]
    .filter(element => element.getAttribute("aria-hidden") !== "true").map(label);
  const checkPath = async (...expected) => {
    await until(() => JSON.stringify(path()) === JSON.stringify(expected),
      `Expected breadcrumb ${expected.join(" / ")}, received ${path().join(" / ")}`);
    if (expected[0] === "技能" && expected.length > 1) {
      await until(() => visible(skillDocument()) && (button("编辑", skillDocument()) || button("撤销", skillDocument())),
        "Skill navigation must load the original reading layout and document actions");
    }
    const current = breadcrumb().querySelector('[aria-current="page"]');
    assert(current && label(current) === expected.at(-1),
      "The final breadcrumb must identify the current page");
    const crumbs = [...breadcrumb().querySelectorAll("ol > li")];
    assert(crumbs.at(-1) === current && breadcrumb().querySelectorAll('[aria-current="page"]').length === 1,
      "Only the final breadcrumb may identify the current page");
    assert(!current.querySelector('button, a[href], input, select, textarea, [role="button"], [tabindex="0"]'),
      "The current breadcrumb must remain non-interactive");
    for (const crumb of crumbs.slice(0, -1)) {
      const parent = crumb.querySelector("button");
      assert(visible(parent) && !parent.disabled && parent.type === "button",
        `Parent breadcrumb must be an enabled navigation button: ${label(crumb)}`);
    }
    assert(breadcrumb().getBoundingClientRect().right <= innerWidth + 1,
      "Breadcrumbs must fit the viewport");
    assert(fixture.querySelectorAll("header").length === 1 &&
      [...fixture.querySelectorAll('nav[aria-label="面包屑"]')].filter(visible).length === 1,
      "Every page must use one shared Header and one breadcrumb navigation");
    const toggle = button("打开工作台");
    if (toggle) assert(breadcrumb().querySelector("ol").getBoundingClientRect().right <= toggle.getBoundingClientRect().left + 1,
      "The shared Header must reserve room for the floating workbench toggle");
    const controls = [...fixture.querySelector("header").querySelectorAll("button")]
      .filter(visible).concat(toggle ? [toggle] : []);
    const skillVisible = visible(skillPage());
    assert(!fixture.querySelector(".skill-doc-bar"), "Skill content must not retain its old document toolbar");
    assert(!fixture.querySelector('header [data-slot="skill-toolbar"]'),
      "Skill actions must live in the body, never in the Header");
    for (const name of ["编辑", "调试", "保存", "保存文件", "保存草稿", "撤销", "完成编辑"]) assert(!button(name, fixture.querySelector("header")),
      `${name} document action must not appear in the shared Header`);
    const dock = documentActions();
    if ((expected[0] === "Agent" || expected[0] === "技能") && expected.length > 1) {
      assert(dock && !dock.closest("header"), "Document actions must stay in the visible page content");
      const bounds = dock.getBoundingClientRect();
      assert(bounds.top >= fixture.querySelector("header").getBoundingClientRect().bottom - 1 && bounds.right <= innerWidth + 1 && bounds.left >= -1,
        "The document action dock must remain below the Header and inside the viewport");
      const body = [...fixture.querySelectorAll('[data-slot="document-body"]')].find(visible);
      const bodyBounds = body.getBoundingClientRect();
      assert(!body.contains(dock), "Document actions must remain outside the bordered document body");
      assert(Math.abs(bounds.left - bodyBounds.left) <= 1 && bounds.bottom <= bodyBounds.top + 1,
        "Document actions must align with the frame's left edge above its outer border");
      for (const section of [...body.querySelectorAll('.doc-reading-scroll, .skill-file-sidebar, aside[aria-label="Agent 配置"]')].filter(visible)) {
        assert(section.getBoundingClientRect().top >= bounds.bottom - 1,
          "Document content and sidebar must start below the horizontal action row");
      }
      const readingScroll = body.querySelector(".doc-reading-scroll");
      assert(readingScroll, "The document body must retain its reading scroll container");
      for (const group of [...readingScroll.querySelectorAll('[role="group"][aria-label="编辑视图"]')].filter(visible)) {
        for (const control of [...group.querySelectorAll("button")].filter(visible)) {
          const rectangle = control.getBoundingClientRect();
          assert(Math.min(bounds.right, rectangle.right) - Math.max(bounds.left, rectangle.left) <= 1 ||
            Math.min(bounds.bottom, rectangle.bottom) - Math.max(bounds.top, rectangle.top) <= 1,
            `The document action dock must not overlap the ${label(control)} editor view control`);
        }
      }
      const actions = [...dock.querySelectorAll("button")].filter(visible);
      for (const action of actions) assert(action.getAttribute("aria-label") && action.textContent.trim() === "",
        "Document actions must expose accessible names and stay icon-only");
      const primary = [...dock.querySelectorAll("button")].find(action => action.getAttribute("aria-label") === "编辑" || action.getAttribute("aria-label")?.startsWith("保存"));
      assert(primary && getComputedStyle(primary).backgroundColor !== "rgba(0, 0, 0, 0)",
        "Edit/save must carry a filled background");
      assert(actions[0] === primary, "Edit/save must start the horizontal action row");
      for (const action of actions) {
        for (let wrapper = action.parentElement; wrapper && dock.contains(wrapper); wrapper = wrapper.parentElement) {
          const style = getComputedStyle(wrapper);
          assert([style.borderTopWidth, style.borderRightWidth, style.borderBottomWidth, style.borderLeftWidth].every(width => Number.parseFloat(width) === 0),
            "Action controls must not have an additional enclosing border");
        }
      }
      if (expected[0] === "Agent" || expected[0] === "技能") {
        for (let index = 1; index < actions.length; index++) {
          const previous = actions[index - 1].getBoundingClientRect();
          const current = actions[index].getBoundingClientRect();
          assert(previous.right <= current.left + 1 && Math.abs((previous.top + previous.bottom) / 2 - (current.top + current.bottom) / 2) <= 1,
            "Page actions must form one horizontal row without overlap");
        }
      }
      if (button("撤销", dock)) {
        assert(button(skillVisible ? "保存文件" : "保存", dock) && !button("调试", dock) && !button("编辑", dock),
          "Editing must expose save and undo without reading-mode actions");
      } else assert(button("编辑", dock) && (skillVisible || button("调试", dock)),
        "Reading mode must expose Edit and the Agent debug action");
    } else assert(!dock, "Leaving a document must hide its action row");
    if (expected[0] === "技能") {
      if (expected.length > 1) {
        assert(skillDocument().querySelector('nav[aria-label="技能文件"]') && skillDocument().querySelector(".doc-reading-scroll"),
          "Skill detail must retain the original file tree and document reading layout");
        assert(!visible(skillPage().querySelector('[data-slot="file-manager"]')),
          "Opening a Skill must read its selected file rather than replacing the page with a file manager");
      } else await until(() => visible(skillPage()) && skillPage().querySelector("h1")?.textContent === "Skill",
        "Skill parent navigation must show the catalog");
    }
    for (let index = 0; index < controls.length; index++) {
      const left = controls[index].getBoundingClientRect();
      for (const control of controls.slice(index + 1)) {
        const right = control.getBoundingClientRect();
        assert(Math.min(left.right, right.right) - Math.max(left.left, right.left) <= 1 ||
          Math.min(left.bottom, right.bottom) - Math.max(left.top, right.top) <= 1,
          `Header controls must not overlap: ${label(controls[index])} / ${label(control)}`);
      }
    }
  };
  const dismissNavigation = async () => {
    if (mobile && drawer()?.getAttribute("aria-hidden") === "false") {
      click(button("Close sidebar"));
      await until(() => drawer()?.getAttribute("aria-hidden") === "true", "Mobile navigation did not close");
    }
  };
  const openSection = async name => {
    await dismissNavigation();
    click(button(name, fixture.querySelector('nav[aria-label="工作区导航区域"]')));
    await until(() => visible(panel()) && (!mobile || drawer()?.getAttribute("aria-hidden") === "false"),
      `${name} navigation did not open`);
  };
  const revealNavigation = async () => {
    if (mobile && drawer()?.getAttribute("aria-hidden") !== "false") click(button("展开导航"));
    await until(() => visible(panel()), "Navigation panel did not become visible");
  };
  const selectItem = async (section, name) => {
    await openSection(section);
    await until(() => button(name, panel()), `${name} navigation entry did not become available`);
    click(button(name, panel()));
    await dismissNavigation();
  };
  const selectedRow = name => [...(panel()?.querySelectorAll("button") ?? [])]
    .find(element => label(element) === name)?.getAttribute("aria-current") === "page";
  const checkOverview = async (name, items) => {
    await until(() => visible(overview()) && (overview().getAttribute("aria-label") ?? overview().querySelector("h1")?.textContent) === (name === "技能" ? "Skill" : name),
      `${name} parent did not open its overview page`);
    for (const item of items) await until(() => overviewItem(item), `${name} overview must contain ${item}`);
    if (name === "Agent" || name === "技能") {
      assert(overview().querySelector("h1").classList.contains("sr-only"), "Library titles must not duplicate the shared breadcrumb");
      assert(!button(name === "Agent" ? "新建 Agent" : "新建 Skill", overview()), "Library creation belongs to the section sidebar, not the body");
      assert(!button("新会话", panel()), "Only the workspace tab may offer New conversation");
    }
  };
  const editor = () => fixture.querySelector('[role="textbox"][aria-label="消息输入"]');
  const addWorkspace = async directory => {
    await openSection("工作区");
    click(button("添加工作区", panel()));
    await until(() => dialog()?.querySelector("input"), "Directory picker did not open");
    await until(() => button(directory, dialog()) && !button(directory, dialog()).disabled,
      "Directory choices did not finish loading");
    click(button(directory, dialog()));
    click(button("打开工作区", dialog()));
    await until(() => !dialog() && visible(editor()), "Opening the workspace did not show its conversation");
    await dismissNavigation();
  };

  let root;
  try {
    if (!viewport) {
      for (const [name, width] of [["desktop", 1100], ["mobile", 390]]) {
        const frame = document.createElement("iframe");
        frame.title = `${name} navigation regression`;
        frame.width = width;
        frame.height = 844;
        frame.src = `${location.pathname}?viewport=${name}`;
        fixture.append(frame);
        await until(() => frame.contentDocument?.querySelector("#result")?.dataset.passed,
          `${name} fixture did not finish`, 45000);
        const child = frame.contentDocument.querySelector("#result");
        assert(child.dataset.passed === "true", child.textContent);
        passed.push(child.textContent);
      }
    } else {
      const createdThreads = new Set();
      const dependencies = createTestDependencies({ gatewayFor: threadId => {
        createdThreads.add(threadId);
        return createMockGateway({ delayMs: 0 });
      } });
      root = createRoot(fixture);
      flushSync(() => root.render(React.createElement(React.StrictMode, null,
        withTestTheme(React.createElement(App), dependencies))));
      await until(() => button("工作区") && Boolean(drawer()) === mobile, "App did not mount at the requested viewport");
      const hiddenSections = ["资料库", "动态"];
      const hiddenItems = ["参考资料", "收藏的页面", "素材", "本周", "与我共享", "归档", "成员", "连接"];
      const rail = fixture.querySelector('nav[aria-label="工作区导航区域"]');
      for (const name of hiddenSections) assert(!button(name, rail), `${name} placeholder must not appear in the navigation rail`);
      assert(!moduleRequested(agentModule) && !moduleRequested(skillModule),
        "Agent and skill pages must not load at startup");
      if (button("收起工作台")) click(button("收起工作台"));
      await until(() => visible(editor()), "The initial conversation must be editable without a workspace");
      await checkPath("工作区", "新会话");
      assert(!dialog() && !button("选择工作区") && !button("选择工作区（可选）") && !fixture.textContent.includes("选择一个工作区，让对话围绕同一项工作展开。"),
        "Starting a conversation must not require a workspace picker or workspace instructions");
      passed.push("initial conversation is ready to send without a workspace");

      const activeAgentPage = () => [...fixture.querySelectorAll('[data-agent-id]')].find(visible);
      const agentName = () => {
        const field = activeAgentPage()?.querySelector('aside[aria-label="Agent 配置"] input');
        if (!visible(field)) click(button("Agent 配置"));
        assert(visible(field), "Agent name must be editable");
        return field;
      };
      const agentPrompt = () => activeAgentPage()?.querySelector('textarea[aria-label="系统提示词"]');
      const editAgentPrompt = async () => {
        const before = documentActions().getBoundingClientRect();
        if (!visible(agentPrompt())) click(button("编辑", documentActions()));
        await until(() => visible(agentPrompt()), "Agent system prompt editor did not open");
        const after = documentActions().getBoundingClientRect();
        assert(Math.abs(after.left - before.left) <= 1 && Math.abs(after.top - before.top) <= 1,
          "Agent reading and editing actions must stay at the same position");
        return agentPrompt();
      };
      await openSection("Agent");
      const sidebarHeader = panel().querySelector('[data-slot="sidebar-header"]');
      const createAgent = button("新建 Agent", sidebarHeader);
      const agentList = button("Agent 列表", sidebarHeader);
      assert(createAgent && agentList && createAgent.compareDocumentPosition(agentList) & Node.DOCUMENT_POSITION_FOLLOWING,
        "New Agent must sit above the Agent list in that tab's sidebar");
      assert(!button("新会话", sidebarHeader) && !button("Skill 列表", sidebarHeader),
        "The Agent tab must not show another tab's action or list");
      const commonAgents = [...panel().querySelectorAll("button[aria-controls]")]
        .find(element => element.textContent.includes("常用 Agent"));
      assert(commonAgents && commonAgents.getAttribute("aria-expanded") === "true",
        "Common Agents must be an expanded group");
      click(commonAgents);
      assert(!button(DEFAULT_AGENT.name, panel()), "Collapsing Common Agents must hide its rows");
      click(commonAgents);
      assert(button(DEFAULT_AGENT.name, panel()), "Expanding Common Agents must restore its rows");
      await dismissNavigation();
      await checkPath("Agent");
      await checkOverview("Agent", [DEFAULT_AGENT.name, "数据周报"]);
      assert(!moduleRequested(agentModule), "Opening the Agent list must not implicitly load or select an Agent detail");
      passed.push("Agent tab owns New Agent and its list; Common Agents groups collapse; no New conversation or body creation");
      await selectItem("Agent", DEFAULT_AGENT.name);
      await until(() => visible(activeAgentPage()?.querySelector('aside[aria-label="Agent 配置"] input')) || button("Agent 配置"),
        "Agent editor did not finish loading");
      assert(moduleRequested(agentModule) && !moduleRequested(skillModule),
        "Visiting Agent must load its page without loading the skill page");
      await checkPath("Agent", DEFAULT_AGENT.name);
      assert(!button("编辑", fixture.querySelector("header")) && !button("调试", fixture.querySelector("header")),
        "Agent editing and debugging actions must sit above the document frame outside the shared Header");
      let nameField = agentName();
      assert(nameField.readOnly, "Agent configuration must be read-only until editing starts");
      await editAgentPrompt();
      nameField = agentName();
      setInput(nameField, "导航回归助手");
      const firstAgentPrompt = `${DEFAULT_AGENT.instructions}\n\n保留客户支持助手的未保存提示词。`;
      setInput(await editAgentPrompt(), firstAgentPrompt);
      await checkPath("Agent", "导航回归助手");
      click(button("Agent", breadcrumb()));
      await checkPath("Agent");
      await checkOverview("Agent", ["导航回归助手", "数据周报"]);
      assert(!visible(nameField), "The Agent overview must hide its editor");
      assert(!selectedRow("导航回归助手") && !selectedRow("数据周报"),
        "The Agent overview must not keep a child selected");
      click(overviewItem("导航回归助手"));
      await checkPath("Agent", "导航回归助手");
      nameField = agentName();
      assert(nameField.value === "导航回归助手" && !button("保存").disabled,
        "Returning from the Agent parent must preserve the unsaved draft");
      await selectItem("Agent", "数据周报");
      await checkPath("Agent", "数据周报");
      passed.push("Agent parent navigation preserves its unsaved draft and live name");

      await editAgentPrompt();
      setInput(agentName(), "周报草稿助手");
      const secondAgentPrompt = "保留数据周报助手的独立草稿，不能被其他 Agent 的编辑或撤销覆盖。";
      setInput(await editAgentPrompt(), secondAgentPrompt);
      await selectItem("Agent", DEFAULT_AGENT.name);
      await checkPath("Agent", "导航回归助手");
      assert(agentName().value === "导航回归助手" && (await editAgentPrompt()).value === firstAgentPrompt && !button("保存").disabled,
        "Switching A to B to A must restore A's name, system prompt and dirty state");
      click(button("撤销"));
      await checkPath("Agent", DEFAULT_AGENT.name);
      assert(agentName().value === DEFAULT_AGENT.name && agentName().readOnly && !visible(agentPrompt()) && button("编辑", documentActions()),
        "Undo must restore A's saved configuration and return to reading");
      assert((await editAgentPrompt()).value === DEFAULT_AGENT.instructions,
        "Editing again after undo must expose the saved instructions");
      const savedAgentPrompt = `${DEFAULT_AGENT.instructions}\n\n保存后切换仍使用新的保存基线。`;
      setInput(agentPrompt(), savedAgentPrompt);
      click(button("保存"));
      await until(() => button("编辑", documentActions()) && !visible(agentPrompt()), "Agent save must return to reading");
      await selectItem("Agent", "数据周报");
      await checkPath("Agent", "周报草稿助手");
      assert(agentName().value === "周报草稿助手" && (await editAgentPrompt()).value === secondAgentPrompt && !button("保存").disabled,
        "Undoing A must not change B's independent draft or dirty state");
      await openSection("工作区");
      await dismissNavigation();
      await checkPath("工作区", "新会话");
      await selectItem("Agent", "数据周报");
      await checkPath("Agent", "周报草稿助手");
      assert(agentName().value === "周报草稿助手" && (await editAgentPrompt()).value === secondAgentPrompt && !button("保存").disabled,
        "Switching sections must preserve the unsaved Agent configuration");
      await selectItem("Agent", DEFAULT_AGENT.name);
      assert(agentName().readOnly && button("编辑", documentActions()),
        "Returning to a saved Agent must start in reading mode");
      assert((await editAgentPrompt()).value === savedAgentPrompt,
        "Returning to a saved Agent must restore its saved content");
      setInput(agentPrompt(), "随后未保存的修改");
      click(button("撤销"));
      assert(!visible(agentPrompt()) && agentName().readOnly, "Undo after switching must return to reading");
      assert((await editAgentPrompt()).value === savedAgentPrompt,
        "Undo after switching must use the most recently saved baseline");
      await selectItem("Agent", "数据周报");
      setInput(agentName(), "");
      setInput(await editAgentPrompt(), "");
      await selectItem("Agent", DEFAULT_AGENT.name);
      await selectItem("Agent", "数据周报");
      assert(agentName().value === "" && (await editAgentPrompt()).value === "",
        "Empty draft fields must survive Agent switches without falling back to saved values");
      click(button("保存"));
      assert(/请先填写名称和(?:系统提示词|指令)/.test([...fixture.querySelectorAll('[role="alert"]')].find(visible)?.textContent ?? ""),
        "Restored empty drafts must still pass through save validation");
      click(button("撤销"));
      await checkPath("Agent", "数据周报");
      passed.push("Agent drafts survive identity and section switches with independent undo baselines");

      await openSection("技能");
      await dismissNavigation();
      await checkPath("技能");
      await checkOverview("技能", DEMO_SKILLS.map(skill => skill.name));
      passed.push("Skill rail selection opens the package catalog without selecting the first Skill");
      await selectItem("技能", DEMO_SKILLS[0].name);
      await until(() => visible(skillDocument()) && skillDocument().querySelector('[aria-label="文件内容"] h1')?.textContent === DEMO_SKILLS[0].name,
        "Opening a Skill in the real App must render SKILL.md in the original reading layout");
      assert(moduleRequested(skillModule), "Visiting skills must load its page");
      passed.push("Agent and skill pages load only on their first visit");
      await checkPath("技能", DEMO_SKILLS[0].name);
      await selectItem("技能", DEMO_SKILLS[1].name);
      await checkPath("技能", DEMO_SKILLS[1].name);
      await openSection("技能");
      click(button("搜索技能", panel()));
      await until(() => document.querySelector("[data-slot=command-input]"), "Skill search did not open");
      setInput(document.querySelector("[data-slot=command-input]"), DEMO_SKILLS[0].name);
      const match = () => [...document.querySelectorAll("[data-slot=command-item]")]
        .find(element => visible(element) && label(element) === DEMO_SKILLS[0].name);
      await until(match, "Skill search did not find the requested skill");
      click(match());
      await until(() => !dialog(), "Skill selection did not close search");
      await dismissNavigation();
      await checkPath("技能", DEMO_SKILLS[0].name);
      await revealNavigation();
      assert(selectedRow(DEMO_SKILLS[0].name) && !selectedRow(DEMO_SKILLS[1].name),
        "Search selection must update the highlighted sidebar row");
      await dismissNavigation();
      passed.push("skill selection and search share the header and sidebar state");

      const skillDraft = () => skillPage()?.querySelector('textarea[aria-label="编辑 SKILL.md"]');
      const openSkillEditor = async () => {
        if (visible(skillDraft())) return;
        await until(() => button("编辑", skillDocument()) && !button("编辑", skillDocument()).disabled, "Skill reading view did not become editable");
        const before = documentActions().getBoundingClientRect();
        click(button("编辑", skillDocument()));
        await until(() => visible(skillDraft()), "Skill source editor did not open");
        const after = documentActions().getBoundingClientRect();
        assert(Math.abs(after.left - before.left) <= 1 && Math.abs(after.top - before.top) <= 1,
          "Skill reading and editing actions must stay at the same position");
      };
      await openSkillEditor();
      const draft = `${skillDraft().value}\n\n导航保留未保存的草稿`;
      setInput(skillDraft(), draft);
      assert(!button("列表查看") && !button("下载文件") && !skillPage().querySelector('[data-slot="file-manager"]'),
        "Skill selection must open its content without a file-list detour or download controls");
      passed.push("Skill catalog links directly to its readable and editable content");
      await checkPath("技能", DEMO_SKILLS[0].name);
      click(button("技能", breadcrumb()));
      await checkPath("技能");
      await checkOverview("技能", DEMO_SKILLS.map(skill => skill.name));
      assert(!visible(skillDraft()), "The skill overview must hide its editor");
      click(overviewItem(DEMO_SKILLS[0].name));
      await checkPath("技能", DEMO_SKILLS[0].name);
      await openSkillEditor();
      assert(visible(skillDraft()) && skillDraft().value === draft,
        "Returning from the skill parent must preserve its unsaved source");
      await openSection("工作区");
      await dismissNavigation();
      await checkPath("工作区", "新会话");
      assert(!visible(skillDraft()), "The workspace must hide the skill editor");
      await selectItem("技能", DEMO_SKILLS[0].name);
      await checkPath("技能", DEMO_SKILLS[0].name);
      await openSkillEditor();
      assert(visible(skillDraft()) && skillDraft().value === draft,
        "Returning from the workspace must preserve the unsaved skill editor");
      passed.push("unsaved skill source survives parent and workspace navigation");

      const checkNewSessionNavigation = async () => {
        const count = createdThreads.size;
        const blank = dependencies.workspaces.getState().sessions.find(session => session.workspaceId === null && session.blank);
        await openSection("工作区");
        await dismissNavigation();
        await revealNavigation();
        assert(!button("新会话", panel().querySelector('[data-slot="sidebar-header"]'))?.disabled,
          "The workspace tab must keep its New conversation action enabled");
        click(button("新会话", panel().querySelector('[data-slot="sidebar-header"]')));
        await dismissNavigation();
        await checkPath("工作区", "新会话");
        assert(button("工作区", rail)?.getAttribute("aria-current") === "page" && !visible(overview()),
          "New conversation must select the workspace rail and leave the previous overview");
        assert(!visible(fixture.querySelector('aside[aria-label="Agent 配置"]')) && !visible(skillPage()),
          "New conversation must hide Agent and skill pages");
        assert(visible(editor()) && !dialog(), "New conversation must immediately display the chat editor without a picker");
        const state = dependencies.workspaces.getState();
        const active = state.sessions.find(session => session.id === state.activeSessionId);
        assert(active?.workspaceId === null && active.blank,
          "Global New conversation must always select an empty conversation without a workspace");
        assert(createdThreads.size === count + Number(!blank) && (!blank || active.id === blank.id),
          "Global New conversation must reuse the empty conversation for the workspace-free scope");
        await revealNavigation();
        assert([...panel().querySelectorAll("button")].filter(element => label(element) === "新会话").length === 1,
          "The empty conversation must remain absent from the sidebar");
        await dismissNavigation();
      };
      await checkNewSessionNavigation();
      const standaloneTitle = "无需工作区的临时对话";
      flushSync(() => {
        editor().textContent = standaloneTitle;
        editor().dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: standaloneTitle }));
      });
      click(button("发送"));
      await checkPath("工作区", standaloneTitle);
      if (button("停止生成")) click(button("停止生成"));
      await revealNavigation();
      assert(selectedRow(standaloneTitle), "An accepted workspace-free send must publish and select its sidebar row");
      await dismissNavigation();
      click(button("工作区", breadcrumb()));
      await checkPath("工作区");
      await checkOverview("工作区", [standaloneTitle]);
      click(overviewItem(standaloneTitle));
      await checkPath("工作区", standaloneTitle);
      await checkNewSessionNavigation();
      await checkNewSessionNavigation();
      passed.push("global New conversation reuses a workspace-free draft; sent conversations appear in the sidebar and section directory");

      await addWorkspace("/workspace/omniops-bots");
      await checkPath("工作区", "omniops-bots", "新会话");
      await revealNavigation();
      const newConversation = button("新会话", panel().querySelector('[data-slot="sidebar-header"]'));
      const standaloneRow = button(standaloneTitle, panel());
      assert(newConversation.compareDocumentPosition(standaloneRow) & Node.DOCUMENT_POSITION_FOLLOWING &&
        standaloneRow.compareDocumentPosition(button("omniops-bots", panel())) & Node.DOCUMENT_POSITION_FOLLOWING,
        "Workspace-free conversations must appear below New conversation and above workspace groups");
      await dismissNavigation();
      await checkNewSessionNavigation();
      await openSection("工作区");
      click(button("在 omniops-bots 中新建会话", panel()));
      await dismissNavigation();
      await checkPath("工作区", "omniops-bots", "新会话");
      passed.push("global New conversation stays workspace-free while each workspace group selects its own conversation");
      const title = "验证会话面包屑在较长标题下仍保留栏目和工作区路径";
      flushSync(() => {
        editor().textContent = title;
        editor().dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: title }));
      });
      click(button("发送"));
      await checkPath("工作区", "omniops-bots", title);
      if (button("停止生成")) click(button("停止生成"));
      await openSection("工作区");
      await until(() => button("在 omniops-bots 中新建会话", panel()), "Workspace new-session control did not become available");
      click(button("在 omniops-bots 中新建会话", panel()));
      await dismissNavigation();
      await checkPath("工作区", "omniops-bots", "新会话");
      await addWorkspace("/workspace/客户支持");
      await checkPath("工作区", "客户支持", "新会话");
      await selectItem("Agent", "数据周报");
      await openSection("工作区");
      await dismissNavigation();
      await checkPath("工作区", "客户支持", "新会话");
      assert(visible(editor()), "Workspace rail selection must replace the Agent editor with chat");
      await selectItem("技能", DEMO_SKILLS[0].name);
      await selectItem("工作区", title);
      await checkPath("工作区", "omniops-bots", title);
      assert(visible(editor()), "A WorkspacePanel session must replace the skill editor with chat");
      passed.push("workspace creation, rail selection, session selection and title updates");

      const threadCount = createdThreads.size;
      click(button("omniops-bots", breadcrumb()));
      await checkPath("工作区", "omniops-bots");
      await checkOverview("omniops-bots", [title]);
      assert(!visible(editor()), "The workspace parent must show its session list");
      click(button("工作区", breadcrumb()));
      await checkPath("工作区");
      await checkOverview("工作区", [standaloneTitle, "omniops-bots", "客户支持"]);
      click(button("客户支持", overview()));
      await checkPath("工作区", "客户支持");
      await checkOverview("客户支持", []);
      click(button("工作区", breadcrumb()));
      await checkPath("工作区");
      click(button("omniops-bots", overview()));
      await checkPath("工作区", "omniops-bots");
      await checkOverview("omniops-bots", [title]);
      click(button(title, overview()));
      await checkPath("工作区", "omniops-bots", title);
      assert(visible(editor()) && createdThreads.size === threadCount,
        "Workspace parent navigation must restore existing sessions without creating threads");
      passed.push("workspace and section parents open real lists without creating sessions");

      click(button("omniops-bots", breadcrumb()));
      await checkPath("工作区", "omniops-bots");
      await checkOverview("omniops-bots", [title]);
      await revealNavigation();
      click(button("在 客户支持 中新建会话", panel()));
      await dismissNavigation();
      await checkPath("工作区", "客户支持", "新会话");
      assert(visible(editor()) && !visible(overview()) && button("工作区", rail)?.getAttribute("aria-current") === "page",
        "A workspace group new-conversation button must leave the overview and show that workspace's chat");
      assert(createdThreads.size === threadCount, "The workspace group action must reuse its existing empty conversation");
      passed.push("workspace group new conversation leaves the overview and selects its target workspace");

      await openSection("工作区");
      click(button("搜索导航", panel()));
      await until(() => document.querySelector("[data-slot=command-input]"), "Navigation search did not open");
      for (const name of hiddenSections) assert(![...document.querySelectorAll("[data-slot=command-group-heading]")].some(element => label(element).startsWith(`${name} ·`)),
        `${name} placeholder must not appear in navigation search groups`);
      for (const name of hiddenItems) assert(![...document.querySelectorAll("[data-slot=command-item]")].some(element => label(element) === name),
        `${name} placeholder must not appear in navigation search results`);
      passed.push("placeholder sections and pages stay hidden in navigation and search");
      setInput(document.querySelector("[data-slot=command-input]"), standaloneTitle);
      const standaloneMatch = () => [...document.querySelectorAll("[data-slot=command-item]")]
        .find(element => visible(element) && label(element) === standaloneTitle);
      await until(standaloneMatch, "Navigation search must include sent workspace-free conversations");
      click(standaloneMatch());
      await until(() => !dialog(), "Workspace-free conversation selection did not close navigation search");
      await dismissNavigation();
      await checkPath("工作区", standaloneTitle);
      await revealNavigation();
      assert(selectedRow(standaloneTitle), "Search must select the workspace-free conversation in the sidebar");
      click(button("搜索导航", panel()));
      await until(() => document.querySelector("[data-slot=command-input]"), "Navigation search did not reopen");
      passed.push("global navigation search opens workspace-free conversations and selects their sidebar row");
      setInput(document.querySelector("[data-slot=command-input]"), DEMO_SKILLS[1].name);
      const navigationMatch = () => [...document.querySelectorAll("[data-slot=command-item]")]
        .find(element => visible(element) && label(element) === DEMO_SKILLS[1].name);
      await until(navigationMatch, "Navigation search did not find the requested skill");
      click(navigationMatch());
      await until(() => !dialog(), "Skill selection did not close navigation search");
      await checkPath("技能", DEMO_SKILLS[1].name);
      await revealNavigation();
      assert(selectedRow(DEMO_SKILLS[1].name) && !selectedRow(DEMO_SKILLS[0].name),
        "Global navigation search must update the selected skill sidebar row");
      await dismissNavigation();
      await checkPath("技能", DEMO_SKILLS[1].name);
      passed.push("global navigation search shares the skill page and sidebar state");

      click(button("打开工作台"));
      await until(() => button("收起工作台") && !button("打开工作台"), "Workbench did not open");
      await checkPath("技能", DEMO_SKILLS[1].name);
      click(button("收起工作台"));
      await until(() => button("打开工作台"), "Workbench did not close");
      await checkPath("技能", DEMO_SKILLS[1].name);
      const before = path();
      await dismissNavigation();
      click(button(mobile ? "展开导航" : "收起导航"));
      await checkPath(...before);
      await dismissNavigation();
      passed.push("skill pages and collapsed navigation retain the correct breadcrumb");
    }
    result.textContent = `PASS ${viewport ?? "all viewports"}: ${passed.join("; ")}`;
    result.dataset.passed = "true";
  } catch (error) {
    result.textContent = `FAIL ${viewport ?? "all viewports"}: ${error.stack ?? error.message}`;
    result.dataset.passed = "false";
    throw error;
  } finally {
    root?.unmount();
  }
</script>
