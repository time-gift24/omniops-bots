<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>beUI catalog compatibility regression</title>
<!-- Run npm run dev, then open /tests/beui-catalog.browser.html. -->
<style>#ticker { padding: 24px; font-size: 32px; } #result { position: fixed; bottom: 0; white-space: pre-wrap; }</style>
<div id="ticker"></div>
<div id="illustration" style="width: 640px; max-width: 90vw"></div>
<div id="popover"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { NumberTicker } from "/vendor/beui-templates/components/motion/number-ticker.tsx";
  import { MorphPopover, MorphPopoverTrigger, MorphPopoverContent } from "/vendor/beui-templates/components/motion/popover-morph.tsx";
  import { Button } from "/vendor/beui-templates/components/motion/button.tsx";
  import { IconMarquee } from "/vendor/beui-templates/components/premium/animated-illustrations/icon-marquee.tsx";

  const h = React.createElement;
  const tickerRoot = createRoot(document.querySelector("#ticker"));
  const popoverRoot = createRoot(document.querySelector("#popover"));
  const illustrationRoot = createRoot(document.querySelector("#illustration"));
  const result = document.querySelector("#result");
  const checks = [];
  const wait = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms));
  const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const until = async (condition, message) => {
    const deadline = performance.now() + 5000;
    while (!condition() && performance.now() < deadline) await wait();
    assert(condition(), message);
  };
  const click = element => flushSync(() => element.click());
  const ticker = value => flushSync(() => tickerRoot.render(h(NumberTicker, { value, animateOnMount: false, duration: 0.2, stagger: 0 })));
  const visibleDigits = () => [...document.querySelectorAll('#ticker [aria-hidden="true"] > span')].map(slot => {
    const rect = slot.getBoundingClientRect();
    const column = slot.lastElementChild;
    return [...column.children].find(digit => {
      const row = digit.getBoundingClientRect();
      return Math.abs((row.top + row.bottom) / 2 - (rect.top + rect.bottom) / 2) < 1;
    })?.textContent ?? "?";
  }).join("");
  const key = value => flushSync(() => document.activeElement.dispatchEvent(new KeyboardEvent("keydown", { key: value, bubbles: true, cancelable: true })));

  function Popover({ side, edge }) {
    const triggerWidth = innerWidth < 500 ? 64 : 120;
    const panelWidth = innerWidth < 500 ? 112 : 160;
    return h("div", { style: { position: "fixed", top: "40%", ...(edge === "left" ? { left: 4 } : edge === "right" ? { right: 4 } : { left: `calc(50% - ${triggerWidth / 2}px)` }) } },
      h(MorphPopover, null,
        h(MorphPopoverTrigger, null, h(Button, { "aria-label": "Show panel", style: { width: triggerWidth, height: 40 } }, "Show panel")),
        h(MorphPopoverContent, { side, align: "center", sideOffset: 8, className: "p-0" },
          h("div", { style: { width: panelWidth, height: 80, display: "grid", placeItems: "center" } },
            h(Button, { id: "panel-action" }, "Panel action")))),
    );
  }

  window.__beuiCatalogResult = { status: "running", checks };
  try {
    ticker(42);
    await frame();
    assert(visibleDigits() === "42", "animateOnMount=false must show the actual number on the first painted frame");
    assert(document.querySelector("#ticker .sr-only").textContent === "42", "Ticker must retain a readable accessible value");
    ticker(87);
    await frame();
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      assert(visibleDigits() !== "87", "Turning off the mount animation must preserve animation for later value changes");
    }
    await until(() => visibleDigits() === "87", "Updated ticker digits must settle at the new number");
    assert(document.querySelector("#ticker .sr-only").textContent === "87", "Ticker accessible value must follow updates");
    checks.push("NumberTicker immediate mount, animated updates and accessible values");

    flushSync(() => illustrationRoot.render(h(IconMarquee)));
    const style = document.querySelector("#illustration style");
    assert(style && !style.hasAttribute("jsx") && !style.hasAttribute("global"), "Illustration styles must mount as native style elements without Next attributes");
    assert([...style.sheet.cssRules].some(rule => rule.type === CSSRule.KEYFRAMES_RULE && rule.name === "icon-marquee-left"), "Illustration keyframes must parse in the browser stylesheet");
    const track = document.querySelector('#illustration .icon-marquee__track[data-direction="left"]');
    assert(getComputedStyle(track).animationName === (matchMedia("(prefers-reduced-motion: reduce)").matches ? "none" : "icon-marquee-left"), "Illustration native CSS must apply its animation and reduced motion rule");
    checks.push("Illustration native CSS, keyframes and reduced motion");

    for (const [side, edge] of [["left"], ["right"], ["top"], ["bottom"], ["left", "left"], ["right", "right"]]) {
      flushSync(() => popoverRoot.render(h(Popover, { side, edge, key: `${side}-${edge}` })));
      const trigger = document.querySelector('#popover button[aria-label="Show panel"]');
      trigger.focus();
      click(trigger);
      await until(() => {
        const panel = document.querySelector('[role="dialog"]');
        return panel && getComputedStyle(panel.parentElement).visibility === "visible" && panel.getBoundingClientRect().width > 0;
      }, `${side} popover must become positioned and visible`);
      const panel = document.querySelector('[role="dialog"]');
      const anchor = trigger.getBoundingClientRect();
      const bounds = panel.getBoundingClientRect();
      const expected = edge === "left" ? "right" : edge === "right" ? "left" : side;
      if (expected === "left") assert(Math.abs(bounds.right + 8 - anchor.left) < 2, "Left popover must sit beside its trigger");
      if (expected === "right") assert(Math.abs(bounds.left - anchor.right - 8) < 2, "Right popover must sit beside its trigger");
      if (expected === "top") assert(Math.abs(bounds.bottom + 8 - anchor.top) < 2, "Top popover must sit above its trigger");
      if (expected === "bottom") assert(Math.abs(bounds.top - anchor.bottom - 8) < 2, "Bottom popover must sit below its trigger");
      assert(Math.abs((expected === "left" || expected === "right")
        ? (bounds.top + bounds.bottom - anchor.top - anchor.bottom) / 2
        : (bounds.left + bounds.right - anchor.left - anchor.right) / 2) < 2, "Center alignment must use the cross axis for every side");
      assert(bounds.left >= 0 && bounds.right <= innerWidth && bounds.top >= 0 && bounds.bottom <= innerHeight, "Popover must stay within the viewport after edge flipping");
      document.querySelector("#panel-action").focus();
      key("Escape");
      await until(() => !document.querySelector('[role="dialog"]') && document.activeElement === trigger, "Popover Escape must close the panel and restore trigger focus");
    }
    checks.push("Popover four sides, center alignment, edge flipping, viewport fit and Escape focus");
    result.dataset.passed = "true";
    result.textContent = `PASS: ${checks.join("; ")}`;
    window.__beuiCatalogResult = { status: "passed", checks };
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}`;
    window.__beuiCatalogResult = { status: "failed", checks, error: error.message };
    throw error;
  }
</script>
