<!doctype html>
<meta charset="utf-8" />
<title>Desktop retry lock regression</title>
<div id="fixture" style="height: 600px"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { ChatThread } from "/src/components/chat/chat-thread.tsx";
  import { TooltipProvider } from "/src/components/ui/tooltip.tsx";
  import { createTestDependencies, withDependencies } from "/tests/support.tsx";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const root = createRoot(fixture);
  const listeners = new Set();
  let activeTask = null;
  let retryCalls = 0;
  const state = {
    threadId: "history", status: "idle",
    messages: ["failed", "stopped", "done"].map((state, index) => ({
      id: `reply-${index}`, role: "assistant", state,
      parts: [{ kind: "text", text: `Preserved reply ${index}` }],
    })),
  };
  const store = { getState: () => state, subscribe: () => () => {}, retry: () => { retryCalls++; } };
  const desktop = {
    getState: () => ({ task: activeTask }),
    subscribe: listener => { listeners.add(listener); return () => listeners.delete(listener); },
  };
  const dependencies = createTestDependencies({ desktop });
  const controls = () => [...fixture.querySelectorAll("button")].filter(button => button.getAttribute("aria-label") === "重试" || ["重试", "重新生成"].includes(button.textContent.trim()));
  const notify = () => flushSync(() => { for (const listener of listeners) listener(); });
  const assert = (condition, message) => { if (!condition) throw new Error(message); };

  try {
    flushSync(() => root.render(withDependencies(React.createElement(TooltipProvider, null, React.createElement(ChatThread, { store })), dependencies)));
    assert(controls().length === 3 && controls().every(button => !button.disabled), "All three historical retry controls are available while idle");
    activeTask = { runId: "another-run", threadId: "other", phase: "awaiting-approval" };
    // A task can claim the slot before React receives its subscription update.
    for (const button of controls()) flushSync(() => button.click());
    assert(retryCalls === 0, "Immediate runtime guard prevents retry before the busy render");
    notify();
    assert(controls().every(button => button.disabled), "All three retry controls are disabled while another conversation owns the task");
    assert(state.messages.every((message, index) => message.parts[0].text === `Preserved reply ${index}`), "Busy retry never resets historical replies");
    activeTask = null;
    notify();
    assert(controls().every(button => !button.disabled), "Task completion makes historical retry available again");
    for (const button of controls()) flushSync(() => button.click());
    assert(retryCalls === 3, "Each retry control still invokes its action after release");
    store.appendOnly = true;
    flushSync(() => root.render(withDependencies(React.createElement(TooltipProvider, null, React.createElement(ChatThread, { store })), dependencies)));
    assert(controls().length === 3 && controls().every(button => button.disabled), "Append-only sessions disable failed, stopped and completed reply replacement");
    for (const button of controls()) flushSync(() => button.click());
    assert(retryCalls === 3 && fixture.textContent.includes("发送一条新消息继续"), "Durable history remains intact and explains how to continue");
    result.dataset.passed = "true";
    result.textContent = "PASS: failed/stopped/completed retry lock, immediate task guard, preserved history and re-enable after release; append-only sessions preserve durable history";
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}`;
    throw error;
  } finally {
    root.unmount();
  }
</script>
