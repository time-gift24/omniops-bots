<title>Cognacta composer regression</title>
<div id="fixture" style="height:700px;max-width:800px"></div><pre id="result">Running…</pre>
<script type="module">
import React from "react";import {createRoot} from "react-dom/client";import {flushSync} from "react-dom";
import "/src/index.css";import {AgentChatCredits} from "/src/components/premium/agent-chat-input/agent-chat-credits.tsx";

const h=React.createElement,root=createRoot(document.querySelector("#fixture")),fixture=document.querySelector("#fixture"),result=document.querySelector("#result");
const dependencies=createTestDependencies(),calls=[];let external;

const insert=text=>flushSync(()=>{editor().focus();assert(document.execCommand("insertText",false,text),"native insertion must work")});
try{
flushSync(()=>root.render(withDependencies(h(Fixture),dependencies)));
assert(button("发送").disabled,"Blank input cannot send");insert("初始草稿");assert(!button("发送").disabled,"Typing enables send");

flushSync(()=>external(""));

insert("中文输入");flushSync(()=>editor().dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",isComposing:true,bubbles:true,cancelable:true})));assert(calls.length===1,"IME Enter cannot send");

assert(button("移除附件 notes.txt"),"Attachment tray uses Cognacta's controls");flushSync(()=>button("发送").click());assert(calls.at(-1).attached[0].file===file,"The actual File reaches the callback");

flushSync(()=>button("发送").click());assert(calls.at(-1).model==="two","Selected model reaches send");flushSync(()=>button("移除附件 notes.txt").click());await until(()=>!button("移除附件 notes.txt"),"Attachments can be removed");
const image=new File(['<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="20" height="20" fill="green"/></svg>'],"preview.svg",{type:"image/svg+xml"}),images=new DataTransfer();images.items.add(image);
flushSync(()=>{input.files=images.files;input.dispatchEvent(new Event("change",{bubbles:true}))});await until(()=>button("预览 preview.svg"),"Image attachment exposes a preview");flushSync(()=>{button("预览 preview.svg").focus();button("预览 preview.svg").click()});await until(()=>document.querySelector('[role="dialog"]')?.contains(document.activeElement),"Image preview contains keyboard focus");await wait(30);document.activeElement.dispatchEvent(new KeyboardEvent("keydown",{key:"Escape",bubbles:true,cancelable:true}));await until(()=>!document.querySelector('[role="dialog"]'),"Escape closes the image preview");
result.textContent="PASS: Cognacta controlled drafts, rejected send, native paste/undo, IME, File identity, Arc model menu and accessible image preview";
}catch(error){result.textContent=`FAIL\n${error.stack}`;console.error(error)}
</script>
