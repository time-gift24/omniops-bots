<!doctype html>
<meta charset="utf-8" />
<title>Chat subscription regression</title>
<!-- Run npm run dev, then open /tests/chat-subscriptions.browser.html. -->
<style>#fixture { height: 640px; max-width: 900px; } #result { white-space: pre-wrap; }</style>
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import { MotionConfig } from "motion/react";
  import "/src/index.css";
  import { createTestDependencies, withDependencies } from "/tests/support.tsx";
  import { DEMO_MODELS } from "/src/adapters/demo/resources.ts";
  import { ChatScreen } from "/src/components/chat/chat-screen.tsx";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const root = createRoot(fixture);
  const h = React.createElement;
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const wait = (ms = 0) => new Promise(resolve => setTimeout(resolve, ms));
  const gateways = new Map();
  const dependencies = createTestDependencies({ gatewayFor: id => {
    const gateway = {
      requests: [], pending: null, aborts: 0,
      async *stream(request) {
        gateway.requests.push(request);
        try {
          while (true) yield await new Promise(resolve => { gateway.pending = resolve; });
        } finally { gateway.pending = null; }
      },
      abort() {
        gateway.aborts += 1;
        gateway.pending?.({ type: "failed", error: { kind: "aborted", message: "Stopped" } });
        gateway.pending = null;
      },
    };
    gateways.set(id, gateway);
    return gateway;
  } });
  const first = dependencies.threads.get("subscriptions-first");
  const second = dependencies.threads.get("subscriptions-second");
  const metadata = { providerName: "test", protocolName: "test", requestedModel: "sonnet-5" };
  const render = id => flushSync(() => root.render(withDependencies(h(MotionConfig, { reducedMotion: "always" }, h(ChatScreen, { threadId: id, models: DEMO_MODELS })), dependencies)));
  const editor = () => fixture.querySelector('[role="textbox"]');
  const action = label => fixture.querySelector(`button[aria-label="${label}"]`);
  const click = element => { assert(element, "Expected action is missing"); flushSync(() => element.click()); };
  const type = text => flushSync(() => {
    editor().textContent = text;
    editor().dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: text }));
  });
  async function emit(store, event) {
    const gateway = gateways.get(store.getState().threadId);
    for (let i = 0; !gateway.pending && i < 100; i++) await Promise.resolve();
    assert(gateway.pending, "Gateway must be waiting for the next event");
    const previous = store.getState();
    const resolve = gateway.pending;
    gateway.pending = null;
    flushSync(() => resolve(event));
    for (let i = 0; store.getState() === previous && i < 100; i++) await Promise.resolve();
    flushSync(() => {});
    assert(store.getState() !== previous, `Store must consume ${event.type}`);
  }

  let restoreEditor = () => {};
  let deltaReads;
  try {
    render("subscriptions-first");
    assert(editor() && !fixture.querySelector('[aria-label="本会话固定模型"]'), "Empty thread must show an editable composer without a fixed model");
    type("first request");
    flushSync(() => first.updateDraft({ model: "sonnet-5", attachments: [{ id: "file", name: "notes.txt", type: "text/plain" }] }));
    assert(first.getDraft().text === "first request" && action("选择模型: Sonnet 5") && action("移除附件 notes.txt"), "Draft text, model and attachment must stay subscribed");
    click(action("发送"));
    const gateway = gateways.get("subscriptions-first");
    assert(first.getState().status === "submitted" && action("停止生成") && fixture.querySelector('[aria-label="本会话固定模型"]'), "Submitting must switch the screen, fix the model and show Stop");
    assert(gateway.requests[0].model === "sonnet-5" && gateway.requests[0].messages[0].attachments[0].name === "notes.txt", "Submit must use the latest model and attachments");
    assert(first.getDraft().text === "" && first.getDraft().attachments.length === 0, "Accepted submission must clear the submitted draft");
    assert(!action("选择模型: Sonnet 5") && fixture.querySelector('[aria-label="本会话固定模型"]').textContent === "Sonnet 5" && fixture.querySelector('input[type="file"]').disabled, "Submitted state must fix the model and disable attachment changes");
    await emit(first, { type: "started", metadata });
    await emit(first, { type: "part-started", partId: 0, kind: "text" });
    await emit(first, { type: "delta", partId: 0, text: "Live" });
    type("next draft");
    const deadline = performance.now() + 5000;
    while (!fixture.textContent.includes("Live") && performance.now() < deadline) await wait(10);
    assert(fixture.textContent.includes("Live"), "The lazy-loaded thread must show its first delta before measuring updates");
    await wait(300);

    // Observe only the real editor's synchronization work, not ancestor Profiler commits.
    const observed = editor();
    const original = Object.getOwnPropertyDescriptor(observed, "innerHTML");
    const native = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML");
    let reads = 0;
    Object.defineProperty(observed, "innerHTML", {
      configurable: true,
      get() { reads += 1; return native.get.call(this); },
      set(value) { native.set.call(this, value); },
    });
    restoreEditor = () => {
      if (original) Object.defineProperty(observed, "innerHTML", original);
      else delete observed.innerHTML;
    };
    for (const text of [" one", " two", " three"]) {
      await emit(first, { type: "delta", partId: 0, text });
      assert(editor() === observed, "Streaming must preserve the editor instance");
    }
    deltaReads = reads;
    result.dataset.deltaReads = String(deltaReads);
    assert(fixture.textContent.includes("Live one two three"), "Message list must receive every delta");
    assert(editor().textContent === "next draft" && first.getDraft().text === "next draft", "Streaming must preserve the next draft");
    assert(deltaReads === 0, `Three body deltas must skip editor synchronization; innerHTML reads: ${deltaReads}`);
    flushSync(() => first.updateDraft({ text: "updated next draft" }));
    assert(reads > deltaReads && editor().textContent === "updated next draft", "The observation must detect real draft synchronization");
    restoreEditor();
    restoreEditor = () => {};

    await emit(first, { type: "completed", response: { assistant: { parts: [{ type: "text", text: "Live one two three" }] }, finish: { reason: "stop" }, usage: {}, metadata } });
    assert(first.getState().status === "idle" && action("发送") && !action("发送").disabled && !action("选择模型: Sonnet 5") && fixture.querySelector('[aria-label="本会话固定模型"]').textContent === "Sonnet 5", "Completion must re-enable Send and attachments while keeping the model fixed");
    click(action("发送"));
    await emit(first, { type: "failed", error: { kind: "transport", message: "Connection lost" } });
    type("retry after failure");
    assert(first.getState().status === "failed" && !action("发送").disabled, "Failure must keep the composer usable");
    click(action("发送"));
    flushSync(() => first.updateDraft({ text: "first next draft" }));
    flushSync(() => second.updateDraft({ text: "second draft", model: "opus-4.8" }));
    render("subscriptions-second");
    await emit(first, { type: "started", metadata });
    assert(editor().textContent === "second draft" && action("选择模型: Opus 4.8") && action("发送") && !fixture.querySelector('[aria-label="本会话固定模型"]'), "An inactive thread's status must not leak into the active screen");
    render("subscriptions-first");
    assert(editor().textContent === "first next draft" && action("停止生成"), "Returning to a streaming thread must recover its draft and status");
    click(action("停止生成"));
    assert(first.getState().status === "idle" && gateway.aborts === 1 && editor().textContent === "first next draft" && !action("发送").disabled, "Stop must restore Send and preserve the next draft");
    render("subscriptions-second");
    type("changed second draft");
    assert(second.getDraft().text === "changed second draft" && first.getDraft().text === "first next draft", "Draft subscriptions must switch to the active store");
    result.dataset.passed = "true";
    result.textContent = `PASS: 3 streamed body deltas / ${deltaReads} editor innerHTML reads; submitted, streaming, completion, failure, stop, drafts and thread changes`;
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}${deltaReads === undefined ? "" : `\n3 streamed body deltas / ${deltaReads} editor innerHTML reads`}`;
    throw error;
  } finally {
    restoreEditor();
    first.stop();
    second.stop();
    root.unmount();
    dependencies.threads.evictIdle();
  }
</script>
