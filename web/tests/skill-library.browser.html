<!doctype html>
<meta charset="utf-8" />
<title>Skill library interaction regression</title>
<!-- Run npm run dev, then open /tests/skill-library.browser.html. No backend required. -->
<div id="fixture" style="height: 900px; max-height: 95dvh"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React, { useState } from "react"
  import { createRoot } from "react-dom/client"
  import { flushSync } from "react-dom"
  import "/src/index.css"
  import { SkillLibraryScreen } from "/src/components/skills/skill-library-screen.tsx"
  import { createSkillLibrary } from "/src/skills/library.ts"
  import { createTestDependencies, withTestTheme } from "/tests/support.tsx"

  const fixture = document.querySelector("#fixture")
  const result = document.querySelector("#result")
  const root = createRoot(fixture)
  const checks = []
  const packages = new Map()
  const originals = [
    { id: "local-a", name: "巡检技能", description: "本地技能", files: [{ path: "SKILL.md", content: "# 巡检技能\n\n运行前检查。" }, { path: "note.txt", content: "原始参考文本" }] },
    { id: "local-b", name: "排障技能", description: "另一个包", files: [{ path: "beta.txt", content: "第二个 Skill 的独立内容" }] },
    { id: "official", name: "官方运维", description: "已发布的只读包", origin: "official", version: "v1.0.0", files: [{ path: "SKILL.md", content: "# 官方运维\n\n这是固定的官方内容。" }] },
  ]
  const source = { async list() { return structuredClone(originals) } }
  const drafts = { async load() { return {} }, async save() {}, async remove() {} }
  let failWrites = false, failLists = true, failReads = false
  let saveGate = null, saveStarted = false, nextReadGate = null, readStarted = false, nextId = 0
  const experiments = []
  const baseLibrary = createSkillLibrary({
    source, legacyDrafts: drafts, storage: { kind: "browser", root: "UI regression fixture" }, createId: () => `copy-${++nextId}`,
    persistence: {
      async load() { return structuredClone([...packages.values()]) },
      async save(skill) {
        if (failWrites) throw new Error("本地存储暂不可写")
        if (saveGate) { const gate = saveGate; saveGate = null; saveStarted = true; await gate.promise }
        packages.set(skill.id, structuredClone(skill))
      },
      async remove(id) { if (failWrites) throw new Error("本地存储暂不可写"); packages.delete(id) },
    },
  })
  const library = {
    ...baseLibrary,
    async list() { if (failLists) throw new Error("技能目录暂不可读"); return baseLibrary.list() },
    async readFile(id, path) {
      if (failReads) throw new Error("文件暂不可读")
      const gate = nextReadGate?.id === id && nextReadGate.path === path ? nextReadGate : null
      if (gate) nextReadGate = null
      const blob = await baseLibrary.readFile(id, path)
      if (gate) { readStarted = true; await gate.promise }
      return blob
    },
  }
  const dependencies = createTestDependencies({ skillLibrary: library, skills: source, skillDrafts: drafts })
  let chooseSkill, currentId = null
  function Harness() {
    const [skillId, setSkillId] = useState(null)
    chooseSkill = setSkillId
    currentId = skillId
    return React.createElement(SkillLibraryScreen, { skillId, onOpenSkill: setSkillId, onExperiment: id => experiments.push(id) })
  }
  const assert = (condition, message) => { if (!condition) throw new Error(message) }
  const until = async (condition, message) => {
    const deadline = performance.now() + 6000
    while (!condition() && performance.now() < deadline) await new Promise(resolve => setTimeout(resolve, 20))
    assert(condition(), message)
  }
  const visible = element => element && element.getClientRects().length > 0 && !element.closest('[inert], [hidden], [aria-hidden="true"]')
  const button = (name, scope = fixture) => [...scope.querySelectorAll("button")].find(element => visible(element) && (element.getAttribute("aria-label") ?? element.textContent).trim() === name)
  const click = element => { assert(visible(element) && !element.disabled, "Expected enabled visible control"); flushSync(() => { element.focus(); element.click() }) }
  const textarea = () => [...fixture.querySelectorAll('textarea[aria-label^="编辑 "]')].find(visible)
  const write = value => flushSync(() => {
    const input = textarea()
    assert(input && !input.disabled, "Expected editable text input")
    Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, "value").set.call(input, value)
    input.dispatchEvent(new Event("input", { bubbles: true }))
  })
  const choose = id => flushSync(() => chooseSkill(id))
  const deferred = () => { let resolve; const promise = new Promise(done => { resolve = done }); return { promise, resolve } }
  const loadedText = () => fixture.querySelector(".skill-file-preview")?.textContent ?? ""
  const documentView = () => fixture.querySelector('[data-slot="skill-screen"]')
  const fileNav = () => documentView()?.querySelector('nav[aria-label="技能文件"]')
  const visibleFileNav = () => [...document.querySelectorAll('nav[aria-label="技能文件"]')].find(visible)
  const fileActions = () => [...document.querySelectorAll('[data-slot="skill-file-actions"]')].find(visible)
  const filePathInput = () => [...document.querySelectorAll('input[aria-label="新文件路径"]')].find(visible)
  const changeInput = (input, value) => flushSync(() => {
    assert(input && !input.disabled, "Expected an enabled filename input")
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(input, value)
    input.dispatchEvent(new Event("input", { bubbles: true }))
  })
  async function showFileNavigation() {
    if (!visibleFileNav()) click(button("浏览技能文件"))
    await until(visibleFileNav, "File navigation must be available in the sidebar or mobile drawer")
  }
  async function closeFileNavigation() {
    const close = button("关闭文件导航", document)
    if (close) click(close)
    await until(() => !button("关闭文件导航", document), "The mobile file drawer must close")
  }
  async function openFile(name) {
    await showFileNavigation()
    const label = [...visibleFileNav().querySelectorAll(".branched-menu__label")].find(element => visible(element) && element.textContent.trim() === name)
    click(label?.closest("button"))
    await until(() => !button("关闭文件导航", document), "Selecting a file must close the mobile drawer")
  }
  async function beginFile(path) {
    await showFileNavigation()
    assert(fileActions(), "Writable Skills must expose file actions")
    click(button("新建文件", fileActions()))
    await until(filePathInput, "New file must expose a filename input")
    changeInput(filePathInput(), path)
  }
  const editedText = async (id, path) => (await baseLibrary.readFile(id, path)).text()
  const directReading = () => assert(!fixture.querySelector('[data-slot="file-manager"]') && !button("列表查看") && !button("阅读视图") && !button("下载文件"), "Skill details must open directly without a file-manager step or download control")
  const row = name => [...fixture.querySelectorAll(".skill-catalog-row > button")].find(element => element.textContent.includes(name))
  try {
    flushSync(() => root.render(withTestTheme(React.createElement(Harness), dependencies)))
    await until(() => button("重新读取 Skill"), "Catalog failure must expose a retry action")
    assert(!fixture.textContent.includes("暂无 Skill"), "A failed catalog read must not look like an empty library")
    failLists = false
    click(button("重新读取 Skill"))
    await until(() => row("巡检技能"), "Catalog retry must recover the list")
    assert(row("官方运维").closest(".skill-catalog-row").textContent.includes("v1.0.0"), "The catalog must show a published Skill version")
    failReads = true
    click(row("巡检技能"))
    await until(() => button("重新读取文件"), "File read failure must expose a retry action")
    failReads = false
    click(button("重新读取文件"))
    await until(() => visible(documentView()) && loadedText().includes("运行前检查。") && button("编辑"), "Selecting a Skill must open SKILL.md directly in the reading layout")
    assert(fileNav() && documentView().querySelector('[data-slot="document-actions"]'), "Reading must retain file navigation and floating document actions")
    directReading()
    const shortcut = new KeyboardEvent("keydown", { key: "s", metaKey: true, bubbles: true, cancelable: true })
    window.dispatchEvent(shortcut)
    assert(!shortcut.defaultPrevented && !textarea(), "Reading mode must leave Cmd+S to the browser")
    checks.push("Versioned list rows open Skill documents directly; catalog/file read failures retry without reloading")

    click(button("编辑"))
    await until(textarea, "The reading page must offer source editing")
    write("# 阅读草稿\n\n切换后继续编辑。")
    choose("local-b")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "The other Skill must load its first file")
    choose("local-a")
    await until(() => textarea()?.value.includes("切换后继续编辑"), "Switching away and back must retain unsaved source and editor mode")
    assert(await editedText("local-a", "SKILL.md") === originals[0].files[0].content, "Switching Skill must not save an edit implicitly")

    await beginFile("SKILL.md")
    click(button("创建文件", document))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("同名") && !button("创建文件", document)?.disabled, "A duplicate filename must fail without closing the form")
    assert(filePathInput()?.value === "SKILL.md" && await editedText("local-a", "SKILL.md") === originals[0].files[0].content, "Creating a duplicate must retain its filename and never replace saved Markdown")
    changeInput(filePathInput(), "skill.md")
    click(button("创建文件", document))
    await until(() => !button("创建文件", document)?.disabled, "A case-insensitive filename conflict must remain retryable")
    assert(filePathInput()?.value === "skill.md" && !(await baseLibrary.get("local-a")).entries.some(entry => entry.path === "skill.md"), "Case-insensitive conflicts must not create a second entry")
    changeInput(filePathInput(), "new-note.txt")
    failWrites = true
    click(button("创建文件", document))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("保存或读取失败") && !button("创建文件", document)?.disabled, "A failed create must leave the filename available for retry")
    assert(filePathInput()?.value === "new-note.txt" && !(await baseLibrary.get("local-a")).entries.some(entry => entry.path === "new-note.txt"), "A failed create must retain the path without adding a phantom entry")
    failWrites = false
    click(button("创建文件", document))
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 new-note.txt", "Retrying create must select the persisted new file and enter editing")
    assert(document.activeElement === textarea() && textarea().value === "", "A newly created text file must focus its empty editor")
    assert((await baseLibrary.get("local-a")).entries.filter(entry => entry.path === "new-note.txt").length === 1, "A successful retry must add exactly one file")
    write("新增文件的正文")
    click(button("保存文件"))
    await until(() => !textarea() && loadedText().includes("新增文件的正文"), "The created file must use the existing save flow")
    await openFile("SKILL.md")
    await until(() => loadedText().includes("切换后继续编辑"), "Adding and saving a file must retain the original Markdown draft")
    click(button("编辑"))
    await until(() => textarea()?.value.includes("切换后继续编辑"), "The original Markdown draft must remain editable")
    assert(await editedText("local-a", "SKILL.md") === originals[0].files[0].content, "Adding another file must not implicitly save Markdown")

    await showFileNavigation()
    const upload = fileActions().querySelector('input[aria-label="选择 Skill 上传文件"]')
    const uploadFiles = new DataTransfer()
    uploadFiles.items.add(new File(["上传失败后仍保留的正文"], "uploaded-note.txt", { type: "text/plain" }))
    failWrites = true
    flushSync(() => { upload.files = uploadFiles.files; upload.dispatchEvent(new Event("change", { bubbles: true })) })
    await until(() => button("重试上传", document), "A failed upload must retain the selected File for retry")
    assert(button("取消上传", document) && !(await baseLibrary.get("local-a")).entries.some(entry => entry.path === "uploaded-note.txt"), "A failed upload must be cancellable and leave durable files unchanged")
    failWrites = false
    click(button("重试上传", document))
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 uploaded-note.txt" && textarea()?.value === "上传失败后仍保留的正文", "Retry upload must persist the same File and open its editor")
    assert(await editedText("local-a", "uploaded-note.txt") === "上传失败后仍保留的正文", "Retry upload must preserve the original selected bytes")
    click(button("保存文件"))
    await until(() => !textarea() && button("编辑"), "Saving an unchanged uploaded file must leave editing")
    await openFile("SKILL.md")
    await until(() => loadedText().includes("切换后继续编辑"), "Uploading another file must preserve the original Markdown draft")
    click(button("编辑"))
    await until(() => textarea()?.value.includes("切换后继续编辑"), "The original Markdown draft must still be editable after upload")
    checks.push("Sidebar and mobile file actions create and upload; conflicts never overwrite; failed writes retain input and existing Markdown drafts")

    click(button("撤销"))
    await until(() => !textarea() && loadedText().includes("运行前检查。"), "Undo must restore the saved reading content")
    await openFile("note.txt")
    await until(() => loadedText().includes("原始参考文本") && button("编辑"), "The document file navigation must open references directly")
    directReading()
    click(button("编辑"))
    write("失败时保留的编辑")
    failWrites = true
    click(button("保存文件"))
    await until(() => fixture.querySelector('[role="alert"]') && button("保存文件") && !button("保存文件").disabled, "Failed saves must remain retryable")
    assert(textarea().value === "失败时保留的编辑" && await editedText("local-a", "note.txt") === "原始参考文本", "Save failure must preserve draft and durable bytes")
    failWrites = false
    const saving = deferred()
    saveGate = saving; saveStarted = false
    write("保存开始时的快照")
    click(button("保存文件"))
    await until(() => saveStarted, "Delayed save did not start")
    write("保存期间继续输入的内容")
    saving.resolve()
    await until(() => button("保存文件") && !button("保存文件").disabled && textarea()?.value === "保存期间继续输入的内容", "New typing during saving must remain unsaved")
    assert(await editedText("local-a", "note.txt") === "保存开始时的快照", "Only the captured save version may persist")
    click(button("保存文件"))
    await until(() => !textarea() && button("编辑") && loadedText().includes("保存期间继续输入的内容"), "Saving the current version must return to reading")
    checks.push("Document navigation preserves drafts; failed saves retain bytes; delayed saves preserve newer typing")

    click(button("编辑"))
    write("实验保存时的版本")
    const experimentSave = deferred()
    saveGate = experimentSave; saveStarted = false
    click(button("在新会话中实验"))
    await until(() => saveStarted, "Experiment must save pending edits before opening a conversation")
    write("实验等待期间的新编辑")
    const refreshing = deferred()
    readStarted = false; nextReadGate = { ...refreshing, id: "local-a", path: "note.txt" }
    experimentSave.resolve()
    await until(() => readStarted && button("在新会话中实验") && !button("在新会话中实验").disabled, "Experiment save did not refresh the persisted file")
    assert(experiments.length === 0 && textarea()?.value === "实验等待期间的新编辑", "An experiment must not launch with an older saved version")
    refreshing.resolve()
    click(button("在新会话中实验"))
    await until(() => experiments.length === 1, "Retrying experiment must save the latest source")
    assert(experiments[0] === "local-a" && await editedText("local-a", "note.txt") === "实验等待期间的新编辑", "Experiment must use the latest saved source")
    choose("local-b")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "Second Skill must load")
    const reading = deferred()
    readStarted = false; nextReadGate = { ...reading, id: "local-a", path: "note.txt" }
    choose("local-a")
    await until(() => readStarted, "Delayed preview read did not start")
    choose("local-b")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "Second Skill must load independently")
    reading.resolve()
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))
    assert(currentId === "local-b" && !loadedText().includes("实验等待期间的新编辑"), "A stale response must not contaminate another Skill")
    checks.push("Experiments save the latest source; switching Skill ignores delayed file responses")

    await beginFile("background.txt")
    const backgroundSave = deferred()
    saveGate = backgroundSave; saveStarted = false
    click(button("创建文件", document))
    await until(() => saveStarted, "A background file create must reach persistence")
    choose("local-a")
    await until(() => loadedText().includes("实验等待期间的新编辑"), "Switching Skill must keep its own document available while another file is saving")
    backgroundSave.resolve()
    await until(() => button("在新会话中实验") && !button("在新会话中实验").disabled, "The background file save must finish")
    assert(currentId === "local-a" && !textarea() && loadedText().includes("实验等待期间的新编辑"), "A completed background create must not select a file or enter editing in another Skill")
    assert((await baseLibrary.get("local-b")).entries.some(entry => entry.path === "background.txt"), "A completed background create must remain saved to its original Skill")
    choose("local-b")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "Returning to a Skill must preserve its selected file after a background create")
    await openFile("background.txt")
    await until(() => fixture.querySelector('.skill-file-preview')?.getAttribute("aria-label") === "background.txt 文件内容" && button("编辑") && !button("编辑").disabled, "The file created in the background must be available from navigation")
    checks.push("Background file creation persists to its original Skill without stealing the current document")

    await beginFile("same-skill-background.txt")
    const sameSkillSave = deferred()
    saveGate = sameSkillSave; saveStarted = false
    click(button("创建文件", document))
    await until(() => saveStarted, "A delayed same-Skill file create must reach persistence")
    await openFile("beta.txt")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "File navigation must remain available while a new file is saving")
    sameSkillSave.resolve()
    await until(() => button("在新会话中实验") && !button("在新会话中实验").disabled, "The delayed same-Skill file save must finish")
    assert(currentId === "local-b" && !textarea() && loadedText().includes("第二个 Skill 的独立内容"), "Finishing a file create must not steal a newer file selection within the same Skill")
    assert((await baseLibrary.get("local-b")).entries.some(entry => entry.path === "same-skill-background.txt"), "A file created after selecting another file must still be persisted")
    checks.push("Delayed file creation preserves newer file selections within the same Skill")

    choose("official")
    await until(() => loadedText().includes("这是固定的官方内容。"), "Official Skill must open directly in reading mode")
    assert(!button("编辑"), "Official files must remain read-only")
    await showFileNavigation()
    assert(!document.querySelector('[data-slot="skill-file-actions"]') && !button("新建文件", document) && !button("上传文件", document), "Official Skills must not expose file creation or upload in either navigation surface")
    await closeFileNavigation()
    directReading()
    click(button("复制为本地 Skill"))
    await until(() => currentId?.startsWith("copy-") && button("编辑") && !button("编辑").disabled, "A local copy must open its editable document directly")
    const copiedId = currentId
    click(button("编辑")); write("# 本地副本改动"); click(button("保存文件"))
    await until(() => !textarea() && loadedText().includes("本地副本改动"), "Local copy save must return to reading")
    assert(await editedText(copiedId, "SKILL.md") === "# 本地副本改动" && await editedText("official", "SKILL.md") === originals[2].files[0].content, "Editing a local copy must not modify the official release")
    choose(null)
    await until(() => row("巡检技能"), "The catalog must remain reachable")
    click(button(`删除 ${(await baseLibrary.get(copiedId)).name}`))
    failWrites = true
    click(button("确认删除"))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.trim() && button("确认删除") && !button("确认删除").disabled, "Failed deletion must retain confirmation and allow retry")
    assert(await editedText(copiedId, "SKILL.md") === "# 本地副本改动", "Failed deletion must preserve the Skill")
    failWrites = false
    click(button("确认删除"))
    await until(() => !button(`删除 ${(originals[2].name)} 副本`), "Successful deletion must remove the copied Skill")
    assert(!(await baseLibrary.list()).some(skill => skill.id === copiedId), "Deleted Skill must leave the catalog")
    checks.push("Official Skills stay read-only; local copies edit independently; failed deletion preserves content and retries")

    result.dataset.status = "passed"
    result.textContent = `PASS (${checks.length})\n${checks.join("\n")}`
  } catch (error) {
    result.dataset.status = "failed"
    result.textContent = `FAIL after ${checks.length} checks\n${checks.join("\n")}\n${error.stack}`
    console.error(error)
  }
</script>
