<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill library interaction regression</title>
<!-- Run npm run dev, then open /tests/skill-library.browser.html. No backend required. -->
<div id="fixture" style="height: 900px; max-height: 95dvh"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React, { useState } from "react"
  import { createRoot } from "react-dom/client"
  import { flushSync } from "react-dom"
  import "/src/index.css"
  import { SkillLibraryScreen } from "/src/components/skills/skill-library-screen.tsx"
  import { createSkillLibrary } from "/src/skills/library.ts"
  import { createTestDependencies, withTestTheme } from "/tests/support.tsx"

  const fixture = document.querySelector("#fixture")
  const result = document.querySelector("#result")
  const root = createRoot(fixture)
  const checks = []
  const packages = new Map()
  const originals = [
    { id: "local-a", name: "巡检技能", description: "本地技能", files: [{ path: "SKILL.md", content: "# 巡检技能\n\n运行前检查。" }, { path: "note.txt", content: "原始参考文本" }, { path: "未命名.MD", content: "保留同名原文件" }, { path: "未命名目录", content: "目录名称已被文件占用" }, { path: "reference/seed.txt", content: "子目录参考文本" }] },
    { id: "local-b", name: "排障技能", description: "另一个包", files: [{ path: "beta.txt", content: "第二个 Skill 的独立内容" }] },
    { id: "official", name: "官方运维", description: "已发布的只读包", origin: "official", version: "v1.0.0", files: [{ path: "SKILL.md", content: "# 官方运维\n\n这是固定的官方内容。" }] },
  ]
  const source = { async list() { return structuredClone(originals) } }
  const drafts = { async load() { return {} }, async save() {}, async remove() {} }
  let failWrites = false, failLists = true, failReads = false
  let saveGate = null, saveStarted = false, nextReadGate = null, readStarted = false, nextId = 0
  const experiments = []
  const baseLibrary = createSkillLibrary({
    source, legacyDrafts: drafts, storage: { kind: "browser", root: "UI regression fixture" }, createId: () => `copy-${++nextId}`,
    persistence: {
      async load() { return structuredClone([...packages.values()]) },
      async save(skill) {
        if (failWrites) throw new Error("本地存储暂不可写")
        if (saveGate) { const gate = saveGate; saveGate = null; saveStarted = true; await gate.promise }
        packages.set(skill.id, structuredClone(skill))
      },
      async remove(id) { if (failWrites) throw new Error("本地存储暂不可写"); packages.delete(id) },
    },
  })
  const library = {
    ...baseLibrary,
    async list() { if (failLists) throw new Error("技能目录暂不可读"); return baseLibrary.list() },
    async readFile(id, path) {
      if (failReads) throw new Error("文件暂不可读")
      const gate = nextReadGate?.id === id && nextReadGate.path === path ? nextReadGate : null
      if (gate) nextReadGate = null
      const blob = await baseLibrary.readFile(id, path)
      if (gate) { readStarted = true; await gate.promise }
      return blob
    },
  }
  const dependencies = createTestDependencies({ skillLibrary: library, skills: source, skillDrafts: drafts })
  let chooseSkill, currentId = null
  function Harness() {
    const [skillId, setSkillId] = useState(null)
    chooseSkill = setSkillId
    currentId = skillId
    return React.createElement(SkillLibraryScreen, { skillId, onOpenSkill: setSkillId, onExperiment: id => experiments.push(id) })
  }
  const assert = (condition, message) => { if (!condition) throw new Error(message) }
  const until = async (condition, message) => {
    const deadline = performance.now() + 6000
    while (!condition() && performance.now() < deadline) await new Promise(resolve => setTimeout(resolve, 20))
    assert(condition(), message)
  }
  const visible = element => element && element.getClientRects().length > 0 && !element.closest('[inert], [hidden], [aria-hidden="true"]')
  const button = (name, scope = fixture) => [...scope.querySelectorAll("button")].find(element => visible(element) && (element.getAttribute("aria-label") ?? element.textContent).trim() === name)
  const click = element => { assert(visible(element) && !element.disabled, "Expected enabled visible control"); flushSync(() => { element.focus(); element.click() }) }
  const textarea = () => [...fixture.querySelectorAll('textarea[aria-label^="编辑 "]')].find(visible)
  const fillName = (input, value) => flushSync(() => {
    assert(visible(input) && !input.disabled, "Expected editable inline name")
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(input, value)
    input.dispatchEvent(new Event("input", { bubbles: true }))
  })
  const write = value => flushSync(() => {
    const input = textarea()
    assert(input && !input.disabled, "Expected editable text input")
    Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, "value").set.call(input, value)
    input.dispatchEvent(new Event("input", { bubbles: true }))
  })
  const choose = id => flushSync(() => chooseSkill(id))
  const deferred = () => { let resolve; const promise = new Promise(done => { resolve = done }); return { promise, resolve } }
  const loadedText = () => fixture.querySelector(".skill-file-preview")?.textContent ?? ""
  const documentView = () => fixture.querySelector('[data-slot="skill-screen"]')
  const fileNav = () => documentView()?.querySelector('nav[aria-label="技能文件"]')
  const visibleFileNav = () => [...document.querySelectorAll('nav[aria-label="技能文件"]')].find(visible)
  const fileTree = () => [...document.querySelectorAll('[data-slot="skill-file-tree"]')].find(visible)
  const treeRow = path => [...visibleFileNav().querySelectorAll('[data-menu-value]')].find(element => element.dataset.menuValue === path)
  const menuItem = name => [...document.querySelectorAll('[role="menuitem"]')].find(element => visible(element) && element.textContent.trim() === name)
  async function showFileNavigation() {
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))
    const ready = () => {
      const nav = visibleFileNav(), panel = nav?.closest(".chat-modal-panel")
      return nav && (!panel || Number(getComputedStyle(panel).opacity) >= 0.999)
    }
    await until(() => ready() || (!visibleFileNav() && button("浏览技能文件")), "File navigation must finish exiting before it can reopen")
    if (!ready()) click(button("浏览技能文件"))
    await until(ready, "File navigation must be fully available in the sidebar or mobile drawer")
  }
  async function closeFileNavigation() {
    const close = button("关闭文件导航", document)
    if (close) click(close)
    await until(() => !button("关闭文件导航", document), "The mobile file drawer must close")
  }
  async function openFile(name) {
    await showFileNavigation()
    const label = [...visibleFileNav().querySelectorAll(".branched-menu__label")].find(element => visible(element) && element.textContent.trim() === name)
    click(label?.closest("button"))
    await until(() => !button("关闭文件导航", document), "Selecting a file must close the mobile drawer")
  }
  async function openActions(path = null, mode = "context") {
    await showFileNavigation()
    await until(() => [...fileTree().querySelectorAll('button[data-skill-action]')].every(button => !button.disabled), "The previous tree action must settle")
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))
    const target = path === null ? fileTree() : treeRow(path)?.querySelector("button")
    assert(visible(target), "The file tree context target must exist")
    flushSync(() => {
      target.focus()
      const bounds = target.getBoundingClientRect()
      target.dispatchEvent(mode === "keyboard"
        ? new KeyboardEvent("keydown", { key: "F10", shiftKey: true, bubbles: true, cancelable: true })
        : new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: bounds.left + 12, clientY: bounds.top + 12 }))
    })
    await until(() => menuItem("新建文件"), "Right-click and keyboard must retain the beui file tree dropdown")
    if (path === null) assert(!menuItem("重命名") && !menuItem("删除"), "Whitespace actions must only create entries")
    return [...document.querySelectorAll('[role="menuitem"]')].filter(visible)
  }
  async function performTreeAction(action, path, mode) {
    if (mode !== "hover" || path === null) {
      await openActions(path, mode)
      click(menuItem(action))
      return
    }
    await showFileNavigation()
    await until(() => treeRow(path) && [...treeRow(path).querySelectorAll('button[data-skill-action]')].every(button => !button.disabled), "The previous row action must settle")
    flushSync(() => treeRow(path).querySelector("button").focus())
    const control = button(`${action} ${path}`, treeRow(path))
    assert(control?.title === `${action} ${path}`, "Each direct action icon must have an accessible name and title")
    click(control)
    assert(!menuItem("新建文件"), "A direct row action must run without opening an extra menu")
  }
  const checkRowActions = (path, folder = false) => {
    const row = treeRow(path)
    const expected = (folder ? ["新建文件", "新建目录", "重命名", "删除"] : ["重命名", "删除"]).map(action => `${action} ${path}`)
    const actions = [...row.querySelectorAll('button[data-skill-action]')]
    assert(actions.length === expected.length && actions.every((control, index) => control.getAttribute("aria-label") === expected[index] && control.title === expected[index]), "Folders must expose four direct icons and files exactly rename/delete in order")
    assert(!fileTree().querySelector('button[aria-label^="操作 "]'), "Direct icons must replace the ellipsis action menu button")
    const plain = row.cloneNode(true)
    plain.removeAttribute("data-actions")
    plain.querySelectorAll(".branched-menu__actions").forEach(element => element.remove())
    row.after(plain)
    const original = row.querySelector(".branched-menu__head, .branched-menu__item")
    const baseline = plain.querySelector(".branched-menu__head, .branched-menu__item")
    const presentation = getComputedStyle(original)
    if (original.classList.contains("branched-menu__item")) {
      assert(presentation.height === "36px" && presentation.fontSize === "14px", "Branch rows must retain the menu's 36px height and 14px text without shared Button size overrides")
    }
    assert(presentation.backgroundColor === "rgba(0, 0, 0, 0)" && presentation.borderRadius === "0px", "Menu selection must use its text and branch highlighting without an added pill background")
    if (original.hasAttribute("data-active")) {
      assert(presentation.color === getComputedStyle(original.closest("nav").querySelector(".branched-menu__marker")).backgroundColor, "The selected row must use the menu's accent color")
    }
    const styles = ["height", "width", "padding", "margin", "font", "borderRadius"]
    assert(styles.every(property => getComputedStyle(original)[property] === getComputedStyle(baseline)[property]) && original.querySelector(".branched-menu__label").getBoundingClientRect().width === baseline.querySelector(".branched-menu__label").getBoundingClientRect().width, "Action icons must not override the original Branched Menu row dimensions or label space when idle")
    plain.remove()
  }
  async function createEntry(action, path = null, mode = "context") {
    await performTreeAction(action, path, mode)
    assert(!document.querySelector('form[aria-label="新建技能文件"], input[aria-label="新文件路径"]'), "File creation must be immediate without a filename form")
  }
  const beginFile = (path = null, mode) => createEntry("新建文件", path, mode)
  const beginDirectory = (path = null, mode) => createEntry("新建目录", path, mode)
  const renameInput = path => [...document.querySelectorAll("input")].find(input => visible(input) && input.getAttribute("aria-label") === `重命名 ${path}`)
  async function beginRename(path, mode = "hover") {
    await performTreeAction("重命名", path, mode)
    await until(() => renameInput(path) && document.activeElement === renameInput(path), "Rename must focus an inline name editor")
  }
  const submitName = (path, value, key = "Enter") => {
    fillName(renameInput(path), value)
    flushSync(() => {
      if (key === "Enter") renameInput(path).form.requestSubmit()
      else renameInput(path).dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }))
    })
  }
  async function requestDelete(path, kind = "文件", mode = "hover") {
    await performTreeAction("删除", path, mode)
    await until(() => button("确认删除", document), "Deletion must request confirmation")
    const dialog = button("确认删除", document).closest('[role="dialog"], [role="alertdialog"]')
    assert(dialog?.textContent.includes(`删除${kind}`) && dialog.textContent.includes(path.split("/").at(-1)), "Delete confirmation must name the selected entry and its kind")
    return dialog
  }
  const editedText = async (id, path) => (await baseLibrary.readFile(id, path)).text()
  const directReading = () => assert(!fixture.querySelector('[data-slot="file-manager"], [data-slot="skill-file-actions"], form[aria-label="管理 Skill 文件与目录"]') && !fixture.textContent.includes("管理文件与目录") && !button("新建文件", document) && !button("上传文件", document) && !button("列表查看") && !button("阅读视图") && !button("下载文件"), "Skill details must use only the file tree context menu without a management section or toolbar")
  const row = name => [...fixture.querySelectorAll(".skill-catalog-row > button")].find(element => element.textContent.includes(name))
  try {
    await baseLibrary.createDirectory("local-a", "未命名-2.md")
    await baseLibrary.createDirectory("local-a", "未命名目录-2")
    await baseLibrary.writeFile("local-a", "payload.bin", new Blob([new Uint8Array([0, 1, 2])], { type: "application/octet-stream" }))
    flushSync(() => root.render(withTestTheme(React.createElement(Harness), dependencies)))
    await until(() => button("重新读取 Skill"), "Catalog failure must expose a retry action")
    assert(!fixture.textContent.includes("暂无 Skill"), "A failed catalog read must not look like an empty library")
    failLists = false
    click(button("重新读取 Skill"))
    await until(() => row("巡检技能"), "Catalog retry must recover the list")
    assert(row("官方运维").closest(".skill-catalog-row").textContent.includes("v1.0.0"), "The catalog must show a published Skill version")
    failReads = true
    click(row("巡检技能"))
    await until(() => button("重新读取文件"), "File read failure must expose a retry action")
    failReads = false
    click(button("重新读取文件"))
    await until(() => visible(documentView()) && loadedText().includes("运行前检查。") && button("编辑"), "Selecting a Skill must open SKILL.md directly in the reading layout")
    assert(fileNav() && documentView().querySelector('[data-slot="document-actions"]'), "Reading must retain file navigation and floating document actions")
    directReading()
    await showFileNavigation()
    checkRowActions("SKILL.md")
    checkRowActions("reference", true)
    checkRowActions("reference/seed.txt")
    await closeFileNavigation()
    const shortcut = new KeyboardEvent("keydown", { key: "s", metaKey: true, bubbles: true, cancelable: true })
    window.dispatchEvent(shortcut)
    assert(!shortcut.defaultPrevented && !textarea(), "Reading mode must leave Cmd+S to the browser")
    checks.push("Versioned list rows open Skill documents directly; catalog/file read failures retry without reloading")

    click(button("编辑"))
    await until(textarea, "The reading page must offer source editing")
    write("# 阅读草稿\n\n切换后继续编辑。")
    choose("local-b")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "The other Skill must load its first file")
    choose("local-a")
    await until(() => textarea()?.value.includes("切换后继续编辑"), "Switching away and back must retain unsaved source and editor mode")
    assert(await editedText("local-a", "SKILL.md") === originals[0].files[0].content, "Switching Skill must not save an edit implicitly")

    failWrites = true
    await beginFile()
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("保存或读取失败"), "A failed create must expose a safe retryable error")
    assert(!(await baseLibrary.get("local-a")).entries.some(entry => entry.path === "未命名-3.md"), "A failed create must not add a phantom entry")
    assert(fixture.querySelector('textarea[aria-label="编辑 SKILL.md"]')?.value.includes("切换后继续编辑"), "A failed create must preserve the original unsaved editor")
    failWrites = false
    await beginFile()
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 未命名-3.md", "Retry must skip case-insensitive file and empty-directory conflicts and enter editing")
    await until(() => document.activeElement === textarea() && textarea().value === "", "A new file must focus its empty editor after navigation closes")
    assert((await baseLibrary.get("local-a")).entries.filter(entry => entry.path === "未命名-3.md").length === 1, "A successful retry must add exactly one file")
    assert(await editedText("local-a", "未命名.MD") === "保留同名原文件", "Automatic naming must preserve existing case-insensitive files")
    write("新增文件的正文")
    click(button("保存文件"))
    await until(() => !textarea() && loadedText().includes("新增文件的正文"), "A created file must use the existing save flow")
    await beginFile("未命名-3.md", "keyboard")
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 未命名-4.md" && textarea().value === "", "Keyboard context menu on a file must create a distinct sibling")
    assert(await editedText("local-a", "未命名-3.md") === "新增文件的正文", "Repeated creation must not overwrite the previous new file")
    await beginFile("reference", "hover")
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 reference/未命名.md" && textarea().value === "", "The directory's direct new-file icon must create inside that directory")
    assert(await editedText("local-a", "reference/未命名.md") === "", "The nested blank file must persist")
    await beginFile("reference/seed.txt")
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 reference/未命名-2.md" && textarea().value === "", "Right-clicking a file must create inside its parent directory")
    await openFile("SKILL.md")
    await until(() => loadedText().includes("切换后继续编辑"), "Creating other files must retain the original Markdown draft")
    click(button("编辑"))
    await until(() => textarea()?.value.includes("切换后继续编辑"), "The original Markdown draft must remain editable")
    assert(await editedText("local-a", "SKILL.md") === originals[0].files[0].content, "Adding another file must not implicitly save Markdown")
    checks.push("Direct directory icons plus right-click and keyboard create unique blank files; idle Branched Menu dimensions stay unchanged and failures preserve drafts")

    failWrites = true
    await beginDirectory()
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("保存或读取失败"), "Failed directory creation must expose a safe error")
    assert(!(await baseLibrary.get("local-a")).entries.some(entry => entry.path === "未命名目录-3"), "A failed directory create must not add a phantom folder")
    failWrites = false
    await beginDirectory()
    await showFileNavigation()
    await until(() => treeRow("未命名目录-3"), "A new empty directory must appear in the file tree and skip occupied names")
    await beginDirectory("未命名目录-3", "hover")
    await showFileNavigation()
    await until(() => treeRow("未命名目录-3/未命名目录"), "An empty directory must support nested directory creation")
    await beginFile("未命名目录-3/未命名目录", "hover")
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 未命名目录-3/未命名目录/未命名.md" && document.activeElement === textarea(), "A nested empty directory must support immediate editing of a new file")
    assert((await baseLibrary.get("local-a")).entries.some(entry => entry.path === "未命名目录-3/未命名目录" && entry.kind === "folder"), "Nested empty directories must persist as directory entries")
    await openFile("SKILL.md")
    await until(() => loadedText().includes("切换后继续编辑"), "Directory creation must retain the original source draft")
    click(button("编辑"))
    checks.push("Directory context actions preserve empty folders, skip occupied names, and work on nested folders with keyboard access")

    await openFile("seed.txt")
    await until(() => loadedText().includes("子目录参考文本"), "Nested reference must load before renaming")
    click(button("编辑")); write("重命名后仍然保留的未保存编辑")
    await beginRename("reference/seed.txt")
    submitName("reference/seed.txt", "取消改名.txt", "Escape")
    await until(() => !renameInput("reference/seed.txt"), "Escape must cancel the inline rename")
    assert((await baseLibrary.get("local-a")).entries.some(entry => entry.path === "reference/seed.txt"), "Cancelling rename must preserve the original entry")
    await beginRename("reference/seed.txt")
    failWrites = true
    submitName("reference/seed.txt", "renamed.txt")
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("保存或读取失败") && renameInput("reference/seed.txt") && !renameInput("reference/seed.txt").disabled, "Failed rename must keep the inline editor available to retry")
    assert(renameInput("reference/seed.txt").value === "renamed.txt" && await editedText("local-a", "reference/seed.txt") === "子目录参考文本", "Rename failure must retain the proposed name, dirty content, and persisted source")
    failWrites = false
    submitName("reference/seed.txt", "renamed.txt")
    await until(() => !renameInput("reference/seed.txt"), "Successful file rename must finish inline")
    await closeFileNavigation()
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 reference/renamed.txt" && textarea().value === "重命名后仍然保留的未保存编辑", "Renaming a selected file must carry its unsaved editor to the new path")
    assert(await editedText("local-a", "reference/renamed.txt") === "子目录参考文本", "Rename must not implicitly save dirty file content")
    let confirmation = await requestDelete("reference/renamed.txt")
    click(button("确认删除", confirmation))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("未保存"), "Deleting a dirty file must expose a safe error")
    assert(fixture.querySelector('textarea[aria-label="编辑 reference/renamed.txt"]')?.value === "重命名后仍然保留的未保存编辑" && await editedText("local-a", "reference/renamed.txt") === "子目录参考文本", "Blocked file deletion must preserve its unsaved and saved bytes")
    click(button("取消", confirmation))
    await until(() => !confirmation.isConnected, "The delete confirmation must close before another file action")
    await beginRename("reference", "context")
    submitName("reference", "renamed-reference")
    await until(() => !renameInput("reference"), "Successful directory rename must finish inline")
    await closeFileNavigation()
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 renamed-reference/renamed.txt" && textarea().value === "重命名后仍然保留的未保存编辑", "Renaming a directory must move the selected descendant and its dirty editor together")
    const renamedPackage = await baseLibrary.get("local-a")
    assert(renamedPackage.entries.some(entry => entry.path === "renamed-reference/未命名.md") && !renamedPackage.entries.some(entry => entry.path === "reference" || entry.path.startsWith("reference/")), "Directory rename must move all descendants")
    confirmation = await requestDelete("renamed-reference", "目录", "context")
    click(button("确认删除", confirmation))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("未保存"), "Deleting a directory with dirty descendants must be blocked")
    assert(fixture.querySelector('textarea[aria-label="编辑 renamed-reference/renamed.txt"]')?.value === "重命名后仍然保留的未保存编辑", "Blocked subtree deletion must retain the selected dirty descendant")
    click(button("取消", confirmation))
    await until(() => !confirmation.isConnected, "The delete confirmation must close before saving")
    await closeFileNavigation()
    click(button("保存文件"))
    await until(() => !textarea() && loadedText().includes("重命名后仍然保留的未保存编辑"), "A renamed dirty file must remain saveable at its new path")
    confirmation = await requestDelete("renamed-reference", "目录")
    failWrites = true
    click(button("确认删除", confirmation))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("保存或读取失败") && button("确认删除", confirmation) && !button("确认删除", confirmation).disabled, "Failed subtree deletion must leave its confirmation retryable")
    assert(await editedText("local-a", "renamed-reference/renamed.txt") === "重命名后仍然保留的未保存编辑", "Failed deletion must preserve the complete renamed subtree")
    failWrites = false
    click(button("确认删除", confirmation))
    await until(() => !confirmation.isConnected, "Successful deletion must close its confirmation")
    await closeFileNavigation()
    await until(() => !textarea() && loadedText().includes("切换后继续编辑"), "Deleting the selected descendant must select the remaining main document and retain its own draft")
    assert(!(await baseLibrary.get("local-a")).entries.some(entry => entry.path.startsWith("renamed-reference")), "Confirmed directory deletion must remove all descendants")
    click(button("编辑"))
    checks.push("Hover actions and right-click rename files and whole directories; names and dirty descendants survive failure, while unsafe deletion is blocked and successful deletion selects a remaining file")

    click(button("撤销"))
    await until(() => !textarea() && loadedText().includes("运行前检查。"), "Undo must restore the saved reading content")
    await openFile("note.txt")
    await until(() => loadedText().includes("原始参考文本") && button("编辑"), "The document file navigation must open references directly")
    directReading()
    click(button("编辑"))
    write("失败时保留的编辑")
    failWrites = true
    click(button("保存文件"))
    await until(() => fixture.querySelector('[role="alert"]') && button("保存文件") && !button("保存文件").disabled, "Failed saves must remain retryable")
    assert(textarea().value === "失败时保留的编辑" && await editedText("local-a", "note.txt") === "原始参考文本", "Save failure must preserve draft and durable bytes")
    failWrites = false
    const saving = deferred()
    saveGate = saving; saveStarted = false
    write("保存开始时的快照")
    click(button("保存文件"))
    await until(() => saveStarted, "Delayed save did not start")
    write("保存期间继续输入的内容")
    saving.resolve()
    await until(() => button("保存文件") && !button("保存文件").disabled && textarea()?.value === "保存期间继续输入的内容", "New typing during saving must remain unsaved")
    assert(await editedText("local-a", "note.txt") === "保存开始时的快照", "Only the captured save version may persist")
    click(button("保存文件"))
    await until(() => !textarea() && button("编辑") && loadedText().includes("保存期间继续输入的内容"), "Saving the current version must return to reading")
    checks.push("Document navigation preserves drafts; failed saves retain bytes; delayed saves preserve newer typing")

    click(button("编辑"))
    write("实验保存时的版本")
    const experimentSave = deferred()
    saveGate = experimentSave; saveStarted = false
    click(button("在新会话中实验"))
    await until(() => saveStarted, "Experiment must save pending edits before opening a conversation")
    write("实验等待期间的新编辑")
    const refreshing = deferred()
    readStarted = false; nextReadGate = { ...refreshing, id: "local-a", path: "note.txt" }
    experimentSave.resolve()
    await until(() => readStarted && button("在新会话中实验") && !button("在新会话中实验").disabled, "Experiment save did not refresh the persisted file")
    assert(experiments.length === 0 && textarea()?.value === "实验等待期间的新编辑", "An experiment must not launch with an older saved version")
    refreshing.resolve()
    click(button("在新会话中实验"))
    await until(() => experiments.length === 1, "Retrying experiment must save the latest source")
    assert(experiments[0] === "local-a" && await editedText("local-a", "note.txt") === "实验等待期间的新编辑", "Experiment must use the latest saved source")
    choose("local-b")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "Second Skill must load")
    const reading = deferred()
    readStarted = false; nextReadGate = { ...reading, id: "local-a", path: "note.txt" }
    choose("local-a")
    await until(() => readStarted, "Delayed preview read did not start")
    choose("local-b")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "Second Skill must load independently")
    reading.resolve()
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))
    assert(currentId === "local-b" && !loadedText().includes("实验等待期间的新编辑"), "A stale response must not contaminate another Skill")
    checks.push("Experiments save the latest source; switching Skill ignores delayed file responses")

    const backgroundSave = deferred()
    saveGate = backgroundSave; saveStarted = false
    await beginFile()
    await until(() => saveStarted, "A background file create must reach persistence")
    choose("local-a")
    await until(() => loadedText().includes("实验等待期间的新编辑"), "Switching Skill must keep its own document available while another file is saving")
    backgroundSave.resolve()
    await until(() => button("在新会话中实验") && !button("在新会话中实验").disabled, "The background file save must finish")
    assert(currentId === "local-a" && !textarea() && loadedText().includes("实验等待期间的新编辑"), "A completed background create must not select a file or enter editing in another Skill")
    assert((await baseLibrary.get("local-b")).entries.some(entry => entry.path === "未命名.md"), "A completed background create must remain saved to its original Skill")
    choose("local-b")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "Returning to a Skill must preserve its selected file after a background create")
    await openFile("未命名.md")
    await until(() => fixture.querySelector('.skill-file-preview')?.getAttribute("aria-label") === "未命名.md 文件内容" && button("编辑") && !button("编辑").disabled, "The file created in the background must be available from navigation")
    checks.push("Background file creation persists to its original Skill without stealing the current document")

    const sameSkillSave = deferred()
    saveGate = sameSkillSave; saveStarted = false
    await beginFile()
    await until(() => saveStarted, "A delayed same-Skill file create must reach persistence")
    await openFile("beta.txt")
    await until(() => loadedText().includes("第二个 Skill 的独立内容"), "File navigation must remain available while a new file is saving")
    sameSkillSave.resolve()
    await until(() => button("在新会话中实验") && !button("在新会话中实验").disabled, "The delayed same-Skill file save must finish")
    assert(currentId === "local-b" && !textarea() && loadedText().includes("第二个 Skill 的独立内容"), "Finishing a file create must not steal a newer file selection within the same Skill")
    assert((await baseLibrary.get("local-b")).entries.some(entry => entry.path === "未命名-2.md"), "A file created after selecting another file must still be persisted")
    checks.push("Delayed file creation preserves newer file selections within the same Skill")

    for (const path of ["未命名.md", "未命名-2.md", "beta.txt"]) {
      const dialog = await requestDelete(path)
      click(button("确认删除", dialog))
      await until(() => !dialog.isConnected, "Each confirmed file deletion must finish")
    }
    assert((await baseLibrary.get("local-b")).entries.length === 0, "Deleting all files must leave an empty persisted Skill")
    await showFileNavigation()
    assert(fileTree() && visibleFileNav().querySelectorAll('[data-menu-value]').length === 0, "An existing empty Skill must retain its actionable tree")
    await beginFile()
    await until(() => textarea()?.getAttribute("aria-label") === "编辑 未命名.md" && textarea().value === "", "The empty persisted Skill must allow a new focused file without a management page")
    checks.push("Deleting the final saved file retains the same file tree and allows immediate root file creation")

    choose("local-a")
    await until(() => loadedText().includes("实验等待期间的新编辑"), "Returning must retain the existing local source")
    await openFile("payload.bin")
    await until(() => fixture.querySelector('.skill-file-preview')?.getAttribute("aria-label") === "payload.bin 文件内容", "Binary file must open before testing its tree actions")
    assert(!button("编辑"), "Binary files must not expose a text editor")
    await beginRename("payload.bin")
    submitName("payload.bin", "renamed.bin")
    await until(() => !renameInput("payload.bin"), "Binary rename must finish inline")
    await closeFileNavigation()
    await until(() => fixture.querySelector('.skill-file-preview')?.getAttribute("aria-label") === "renamed.bin 文件内容", "Binary file tree operations must remain available while its content is read-only")
    const binaryDialog = await requestDelete("renamed.bin")
    click(button("确认删除", binaryDialog))
    await until(() => !binaryDialog.isConnected, "A binary file must support confirmed deletion")
    assert(!(await baseLibrary.get("local-a")).entries.some(entry => entry.path === "renamed.bin"), "Read-only binary rendering must not disable editable package operations")
    checks.push("Binary content remains read-only while the editable package retains rename and delete actions")

    choose("official")
    await until(() => loadedText().includes("这是固定的官方内容。"), "Official Skill must open directly in reading mode")
    assert(!button("编辑"), "Official files must remain read-only")
    await showFileNavigation()
    const officialTree = fileTree() ?? visibleFileNav()
    const officialBounds = officialTree.getBoundingClientRect()
    flushSync(() => officialTree.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: officialBounds.left + 12, clientY: officialBounds.top + 12 })))
    assert(!menuItem("新建文件") && !menuItem("新建目录") && !menuItem("重命名") && !menuItem("删除") && !officialTree.querySelector('button[data-skill-action]'), "Official Skills must not expose writable context actions or row operation buttons")
    await closeFileNavigation()
    directReading()
    click(button("复制为本地 Skill"))
    await until(() => currentId?.startsWith("copy-") && button("编辑") && !button("编辑").disabled, "A local copy must open its editable document directly")
    const copiedId = currentId
    click(button("编辑")); write("# 本地副本改动"); click(button("保存文件"))
    await until(() => !textarea() && loadedText().includes("本地副本改动"), "Local copy save must return to reading")
    assert(await editedText(copiedId, "SKILL.md") === "# 本地副本改动" && await editedText("official", "SKILL.md") === originals[2].files[0].content, "Editing a local copy must not modify the official release")
    choose(null)
    await until(() => row("巡检技能"), "The catalog must remain reachable")
    click(button(`删除 ${(await baseLibrary.get(copiedId)).name}`))
    failWrites = true
    click(button("确认删除"))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.trim() && button("确认删除") && !button("确认删除").disabled, "Failed deletion must retain confirmation and allow retry")
    assert(await editedText(copiedId, "SKILL.md") === "# 本地副本改动", "Failed deletion must preserve the Skill")
    failWrites = false
    click(button("确认删除"))
    await until(() => !button(`删除 ${(originals[2].name)} 副本`), "Successful deletion must remove the copied Skill")
    assert(!(await baseLibrary.list()).some(skill => skill.id === copiedId), "Deleted Skill must leave the catalog")
    checks.push("Official Skills stay read-only; local copies edit independently; failed deletion preserves content and retries")

    result.dataset.status = "passed"
    result.textContent = `PASS (${checks.length})\n${checks.join("\n")}`
  } catch (error) {
    result.dataset.status = "failed"
    result.textContent = `FAIL after ${checks.length} checks\n${checks.join("\n")}\n${error.stack}`
    console.error(error)
  }
</script>
