<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desktop compact window layout regression</title>
<!-- Run at 820px and 390px wide; ?preview retains the pending browser view. -->
<div id="fixture"></div>
<pre
  id="result"
  style="
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 100;
    max-width: 100%;
    white-space: pre-wrap;
    font-size: 11px;
    background: Canvas;
    color: CanvasText;
  "
>
Running…</pre>
<script type="module">
  import React from "react"
  import { createRoot } from "react-dom/client"
  import { flushSync } from "react-dom"
  import "/src/index.css"
  import { App } from "/src/App.tsx"
  import { createDemoDesktopRuntime } from "/src/adapters/demo/desktop.ts"
  import { createTestDependencies, withTestTheme } from "/tests/support.tsx"

  const fixture = document.querySelector("#fixture")
  const result = document.querySelector("#result")
  const runtime = createDemoDesktopRuntime({ delayMs: 20 })
  const dependencies = createTestDependencies(runtime)
  const workspace = dependencies.workspaces.addWorkspace({
    name: "omniops-bots",
    path: "/demo/omniops-bots",
  })
  const session = dependencies.workspaces.startSession(workspace.id)
  const thread = dependencies.threads.get(session)
  const assert = (value, message) => {
    if (!value) throw new Error(message)
  }
  const until = async (condition, message) => {
    const deadline = performance.now() + 5000
    while (!condition() && performance.now() < deadline)
      await new Promise((resolve) => setTimeout(resolve, 20))
    assert(condition(), message)
  }
  const button = (label) =>
    [...fixture.querySelectorAll("button")].find(
      (node) =>
        node.getAttribute("aria-label") === label ||
        node.textContent.trim() === label
    )
  const click = (label) =>
    flushSync(() => {
      const node = button(label)
      assert(node && !node.disabled, `Missing enabled ${label}`)
      node.click()
    })
  const rail = () => fixture.querySelector("[data-rail-state]")
  const composer = () =>
    fixture.querySelector('[data-slot="chat-composer-anchor"]')
  const approval = () => fixture.querySelector('[data-slot="approval-panel"]')
  const workbench = () => fixture.querySelector('aside[aria-label="工作台"]')
  const checkSidebarResize = async () => {
    const handle = fixture.querySelector('[data-slot="sidebar-resize-handle"]')
    assert(handle, "Expanded desktop navigation must expose a resize handle")
    await until(
      () => Math.abs(rail().getBoundingClientRect().width - 344) < 1.5,
      "Expanded navigation must settle before resizing"
    )
    const beforeWidth = rail().getBoundingClientRect().width
    const before = Number(handle.getAttribute("aria-valuenow"))
    flushSync(() =>
      handle.dispatchEvent(
        new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true })
      )
    )
    assert(
      Number(handle.getAttribute("aria-valuenow")) === before + 16,
      "ArrowRight must widen the navigation"
    )
    await until(
      () =>
        Math.abs(rail().getBoundingClientRect().width - (beforeWidth + 16)) <
        1.5,
      "Resized navigation must update its layout width"
    )
    const railRect = rail().getBoundingClientRect()
    const handleRect = handle.getBoundingClientRect()
    assert(
      Math.abs(handleRect.x + handleRect.width / 2 - railRect.right) < 1,
      "Resize handle must stay on the navigation edge"
    )
    flushSync(() =>
      handle.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }))
    )
    assert(
      Number(handle.getAttribute("aria-valuenow")) === 280,
      "Double-click must restore the default navigation width"
    )
    await until(
      () => Math.abs(rail().getBoundingClientRect().width - 344) < 1.5,
      "Default navigation width must be restored"
    )
  }
  try {
    const root = createRoot(fixture)
    flushSync(() =>
      root.render(withTestTheme(React.createElement(App), dependencies))
    )
    await until(() => composer(), "App did not load")
    const content = fixture.querySelector("main")
    const header = fixture.querySelector("[data-slot='sidebar-rail-workspace-header']")
    if (innerWidth < 768) {
      assert(
        !fixture.querySelector('[data-slot="sidebar-resize-handle"]'),
        "Mobile navigation must not expose a desktop resize handle"
      )
      assert(content.closest("[inert]") && header.closest("[inert]"), "The mobile workbench must hide covered content and header from keyboard input")
      const attachment = button("添加附件")
      attachment.focus()
      assert(workbench().contains(document.activeElement), "Covered chat controls must not steal focus from the mobile workbench")
      assert(fixture.querySelector('a[href^="#"]').hash === `#${workbench().id}`, "Skip navigation must target the visible workbench")
      click("收起工作台")
      await until(() => !content.closest("[inert]"), "Closing the workbench must restore chat interaction")
      const input = fixture.querySelector('[aria-label="消息输入"]')
      input.focus()
      assert(document.activeElement === input, "Chat must regain keyboard access after the overlay closes")
      click("打开工作台")
      assert(workbench().contains(document.activeElement), "Reopening the overlay must move focus into the workbench")
    } else {
      assert(!content.closest("[inert]") && !header.closest("[inert]"), "A side-by-side workbench must keep chat and header interactive")
    }
    if (innerWidth >= 1100) await checkSidebarResize()
    flushSync(() => thread.send("打开浏览器核对发布计划"))
    await until(
      () => approval() && fixture.querySelector('[aria-label="浏览器页面"]'),
      "Browser approval did not appear"
    )
    if (innerWidth >= 768 && innerWidth < 1100) {
      assert(
        composer().getBoundingClientRect().width >= 260,
        `Chat was squeezed to ${composer().getBoundingClientRect().width}px`
      )
      assert(
        rail().dataset.railState === "collapsed",
        "Browser reveal must collapse left navigation"
      )
      click("展开导航")
      await until(
        () => button("打开工作台") && rail().dataset.railState === "expanded",
        "Expanding left navigation must collapse browser"
      )
      await checkSidebarResize()
      click("打开工作台")
      await until(
        () => rail().dataset.railState === "collapsed" && !button("打开工作台"),
        "Opening browser must collapse navigation again"
      )
    }
    if (innerWidth < 1100) {
      const pending = runtime.desktop.getState().task.approval.id
      const returnButton = button("返回审批")
      assert(
        returnButton && returnButton.getClientRects().length,
        "Compact browser must provide a visible return to approval"
      )
      if (!new URLSearchParams(location.search).has("preview")) {
        click("返回审批")
        await until(
          () => workbench().querySelector("[inert]") && approval(),
          "Return must reveal pending approval"
        )
        // The content becomes inert before the sliding panel stops covering chat.
        await until(
          () => workbench().getBoundingClientRect().width === 0,
          "Returning must finish closing the browser panel"
        )
        assert(
          runtime.desktop.getState().task.approval.id === pending,
          "Returning must not stop or decide pending operation"
        )
        const allow = button("允许此操作")
        const bounds = allow.getBoundingClientRect()
        assert(
          bounds.left >= 0 &&
            bounds.right <= innerWidth &&
            bounds.top >= 0 &&
            bounds.bottom <= innerHeight,
          "Approval action must fit the window"
        )
        assert(
          allow.contains(
            document.elementFromPoint(
              bounds.x + bounds.width / 2,
              bounds.y + bounds.height / 2
            )
          ),
          "Approval action must not be covered by browser"
        )
      }
    }
    result.textContent =
      "PASS: compact navigation/browser exclusion, readable chat, pending approval return and unchanged task"
    result.dataset.status = "passed"
  } catch (error) {
    result.textContent = `FAIL: ${error.stack || error}`
    result.dataset.status = "failed"
    console.error(error)
  }
</script>
