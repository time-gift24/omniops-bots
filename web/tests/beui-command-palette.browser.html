<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>beUI command palette business compatibility</title>
<style>#result { white-space: pre-wrap; overflow-wrap: anywhere; }</style>
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { Button } from "/src/components/motion/button.tsx";
  import { MorphicCommandPalette, MorphicCommandPaletteContent } from "/vendor/beui-templates/components/premium/morphic-command-palette/morphic-command-palette.tsx";
  const h = React.createElement;
  const root = createRoot(document.getElementById("fixture"));
  const result = document.getElementById("result");
  const selected = [];
  const items = [
    { id: "first", label: "工作区", group: "页面", icon: h("svg", { "aria-hidden": true, "data-test-icon": true }), onSelect: () => selected.push("first") },
    { id: "second", label: "技能", group: "页面", onSelect: () => selected.push("second") },
    { id: "support", label: "客户支持", group: "Agent · 本地", keywords: ["support-agent"], onSelect: () => selected.push("support") },
  ];
  let original = null;
  function Fixture() {
    const [open, setOpen] = React.useState(false);
    return h(React.Fragment, null,
      h(Button, { id: "opener", onClick: () => setOpen(true) }, "搜索"),
      h(MorphicCommandPalette, { items, open, onOpenChange: setOpen, shortcut: false, onSelect: item => { original = item; } },
        h(MorphicCommandPaletteContent, { title: "搜索导航", description: "搜索可用页面", placeholder: "查找页面…", emptyMessage: "没有找到页面。", clearLabel: "清空搜索", closeLabel: "关闭搜索", footer: false })),
    );
  }
  const wait = () => new Promise(resolve => setTimeout(resolve, 20));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const until = async (condition, message) => {
    const deadline = performance.now() + 5000;
    while (!condition() && performance.now() < deadline) await wait();
    assert(condition(), message);
  };
  const input = () => document.querySelector('[data-slot="command-input"]');
  const options = () => [...document.querySelectorAll('[role="option"]')];
  const key = (key, props = {}) => flushSync(() => input().dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true, ...props })));
  const write = value => flushSync(() => {
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(input(), value);
    input().dispatchEvent(new Event("input", { bubbles: true }));
  });
  try {
    flushSync(() => root.render(h(Fixture)));
    const opener = document.getElementById("opener");
    opener.focus();
    flushSync(() => opener.click());
    await until(() => input() && document.activeElement === input() && options().length === 3, "Open must focus the input and list every command");
    assert(document.querySelector('[data-test-icon]') && document.querySelector('[aria-label="关闭搜索"]'), "Template must preserve custom icons and Chinese controls");
    key("Enter", { isComposing: true });
    key("Enter", { isComposing: false, keyCode: 229 });
    assert(selected.length === 0 && input(), "IME confirmation must not select or close the palette");
    key("ArrowDown", { keyCode: 229 });
    assert(options()[0].getAttribute("aria-selected") === "true", "IME navigation keys must not move the command cursor");
    write("support");
    await until(() => options().length === 1 && options()[0].textContent.includes("客户支持"), "Existing metadata keywords must remain searchable");
    assert(document.querySelector('[data-slot="command-group-heading"]').textContent === "Agent · 本地", "Search must retain the business group label");
    key("Enter");
    await until(() => !input() && document.activeElement === opener, "Selection must close and restore its visible opener");
    assert(selected.join() === "support" && original === items[2], "Selection must call the original business item exactly once");
    flushSync(() => opener.click());
    await until(() => input() && options().length === 3, "Reopening must reset the previous query");
    write("missing-entry");
    await until(() => options().length === 0 && document.body.textContent.includes("没有找到页面。"), "No matches must retain the Chinese empty state");
    flushSync(() => document.querySelector('[aria-label="清空搜索"]').click());
    await until(() => input().value === "" && document.activeElement === input() && options().length === 3, "Clear must reset results and preserve input focus");
    key("End");
    assert(options().at(-1).getAttribute("aria-selected") === "true", "End must reach the final enabled command");
    key("Home");
    assert(options()[0].getAttribute("aria-selected") === "true", "Home must return to the first command");
    key("Escape");
    await until(() => !input(), "Escape must close the palette");
    const shortcut = new KeyboardEvent("keydown", { key: "k", ctrlKey: true, bubbles: true, cancelable: true });
    document.dispatchEvent(shortcut);
    await wait();
    assert(!shortcut.defaultPrevented && !input(), "Disabled template shortcut must leave global shortcut ownership to its caller");
    result.dataset.passed = "true";
    result.textContent = "PASS: IME composition/229, keywords/groups, custom icons, Chinese controls/empty state, original selection, clear/reopen, keyboard navigation, focus and external shortcuts";
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}`;
    throw error;
  } finally { root.unmount(); }
</script>
