<!doctype html>
<meta charset="utf-8" />
<title>Tool step update regression</title>
<!-- Run npm run dev, then open /tests/tool-step-updates.browser.html. -->
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { MessageView } from "/src/components/chat/message-view.tsx";
  import { TooltipProvider } from "/src/components/ui/tooltip.tsx";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const root = createRoot(fixture);
  const h = React.createElement;
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const click = element => { assert(element, "Expected disclosure is missing"); flushSync(() => element.click()); };
  const onRetry = () => {};
  let serializations = 0;
  const output = { toJSON() { serializations += 1; return { result: "original output" }; } };
  let tool = { kind: "tool", callId: "tool-1", name: "searchCode", inputText: "{}", state: "done", output };
  let text = "Live body";
  let state = "streaming";
  const render = () => flushSync(() => root.render(h(TooltipProvider, null, h(MessageView, {
    message: { id: "assistant", role: "assistant", state, parts: [tool, { kind: "text", text }] },
    streaming: state === "streaming", onRetry,
  }))));
  const triggers = () => fixture.querySelectorAll('[data-slot="trace-collapsible-trigger"]');

  try {
    render();
    assert(serializations > 0, "Tool output must render initially");
    assert(triggers()[0].getAttribute("aria-expanded") === "false", "Answered steps must initially be collapsed");
    const initialSerializations = serializations;
    for (let index = 0; index < 5; index++) {
      text += " delta";
      render();
    }
    const extraSerializations = serializations - initialSerializations;
    result.dataset.extraSerializations = String(extraSerializations);
    assert(extraSerializations === 0, `Five body deltas must not serialize unchanged tool output; extra calls: ${extraSerializations}`);
    assert(fixture.textContent.includes(text), "Every body delta must still render");
    click(triggers()[0]);
    click(triggers()[1]);
    assert(fixture.textContent.includes("original output"), "Tool details must remain expandable");

    tool = { ...tool, output: { result: "replacement output" } };
    render();
    assert(fixture.textContent.includes("replacement output") && !fixture.textContent.includes("original output"), "A changed tool output must update open details");
    tool = { ...tool, state: "error", errorText: "Tool failure details" };
    render();
    assert(fixture.textContent.includes("搜索代码失败") && fixture.textContent.includes("Tool failure details"), "Tool errors must update the title and details");

    tool = { ...tool, state: "running", output: undefined, errorText: undefined };
    render();
    assert(fixture.querySelector('.beui-ai-loader[data-variant="scan"]'), "Running tool must show activity");
    state = "stopped";
    render();
    assert(!fixture.querySelector('.beui-ai-loader[data-variant="scan"]') && fixture.textContent.includes("已停止搜索代码"), "Stopping must update an unchanged tool part and remove activity");
    state = "failed";
    render();
    assert(fixture.textContent.includes("搜索代码中断"), "Message failure must update an unchanged tool part");
    tool = { ...tool, state: "done", output: "Completed output" };
    state = "done";
    render();
    click(triggers()[1]);
    assert(fixture.textContent.includes("已搜索代码") && fixture.textContent.includes("Completed output"), "Completed tools must remain expandable after status changes");
    result.dataset.passed = "true";
    result.textContent = "PASS: five body deltas / zero extra tool serializations; output, error, running, stop, failure and completion updates";
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}`;
    throw error;
  } finally {
    root.unmount();
  }
</script>
