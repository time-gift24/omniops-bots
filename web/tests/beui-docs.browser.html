<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shared beUI docs regression</title>
<!-- Run npm run dev, then open /tests/beui-docs.browser.html. -->
<style>
  html { scroll-behavior: auto !important; }
  body { margin: 0; }
  #result { white-space: pre-wrap; }
  .spy-section { min-height: 120vh; padding: 24px; }
</style>
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { Button } from "/src/components/beui/motion/button.tsx";
  import { useScrollspy } from "/src/components/beui/premium/docs-pages/use-scrollspy.ts";
  import { DocsMobileNav } from "/src/components/beui/premium/docs-pages/docs-mobile-nav.tsx";
  import { docsSectionId } from "/src/components/beui/premium/docs-pages/docs-data.ts";

  const h = React.createElement;
  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const root = createRoot(fixture);
  const ids = ["first", "middle", "last"];
  const wait = () => new Promise(resolve => setTimeout(resolve, 20));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const until = async (condition, message) => {
    const deadline = performance.now() + 5000;
    while (!condition() && performance.now() < deadline) await wait();
    assert(condition(), message);
  };
  const render = element => flushSync(() => root.render(element));
  const click = element => {
    assert(element, "Expected control is missing");
    flushSync(() => element.click());
  };
  const dialog = () => document.querySelector('[role="dialog"]');
  const escape = () => flushSync(() => document.activeElement.dispatchEvent(
    new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }),
  ));

  function ScrollFixture({ tracked }) {
    const active = useScrollspy(tracked);
    return h(React.Fragment, null,
      h("output", { id: "active-heading", style: { position: "fixed", top: 0, right: 0 } }, active ?? ""),
      ...ids.map(id => h("section", { key: id, className: "spy-section" },
        h("h2", { id: docsSectionId(id) }, id))),
    );
  }

  const groups = [{ title: "Fixture pages", items: [
    { id: "first", label: "First page" }, { id: "last", label: "Last page" },
  ] }];
  function MobileFixture({ custom }) {
    const [open, setOpen] = React.useState(false);
    const [active, setActive] = React.useState("first");
    const navProps = custom ? {
      nav: h("nav", { "aria-label": "Custom docs navigation" },
        h(Button, { id: "custom-nav-action", onClick: () => setActive("custom") }, "Custom page")),
      closeIcon: h("span", { id: "custom-close-icon", "aria-hidden": true }, "×"),
      panelClassName: "docs-custom-panel rounded-md",
    } : { groups, activePage: active, onSelect: setActive };
    return h(React.Fragment, null,
      h(Button, { id: "docs-opener", onClick: () => setOpen(true) }, "Browse docs"),
      h("output", { id: "selected-page" }, active),
      h(DocsMobileNav, {
        open, onOpenChange: setOpen, title: "Fixture docs", closeLabel: "Close docs", ...navProps,
      }),
    );
  }

  async function openNav() {
    const opener = fixture.querySelector("#docs-opener");
    opener.focus();
    click(opener);
    await until(() => dialog()?.querySelector('button[aria-label="Close docs"]'), "Docs navigation must open");
    await until(() => dialog()?.contains(document.activeElement), "Docs navigation must own focus while open");
    const title = document.getElementById(dialog().getAttribute("aria-labelledby"));
    assert(title?.textContent === "Fixture docs", "Docs navigation must retain its accessible title");
    return opener;
  }

  async function closed(opener) {
    await until(() => !dialog(), "Docs navigation must finish closing");
    await until(() => document.activeElement === opener, "Closing docs navigation must restore its opener focus");
  }

  try {
    render(h(ScrollFixture, { tracked: ids }));
    window.scrollTo(0, 0);
    await until(() => fixture.querySelector("#active-heading").textContent === "first", "Default window scrollspy must start at the first heading");
    window.scrollTo(0, document.documentElement.scrollHeight);
    await until(() => window.scrollY > 0 && fixture.querySelector("#active-heading").textContent === "last", "Default window scrollspy must select the last heading at the page end");
    window.scrollTo(0, 0);
    await until(() => fixture.querySelector("#active-heading").textContent === "first", "Scrolling back to the top must restore the first heading");
    render(h(ScrollFixture, { tracked: [] }));
    assert(fixture.querySelector("#active-heading").textContent === "", "An empty heading list must clear the previous active heading");
    window.scrollTo(0, document.documentElement.scrollHeight);
    await wait();
    assert(fixture.querySelector("#active-heading").textContent === "", "Scrolling after ids become empty must not restore a stale heading");

    render(h(MobileFixture, { key: "default", custom: false }));
    window.scrollTo(0, 0);
    let opener = await openNav();
    const nav = dialog().querySelector('nav[aria-label="Documentation"]');
    assert(nav && nav.querySelector('a[aria-current="page"]').textContent === "First page", "Default DocsNav props must render the active page");
    assert(dialog().querySelector('button[aria-label="Close docs"] svg'), "Default DocsMobileNav must retain its close icon");
    click([...nav.querySelectorAll("a")].find(link => link.textContent === "Last page"));
    assert(fixture.querySelector("#selected-page").textContent === "last", "Default DocsNav must forward page selection");
    escape();
    await closed(opener);

    render(h(MobileFixture, { key: "custom", custom: true }));
    opener = await openNav();
    assert(dialog().querySelector('nav[aria-label="Custom docs navigation"]') && !dialog().querySelector('nav[aria-label="Documentation"]'), "Custom navigation must replace the default DocsNav");
    assert(dialog().querySelector(".docs-custom-panel #custom-close-icon"), "Custom panel classes and close icon must reach the modal");
    click(dialog().querySelector("#custom-nav-action"));
    assert(fixture.querySelector("#selected-page").textContent === "custom", "Custom navigation actions must remain usable");
    click(dialog().querySelector('button[aria-label="Close docs"]'));
    await closed(opener);
    opener = await openNav();
    escape();
    await closed(opener);

    result.dataset.passed = "true";
    result.textContent = "PASS: window scrollspy first/last/empty ids; default and custom DocsMobileNav selection, close icon, panel classes, Escape and focus restoration";
  } catch (error) {
    result.dataset.passed = "false";
    result.textContent = `FAIL: ${error.message}`;
    throw error;
  } finally {
    root.unmount();
    window.scrollTo(0, 0);
  }
</script>
