<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Client concurrency settings regression</title>
<div id="fixture"></div>
<pre id="result" style="max-width: 100%; white-space: pre-wrap; font-size: 11px">Running…</pre>
<script type="module">
  import React from "react"
  import { createRoot } from "react-dom/client"
  import { flushSync } from "react-dom"
  import "/src/index.css"
  import { App } from "/src/App.tsx"
  import { createTauriRuntime } from "/src/adapters/tauri/runtime.ts"
  import { createTestDependencies, withTestTheme } from "/tests/support.tsx"

  const fixture = document.querySelector("#fixture"), result = document.querySelector("#result")
  const viewport = new URLSearchParams(location.search).get("viewport"), mobile = viewport === "mobile"
  const assert = (condition, message) => { if (!condition) throw new Error(message) }
  const until = async (condition, message, timeout = 8000) => {
    const deadline = performance.now() + timeout
    while (!condition() && performance.now() < deadline) await new Promise(resolve => setTimeout(resolve, 20))
    assert(condition(), message)
  }
  const visible = element => element && element.getClientRects().length > 0 && !element.closest('[inert], [hidden], [aria-hidden="true"]')
  const button = (name, scope = document) => [...scope.querySelectorAll("button")].find(element => visible(element) && (element.getAttribute("aria-label") === name || element.textContent.trim() === name))
  const click = element => { assert(visible(element) && !element.disabled, "Expected enabled visible control"); flushSync(() => element.click()) }
  const field = () => fixture.querySelector('input[type="number"]')
  const setValue = value => flushSync(() => {
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(field(), value)
    field().dispatchEvent(new Event("input", { bubbles: true }))
  })
  const drawer = () => document.querySelector('[data-mobile="true"]')
  const closeNavigation = async () => {
    if (mobile && drawer()?.getAttribute("aria-hidden") === "false") {
      click(button("Close sidebar"))
      await until(() => drawer()?.getAttribute("aria-hidden") === "true", "Mobile navigation did not close")
    }
  }
  const openSettings = async () => {
    await closeNavigation()
    click(button("设置", fixture.querySelector('nav[aria-label="工作区导航区域"]')))
    await until(() => button("偏好设置", mobile ? drawer() : fixture.querySelector('[data-slot="sidebar"]')), "Preferences item must be reachable")
    click(button("偏好设置", mobile ? drawer() : fixture.querySelector('[data-slot="sidebar"]')))
    await closeNavigation()
    await until(() => fixture.querySelector('[data-slot="client-settings"]'), "Preferences page must open")
  }
  try {
    if (!viewport) {
      for (const [name, width] of [["desktop", 1440], ["mobile", 390]]) {
        const frame = document.createElement("iframe")
        frame.title = `${name} client settings regression`
        frame.width = width; frame.height = 844
        frame.src = `${location.pathname}?viewport=${name}`
        fixture.append(frame)
        await until(() => frame.contentDocument?.querySelector("#result")?.dataset.passed, `${name} settings did not finish`, 45000)
        const child = frame.contentDocument.querySelector("#result")
        assert(child.dataset.passed === "true", child.textContent)
      }
    } else {
      let saved = 4, failRead = false, firstRead = true, listener
      const initialRead = Promise.withResolvers(), pendingSave = Promise.withResolvers(), saves = [], calls = []
      const empty = { simulated: false, tasks: [], task: null, browserThreadId: null, browserRequest: 0, browser: { url: "", title: "", status: "empty", canGoBack: false, canGoForward: false } }
      const bridge = {
        async listen(_event, handler) { listener = handler; return () => { listener = undefined } },
        async invoke(command, args) {
          calls.push([command, args])
          if (command !== "runtime_request") return null
          if (args.method === "status") return empty
          if (args.method === "settings_get") {
            if (failRead) throw new Error("read failed")
            if (firstRead) return initialRead.promise
            return { maxConcurrentRuns: saved }
          }
          if (args.method === "settings_save") {
            saves.push(args.params.settings.maxConcurrentRuns)
            if (saves.length === 1) await pendingSave.promise
            saved = args.params.settings.maxConcurrentRuns
            return { maxConcurrentRuns: saved }
          }
          return {}
        },
      }
      const runtime = createTauriRuntime(bridge)
      await runtime.initialize()
      const dependencies = createTestDependencies({ desktop: runtime.desktop })
      const root = createRoot(fixture)
      flushSync(() => root.render(React.createElement(React.StrictMode, null, withTestTheme(React.createElement(App), dependencies))))
      await until(() => button("设置"), "Settings rail item must exist")
      await openSettings()
      assert(!field() && fixture.textContent.includes("正在读取客户端设置"), "Loading must not present a fabricated default")
      firstRead = false
      initialRead.resolve({ maxConcurrentRuns: 4 })
      await until(() => field()?.value === "4", "Default limit must be four")
      const breadcrumb = [...fixture.querySelectorAll('nav[aria-label="面包屑"]')].find(visible)
      assert(breadcrumb?.textContent.includes("设置") && breadcrumb?.querySelector('[aria-current="page"] > span:last-child')?.textContent === "偏好设置", "Settings must use the shared breadcrumb")
      assert(field().labels[0]?.textContent === "并发任务上限", "Input needs an accessible visible label")
      for (const invalid of ["", "0", "65", "1.5"]) {
        setValue(invalid)
        assert(field().getAttribute("aria-invalid") === "true" && button("保存设置").disabled, `Reject invalid limit ${invalid}`)
      }
      setValue("8")
      click(button("保存设置"))
      flushSync(() => fixture.querySelector("form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true })))
      await until(() => saves.length === 1, "Save must reach the desktop adapter")
      assert(field().disabled && button("正在保存…").disabled && saves.length === 1, "Pending save must prevent duplicate submissions")
      pendingSave.reject(new Error("disk full"))
      await until(() => fixture.textContent.includes("设置保存失败"), "Save error must show recovery")
      assert(field().value === "8" && fixture.textContent.includes("当前生效上限：4") && saved === 4, "Failed save must retain draft and previous saved value")
      click(button("保存设置"))
      await until(() => saved === 8 && fixture.textContent.includes("设置已保存"), "Successful save must confirm the applied value")
      await closeNavigation()
      click(button("工作区", fixture.querySelector('nav[aria-label="工作区导航区域"]')))
      failRead = true
      await openSettings()
      await until(() => button("重试", fixture.querySelector('[data-slot="client-settings"]')), "Read failure must be retryable")
      assert(!field() && saved === 8, "Read failure must not reset the saved limit")
      failRead = false
      click(button("重试", fixture.querySelector('[data-slot="client-settings"]')))
      await until(() => field()?.value === "8", "Reopening and retrying must read the saved value")
      const tasks = ["a", "b"].map(threadId => ({ threadId, runId: `run-${threadId}`, title: `任务 ${threadId}`, phase: "running" }))
      flushSync(() => listener({ event: "desktop_state", state: { ...empty, tasks } }))
      setValue("1")
      click(button("保存设置"))
      await until(() => saved === 1 && fixture.textContent.includes("设置已保存"), "Active runs must not block changing the limit")
      assert(runtime.desktop.getState().tasks.length === 2 && !calls.some(([, args]) => args?.method === "stop"), "Lowering must preserve existing runs")
      const bounds = field().getBoundingClientRect(), form = fixture.querySelector("form").getBoundingClientRect()
      assert(bounds.left >= 0 && bounds.right <= innerWidth && form.right <= innerWidth + 1, "Settings must fit the viewport")
      assert(fixture.textContent.includes("调低上限不会停止正在执行的任务"), "Application timing must be explained")
    }
    result.textContent = `PASS ${viewport ?? "desktop + 390px"}: loading, default 4, validation, duplicate save guard, failed save retains draft/value, save, reopen, read retry, active-run lowering, settings navigation and breadcrumb`
    result.dataset.passed = "true"
  } catch (error) {
    result.textContent = `FAIL ${viewport ?? "all"}: ${error.stack}`
    result.dataset.passed = "false"
    throw error
  }
</script>
