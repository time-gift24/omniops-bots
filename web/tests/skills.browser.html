<!doctype html>
<meta charset="utf-8" />
<title>Skill reading and draft regression check</title>
<!-- Run npm run dev, then open /tests/skills.browser.html at desktop or mobile width. -->
<div id="fixture" style="height: 800px; max-height: 100dvh"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react"
  import { createRoot } from "react-dom/client"
  import { flushSync } from "react-dom"
  import "/src/index.css"
  import { SkillScreen } from "/src/components/skills/skill-screen.tsx"
  import { DEMO_SKILLS } from "/src/adapters/demo/skills.ts"
  import { fileKey } from "/src/skills/drafts.ts"
  import { createTestDependencies, withDependencies } from "/tests/support.tsx"

  const fixture = document.querySelector("#fixture")
  const result = document.querySelector("#result")
  const root = createRoot(fixture)
  const values = new Map()
  const checks = []
  let failWrites = false
  let failReads = false
  let failRemoves = false
  let loadGate
  let saveGate
  let removeGate
  const skillDrafts = {
    async load() {
      if (loadGate) await loadGate.promise
      if (failReads) throw new Error("read denied")
      return Object.fromEntries(values)
    },
    async save(skillId, path, value) {
      if (saveGate) await saveGate.promise
      if (failWrites) throw new Error("write denied")
      values.set(fileKey(skillId, path), value)
    },
    async remove(skillId, path) {
      if (removeGate) await removeGate.promise
      if (failRemoves) throw new Error("remove denied")
      values.delete(fileKey(skillId, path))
    },
  }
  const dependencies = createTestDependencies({ skillDrafts })
  const assert = (condition, message) => {
    if (!condition) throw new Error(message)
  }
  const wait = (ms = 20) => new Promise((resolve) => setTimeout(resolve, ms))
  const until = async (condition, message, timeout = 5000) => {
    const deadline = performance.now() + timeout
    while (!condition() && performance.now() < deadline) await wait()
    assert(condition(), message)
  }
  const visible = (element) =>
    element &&
    element.getClientRects().length > 0 &&
    !element.closest('[inert], [aria-hidden="true"]')
  const button = (name, scope = document) =>
    [...scope.querySelectorAll("button")].find(
      (element) =>
        visible(element) &&
        (element.getAttribute("aria-label") ?? element.textContent).trim() ===
          name
    )
  const link = (name, scope = document) =>
    [...scope.querySelectorAll("a")].find(
      (element) =>
        visible(element) &&
        (element.getAttribute("aria-label") ?? element.textContent)
          .trim()
          .replace(/\s*未保存$/, "") === name
    )
  const editor = path => fixture.querySelector(`textarea[aria-label="编辑 ${path}"]`)
  const click = (element) => {
    assert(
      visible(element) && !element.disabled,
      "Expected an enabled, visible control"
    )
    flushSync(() => {
      element.focus()
      element.getAttribute("role") === "tab" ? element.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true })) : element.click()
    })
  }
  const write = (path, value) =>
    flushSync(() => {
      const input = editor(path)
      assert(input, `Missing editor for ${path}`)
      Object.getOwnPropertyDescriptor(
        HTMLTextAreaElement.prototype,
        "value"
      ).set.call(input, value)
      input.dispatchEvent(new Event("input", { bubbles: true }))
    })
  const saveShortcut = () =>
    flushSync(() =>
      window.dispatchEvent(
        new KeyboardEvent("keydown", {
          key: "s",
          ctrlKey: true,
          bubbles: true,
          cancelable: true,
        })
      )
    )
  const saved = () =>
    [...fixture.querySelectorAll('[role="status"]')]
      .some(element => element.textContent.includes("草稿已保存"))
  const content = () => fixture.querySelector('[aria-label="文件内容"]')
  const header = () => fixture.querySelector("header")
  const checkHeader = () => {
    assert(!header().querySelector("button"), "The shared Header must contain location only")
    assert(fixture.querySelector('[data-slot="editor-actions"]'), "Labeled actions must remain in the document")
  }
  const fileLink = (path) =>
    [...document.querySelectorAll('nav[aria-label="技能文件"]')]
      .map((nav) =>
        [...nav.querySelectorAll("button")].find(
          (element) =>
            visible(element) &&
            element.textContent.trim().replace(/\s*未保存$/, "") ===
              path.split("/").at(-1)
        )
      )
      .find(Boolean)
  const selectFile = async (path) => {
    if (!fileLink(path)) {
      click(button("浏览技能文件"))
      await until(
        () => fileLink(path),
        `File navigation did not expose ${path}`
      )
    }
    click(fileLink(path))
    await until(
      () => !button("关闭文件导航"),
      "File selection must close mobile navigation"
    )
  }
  const startEditing = async path => {
    await until(() => editor(path), "Markdown must be directly editable after loading")
    checkHeader()
  }
  function Probe() {
    const skillId = "weekly-report"
    return React.createElement("div", { className: "flex h-full min-h-0 flex-col" },
      React.createElement("header", { className: "@container/skill-header flex h-12 shrink-0 items-center gap-2 px-4" },
        React.createElement("span", { className: "min-w-0 flex-1 truncate" }, "周报助手")),
      React.createElement("div", { className: "min-h-0 flex-1" },
        React.createElement(SkillScreen, {
          skillId,
          skills: DEMO_SKILLS,
          active: true,
        })))
  }
  const render = (key) =>
    flushSync(() => root.render(withDependencies(React.createElement(Probe, { key }), dependencies)))
  const original = DEMO_SKILLS.find((skill) => skill.id === "weekly-report")
  const skillSource = original.files.find(
    (file) => file.path === "SKILL.md"
  ).content
  const scriptSource = original.files.find(
    (file) => file.path === "scripts/ss.js"
  ).content

  try {
    render("initial")
    await startEditing("SKILL.md")
    assert(editor("SKILL.md").value === skillSource, "Original Markdown including YAML must be intact")
    click(button("预览"))
    assert(fixture.querySelector(".markdown-preview h1")?.textContent === "周报助手", "Preview must render the body")
    assert([...fixture.querySelectorAll("summary")].some(node => node.textContent === "元数据" && !node.parentElement.open), "Preview metadata must be available without changing the source")
    click(button("编写"))
    write("SKILL.md", "未保存的主文件")
    await selectFile("reference/template.md")
    await startEditing("reference/template.md")
    write("reference/template.md", "另一个文件的草稿")
    await selectFile("SKILL.md")
    assert(editor("SKILL.md").value === "未保存的主文件", "Switching files must preserve independent drafts")
    click(button("撤销修改"))
    assert(editor("SKILL.md").value === skillSource, "Undo must restore the saved baseline")
    write("SKILL.md", "保存失败时的原文")
    failWrites = true; click(button("保存草稿"))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("草稿保存失败"), "Failure must be visible")
    assert(editor("SKILL.md").value === "保存失败时的原文", "A failed save must retain source")
    failWrites = false
    saveGate = Promise.withResolvers(); write("SKILL.md", "提交快照"); saveShortcut()
    write("SKILL.md", "保存期间的新输入")
    assert(button("保存草稿").disabled, "Duplicate saves must be blocked")
    saveGate.resolve(); saveGate = undefined
    await until(() => !button("保存草稿").hasAttribute("aria-busy"), "Save must settle")
    assert(values.get(fileKey("weekly-report", "SKILL.md")) === "提交快照" && editor("SKILL.md").value === "保存期间的新输入", "The save snapshot must not replace new typing")
    saveShortcut()
    await until(() => values.get(fileKey("weekly-report", "SKILL.md")) === "保存期间的新输入", "A second save must persist the latest source")
    write("SKILL.md", ""); saveShortcut()
    await until(() => values.get(fileKey("weekly-report", "SKILL.md")) === "", "Empty Markdown must be saveable")
    render("empty-restored"); await startEditing("SKILL.md")
    assert(editor("SKILL.md").value === "", "An empty draft must not fall back to the original")
    failRemoves = true; click(button("恢复原文"))
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("未能移除"), "Restore failure must be recoverable")
    assert(editor("SKILL.md").value === "" && values.has(fileKey("weekly-report", "SKILL.md")), "Failed restore must retain the draft")
    failRemoves = false; click(button("恢复原文"))
    await until(() => editor("SKILL.md").value === skillSource && !values.has(fileKey("weekly-report", "SKILL.md")), "Restore must remove only the draft overlay")
    checks.push("Source, preview, file drafts, undo, save snapshots, empty drafts and retryable restore")
    await selectFile("scripts/ss.js"); await startEditing("scripts/ss.js")
    assert(editor("scripts/ss.js").value === scriptSource && !button("预览"), "Scripts must remain exact source without Markdown formatting")
    await selectFile("SKILL.md"); click(button("预览"))
    await until(() => [...fixture.querySelectorAll(".markdown-preview a")].some(node => node.textContent === "指标口径"), "Preview must finish rendering links")
    const target = [...fixture.querySelectorAll(".markdown-preview a")].find(node => node.textContent === "指标口径")
    click(target)
    await until(() => fixture.querySelector(".markdown-preview h1")?.textContent === "指标口径", "Relative links must open the target document preview")
    checks.push("Script editing and relative Markdown links")
    loadGate = Promise.withResolvers(); values.set(fileKey("weekly-report", "SKILL.md"), "延迟草稿")
    render("abandoned"); assert(!editor("SKILL.md"), "Editor must wait for draft loading")
    render("live"); loadGate.resolve(); loadGate = undefined
    await startEditing("SKILL.md")
    assert(editor("SKILL.md").value === "延迟草稿", "Only the current screen may apply a delayed load")
    failReads = true; render("read-failure")
    await until(() => fixture.querySelector('[role="alert"]')?.textContent.includes("无法读取"), "Read failure must not look like an empty cache")
    await startEditing("SKILL.md"); write("SKILL.md", "读取失败后仍可编辑")
    assert(editor("SKILL.md").value === "读取失败后仍可编辑", "A read failure must permit further editing")
    checks.push("Loading gates, abandoned requests and safe read failure")

    result.textContent = `PASS: ${checks.join("; ")}`
    result.dataset.passed = "true"
  } catch (error) {
    result.textContent = `FAIL: ${error.stack}`
    result.dataset.passed = "false"
    throw error
  } finally {
    if (result.dataset.passed === "true") flushSync(() => root.unmount())
  }
</script>
