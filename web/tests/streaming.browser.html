<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognacta Arc streaming regression</title>
<div id="fixture" style="height:700px;max-width:900px"></div><pre id="result">Running…</pre>
<script type="module">
import React from "react";import {createRoot} from "react-dom/client";import {flushSync} from "react-dom";
import "/src/index.css";import {ChatScreen} from "/src/components/chat/chat-screen.tsx";import {DEMO_MODELS} from "/src/adapters/demo/resources.ts";
import {createTestDependencies,withDependencies} from "/tests/support.tsx";import styles from "/src/components/arc/blocks/ai-chat/chat.module.css";
const fixture=document.querySelector("#fixture"),result=document.querySelector("#result"),root=createRoot(fixture),h=React.createElement;
const assert=(v,m)=>{if(!v)throw Error(m)},wait=(ms=20)=>new Promise(r=>setTimeout(r,ms)),until=async(f,m)=>{const end=performance.now()+10000;while(!f()&&performance.now()<end)await wait();assert(f(),m)};
const metadata={providerName:"fixture",protocolName:"fixture",requestedModel:"pine-1"};let requests=0,aborts=0;const copied=[];
const reasoning=Promise.withResolvers(),tool=Promise.withResolvers(),text=Promise.withResolvers(),cancel=Promise.withResolvers();
const body="中文正文 👩🏽‍💻 第一段。\n\n```ts\nconst result = 42\n```\n\n最后一段。";
const complete=parts=>({type:"completed",response:{assistant:{parts},finish:{reason:"stop"},metadata,usage:{}}});
const dependencies=createTestDependencies({host:{async copyText(text){copied.push(text)},async openExternal(){},async confirm(){return true}},gatewayFor:()=>({
async *stream(){requests++;yield{type:"started",metadata};
if(requests===1){yield{type:"part-started",partId:0,kind:"reasoning"};yield{type:"delta",partId:0,text:"正在检查工作区资料"};await reasoning.promise;
yield{type:"part-completed",partId:0,content:{type:"reasoning",text:"正在检查工作区资料"}};yield{type:"part-started",partId:1,kind:"tool-call",name:"search_workspace"};yield{type:"delta",partId:1,text:'{"query":"资料"}'};await tool.promise;
yield{type:"part-completed",partId:1,content:{type:"tool-call",call:{callId:"tool",name:"search_workspace",inputText:'{"query":"资料"}',output:"已找到资料"}}};yield{type:"part-started",partId:2,kind:"text"};yield{type:"delta",partId:2,text:body};await text.promise;
yield complete([{type:"reasoning",text:"正在检查工作区资料"},{type:"tool-call",call:{callId:"tool",name:"search_workspace",inputText:'{"query":"资料"}',output:"已找到资料"}},{type:"text",text:body}]);
}else if(requests===2){yield{type:"part-started",partId:0,kind:"text"};yield{type:"delta",partId:0,text:"取消前保留的文本"};await cancel.promise;
}else if(requests===3){yield{type:"failed",error:{kind:"transport",message:"连接失败，请重试"}};
}else{yield complete([{type:"text",text:"重试成功"}])}},abort(){aborts++;cancel.resolve()}})});
const store=dependencies.threads.get("cognacta-flow"),editor=()=>fixture.querySelector('[role="textbox"]');
const label=n=>{if(n.getAttribute("aria-label"))return n.getAttribute("aria-label");const copy=n.cloneNode(true);copy.querySelectorAll('[aria-hidden="true"]').forEach(n=>n.remove());return copy.textContent.trim()};
const button=name=>[...fixture.querySelectorAll("button")].find(n=>label(n)===name),click=n=>{assert(n&&!n.disabled,"Action must be enabled");flushSync(()=>n.click())};
const render=()=>flushSync(()=>root.render(withDependencies(h(ChatScreen,{threadId:"cognacta-flow",models:DEMO_MODELS}),dependencies)));
const type=value=>flushSync(()=>{editor().textContent=value;editor().dispatchEvent(new InputEvent("input",{bubbles:true,inputType:"insertText",data:value}))});
try{
render();type("检查资料");click(button("发送"));await until(()=>fixture.textContent.includes("正在思考"),"Arc thinking header must render");assert(requests===1,"Initial submission creates one backend request");
type("下一条草稿");reasoning.resolve();await until(()=>fixture.textContent.includes("search_workspace"),"Arc tool chip must use backend tool identity");tool.resolve();
await until(()=>fixture.textContent.includes("中文正文"),"Chinese deltas must be visible before the terminal event");assert(fixture.querySelector(`.${styles.chunk}`)||matchMedia('(prefers-reduced-motion: reduce)').matches,"Arc chunk animation is used for streamed content");
assert(!fixture.querySelector('[data-streamdown]'),"Conversation uses Cognacta's renderer");
flushSync(()=>root.render(null));text.resolve();await until(()=>store.getState().status==="idle","Unmounting presentation must not abort backend consumption");assert(aborts===0,"Page changes must not invoke stop");render();await until(()=>fixture.textContent.includes("最后一段。"),"Historical final text must render completely");assert(editor().textContent==="下一条草稿","Draft survives completion and remount");assert(fixture.querySelector("pre")?.textContent.includes("const result = 42"),"Cognacta code fence is preserved");
click(button("查看思考"));await until(()=>fixture.textContent.includes("正在检查工作区资料"),"Arc reasoning fold remains interactive");click([...fixture.querySelectorAll("button")].find(n=>n.textContent.includes("search_workspace")));await until(()=>fixture.textContent.includes("已找到资料"),"Arc tool detail shows completed output");
const copy=[...fixture.querySelectorAll('button[aria-label="复制"]')].at(-1);click(copy);await until(()=>copied.length,"Copy reaches the injected host");assert(copied.at(-1).includes("中文正文")&&copied.at(-1).includes("最后一段"),"Copy contains the complete reply");
assert(store.send("第二轮",undefined,"pine-1"),"Next explicit run accepted");await until(()=>fixture.textContent.includes("取消前保留的文本"),"New stream updates the actual Arc reply");click(button("停止响应"));await until(()=>store.getState().messages.at(-1).state==="stopped","Stop uses the existing lifecycle");assert(fixture.textContent.includes("取消前保留的文本"),"Stop retains partial text");assert(aborts===1&&requests===2,"Stopping never retries");
assert(store.send("失败请求",undefined,"pine-1"),"Failure fixture accepted");await until(()=>fixture.textContent.includes("连接失败，请重试"),"Backend failure renders Arc error state");await wait(100);assert(requests===3,"Failure does not retry automatically");const retry=[...fixture.querySelectorAll("button")].filter(n=>label(n)==="重新生成").at(-1);click(retry);await until(()=>fixture.textContent.includes("重试成功"),"Only explicit retry starts a new request");assert(requests===4,"Explicit retry starts once");
result.textContent="PASS: Cognacta input and Arc streaming, Chinese/emoji chunks, reasoning, tools, code, host copy, background completion, drafts, cancellation and explicit retry";
}catch(error){result.textContent=`FAIL\n${error.stack}`;console.error(error)}
</script>
