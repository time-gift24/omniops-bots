<!doctype html>
<meta charset="utf-8" />
<title>Streaming interaction regression check</title>
<!-- Run npm run dev, then open /tests/streaming.browser.html (also ?reduced=1). -->
<style>body { padding: 24px; } #fixture { max-width: 720px; } #result { white-space: pre-wrap; margin-top: 24px; }</style>
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { createTestDependencies, withDependencies } from "/tests/support.tsx";
  import { createBrowserHost } from "/src/adapters/browser-host.ts";
  import { ChainOfThought } from "/src/components/chat/chain-of-thought.tsx";
  import { ChatThread } from "/src/components/chat/chat-thread.tsx";
  import { MessageView } from "/src/components/chat/message-view.tsx";
  import { CodeBlockCopyButton } from "/src/components/ui/code-block.tsx";
  import { TooltipProvider } from "/src/components/ui/tooltip.tsx";
  import { createMockGateway } from "/src/adapters/demo/chat.ts";
  import { createThreadState, foldChatEvent } from "/src/chat/fold.ts";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const root = createRoot(fixture);
  const h = React.createElement;
  const wait = (ms = 0) => new Promise(resolve => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const dependencies = createTestDependencies({ host: createBrowserHost() });
  const render = (component, props) => {
    flushSync(() => root.render(withDependencies(h(TooltipProvider, null, h(component, props)), dependencies)));
    if (reduced) activateReducedMotion();
  };
  const click = element => flushSync(() => element.click());
  const passed = [];
  const reduced = new URLSearchParams(location.search).has("reduced");
  // Activate the actual emitted CSS branch on this fixture only; no OS settings change.
  function activateReducedMotion() {
    const activate = rules => {
      for (const rule of rules) {
        if (rule instanceof CSSMediaRule && rule.conditionText.includes("prefers-reduced-motion: reduce")) {
          rule.media.mediaText = "all";
        }
        if (rule instanceof CSSMediaRule && rule.conditionText.includes("prefers-reduced-motion: no-preference")) {
          rule.media.mediaText = "not all";
        }
        if (rule.cssRules) activate(rule.cssRules);
      }
    };
    for (const sheet of document.styleSheets) activate(sheet.cssRules);
  }
  if (reduced) activateReducedMotion();
  const clipboardDescriptor = Object.getOwnPropertyDescriptor(navigator, "clipboard");
  const clipboard = value => Object.defineProperty(navigator, "clipboard", { configurable: true, value });

  try {
    let state = { threadId: "loader", status: "streaming", messages: [
      { id: "a", role: "assistant", state: "streaming", parts: [] },
    ] };
    const listeners = new Set();
    const store = {
      getState: () => state,
      subscribe: listener => { listeners.add(listener); return () => listeners.delete(listener); },
      retry() {}, send() {},
    };
    render(ChatThread, { store });
    const waitingLoader = fixture.querySelector('.beui-ai-loader[data-variant="diamond"]');
    assert(waitingLoader, "Waiting must show loader");
    state = { ...state, messages: [{ ...state.messages[0], parts: [{ kind: "reasoning", text: "检查缓存", state: "running" }] }] };
    flushSync(() => listeners.forEach(listener => listener()));
    if (reduced) activateReducedMotion();
    if (reduced) {
      const exiting = fixture.querySelector(".chat-swap-out");
      assert(!exiting || getComputedStyle(exiting).display === "none", "Reduced motion must immediately hide exiting loader");
    }
    await wait(260);
    assert(!waitingLoader.isConnected, "Waiting loader must leave after first content");
    const orbit = fixture.querySelector('.beui-ai-loader[data-variant="orbit"]');
    assert(orbit?.querySelectorAll("rect").length === 12, "Running group must keep the 12-pixel orbit");
    assert(!orbit.querySelector("span"), "Step icon must not duplicate its status label");
    assert(getComputedStyle(orbit.querySelector("svg")).width === "16px", "Orbit must fit the step icon slot");
    assert(getComputedStyle(orbit.querySelector("rect")).animationName === (reduced || matchMedia("(prefers-reduced-motion: reduce)").matches ? "none" : "beui-ai-pixel"), "Orbit must respect reduced motion");
    const diamond = fixture.querySelector('[data-slot="trace-icon"] .beui-ai-loader[data-variant="diamond"]');
    assert(diamond?.querySelectorAll("rect").length === 8, "Reasoning step must use the diamond");
    assert(!diamond.querySelector("span") && getComputedStyle(diamond.querySelector("svg")).width === "16px", "Reasoning icon must fit its slot without duplicating the label");
    assert(getComputedStyle(diamond.querySelector("rect")).animationName === (reduced || matchMedia("(prefers-reduced-motion: reduce)").matches ? "none" : "beui-ai-pixel"), "Diamond must respect reduced motion");
    passed.push("Loader → content, including reduced-motion visibility");

    let historicalSerializations = 0;
    const history = Array.from({ length: 3 }, (_, index) => ({
      id: `history-${index}`, role: "assistant", state: "done", parts: [{
        kind: "tool", callId: `tool-${index}`, name: "searchCode", inputText: "{}", state: "done",
        output: { toJSON() { historicalSerializations++; return { result: "unchanged" }; } },
      }],
    }));
    state = { ...state, messages: [...history, { id: "live", role: "assistant", state: "streaming", parts: [{ kind: "text", text: "当前回复" }] }] };
    flushSync(() => listeners.forEach(listener => listener()));
    const initialSerializations = historicalSerializations;
    assert(initialSerializations > 0, "Historical tool output must render initially");
    for (let index = 0; index < 5; index++) {
      const live = state.messages.at(-1);
      state = { ...state, messages: [...history, { ...live, parts: [{ kind: "text", text: `${live.parts[0].text}增量` }] }] };
      flushSync(() => listeners.forEach(listener => listener()));
    }
    state = { ...state, status: "idle", messages: [...history, { ...state.messages.at(-1), state: "done" }] };
    flushSync(() => listeners.forEach(listener => listener()));
    assert(historicalSerializations === initialSerializations, "Streaming updates and completion must not re-render unchanged history");
    assert(fixture.textContent.includes(`当前回复${"增量".repeat(5)}`), "Live reply must still receive every delta");
    let retried;
    store.retry = id => { retried = id; };
    click(fixture.querySelector('[aria-label="重试"]'));
    assert(retried === history[0].id, "Memoized history must still retry its own message");
    passed.push("Streaming updates skip historical rendering and preserve retry actions");

    const parts = [{ kind: "reasoning", text: "已完成第一步，等待工具", state: "done" }];
    const props = { key: "disclosure", parts, streaming: true, answering: false };
    render(ChainOfThought, props);
    assert(fixture.textContent.includes("等待回复") && fixture.textContent.includes("已思考"), "Group stays running between completed steps");
    let triggers = fixture.querySelectorAll('[data-slot="trace-disclosure"] button[aria-expanded]');
    triggers[1].focus();
    click(triggers[1]);
    render(ChainOfThought, { ...props, answering: true });
    assert(triggers[0].getAttribute("aria-expanded") === "true", "Automatic collapse must protect focused child");
    await wait(240);
    const body = document.getElementById(triggers[0].getAttribute("aria-controls"));
    const expandedHeight = body.getBoundingClientRect().height;
    triggers[0].focus();
    click(triggers[0]);
    assert(triggers[0].getAttribute("aria-expanded") === "false", "Manual close must still work");
    await wait(50);
    const closingHeight = body.getBoundingClientRect().height;
    if (reduced || matchMedia("(prefers-reduced-motion: reduce)").matches) {
      assert(closingHeight < 1, "Reduced motion must collapse immediately");
    } else {
      assert(closingHeight > 0 && closingHeight < expandedHeight, "Closing must animate height, not snap");
    }
    await wait(220);
    assert(body.getBoundingClientRect().height < 1, "Closed group must not occupy height");
    assert(body.closest('[inert]') || body.querySelector('[inert]'), "Closed content must be inert");
    click(triggers[0]);
    triggers = fixture.querySelectorAll('[data-slot="trace-disclosure"] button[aria-expanded]');
    assert(triggers[1].getAttribute("aria-expanded") === "true", "Reopening must preserve child disclosure state");
    render(ChainOfThought, { key: "stopped", parts: [{ ...parts[0], state: "running" }], streaming: false, messageState: "stopped", answering: false });
    assert(fixture.textContent.includes("研究已停止") && !fixture.querySelector('.beui-ai-loader'), "Stop must remove group and step activity");
    passed.push("Group waiting, focus protection, animated close, nested state, stop");

    const previewProps = { key: "reasoning-preview", streaming: true, answering: false };
    const renderReasoning = text => render(ChainOfThought, {
      ...previewProps, parts: [{ kind: "reasoning", text, state: "running" }],
    });
    renderReasoning("**先确认");
    const reasoningTrigger = fixture.querySelectorAll('[data-slot="trace-disclosure"] button[aria-expanded]')[1];
    const pendingTitle = reasoningTrigger.textContent;
    renderReasoning("**先确认范围**");
    assert(reasoningTrigger.textContent === pendingTitle && !reasoningTrigger.querySelector('[data-slot="trace-detail"]'), "Incomplete first line must not change reasoning preview per token");
    renderReasoning("**先确认范围**\n下一行仍");
    const completedPreview = reasoningTrigger.querySelector('[data-slot="trace-detail"]')?.textContent;
    assert(completedPreview?.includes("先确认范围") && !completedPreview.includes("**"), "Completed first line must appear as plain preview");
    renderReasoning("**先确认范围**\n下一行仍在生成");
    assert(reasoningTrigger.querySelector('[data-slot="trace-detail"]')?.textContent === completedPreview, "Incomplete following line must not churn the completed preview");
    click(reasoningTrigger);
    renderReasoning("**先确认范围**\n\n- 第一项\n- 第二项\n");
    await wait(30);
    assert(!reasoningTrigger.querySelector('[data-slot="trace-detail"]'), "Expanded reasoning must hide the duplicate preview");
    assert(fixture.querySelector('.chat-markdown [data-streamdown="strong"]')?.textContent === "先确认范围" && fixture.querySelectorAll(".chat-markdown ul > li").length === 2, "Expanded reasoning must render real Markdown emphasis and list elements");
    passed.push("Stable completed-line reasoning preview; expanded Markdown emphasis and lists");

    const toolProps = { key: "tool-summary", streaming: true, answering: false };
    const tool = { kind: "tool", callId: "first", name: "searchWeb", state: "running", inputText: '{"query":"raw-fragment-should-not-render"' };
    render(ChainOfThought, { ...toolProps, parts: [tool] });
    const scan = fixture.querySelector('.beui-ai-loader[data-variant="scan"]');
    assert(scan?.querySelectorAll("rect").length === 25, "Tool step must use the scan grid");
    assert(getComputedStyle(scan.querySelector("rect")).animationName === (reduced || matchMedia("(prefers-reduced-motion: reduce)").matches ? "none" : "beui-ai-pixel"), "Scan must respect reduced motion");
    const toolTrigger = fixture.querySelector('[data-slot="trace-disclosure"] button[aria-expanded]');
    click(toolTrigger);
    assert(toolTrigger.getAttribute("aria-expanded") === "false" && !toolTrigger.querySelector('[data-slot="trace-detail"]'), "Collapsed tool must wait for complete JSON before showing detail");
    assert(!fixture.textContent.includes("raw-fragment-should-not-render") && !fixture.textContent.includes('{"query"'), "Partial JSON must not leak into tool labels");
    const longQuery = "W".repeat(200);
    fixture.style.width = "280px";
    render(ChainOfThought, { ...toolProps, parts: [{ ...tool, inputText: JSON.stringify({ query: longQuery }) }] });
    const toolDetail = toolTrigger.querySelector('[data-slot="trace-detail"]');
    assert(toolDetail?.textContent.endsWith("…") && toolDetail.textContent.length < longQuery.length, "Long tool detail must be shortened");
    assert(toolTrigger.getBoundingClientRect().right <= fixture.getBoundingClientRect().right + 1 && fixture.scrollWidth <= fixture.clientWidth + 1, "Long tool detail must not widen the narrow container");
    render(ChainOfThought, { ...toolProps, parts: [
      { ...tool, state: "done", inputText: JSON.stringify({ query: longQuery }), output: "complete" },
      { kind: "tool", callId: "next", name: "readBuildLog", state: "running", inputText: JSON.stringify({ deployment: "run-preview" }) },
    ] });
    assert(toolTrigger.getAttribute("aria-expanded") === "false", "Streaming tool changes must preserve manually closed group");
    assert(toolTrigger.textContent.includes("读取构建日志") && toolTrigger.textContent.includes("run-preview") && !toolTrigger.textContent.includes("搜索网页"), "Collapsed group must show the current tool action and controlled detail");
    fixture.style.removeProperty("width");
    passed.push("Safe tool summaries, narrow-width truncation, manual closure survives tool changes");

    let rejectWrite;
    clipboard({ writeText: () => new Promise((_, reject) => { rejectWrite = reject; }) });
    render(CodeBlockCopyButton, { value: "const value = 42;" });
    click(fixture.querySelector("button"));
    assert(fixture.querySelector("button").disabled && !fixture.textContent.includes("已复制"), "Pending copy must not announce success");
    rejectWrite(new Error("denied"));
    await wait(30);
    assert(fixture.textContent.includes("复制失败") && !fixture.querySelector("button").disabled, "Copy rejection must offer retry");
    let copiedText;
    clipboard({ writeText: async text => { copiedText = text; } });
    click(fixture.querySelector("button"));
    await wait(30);
    assert(copiedText === "const value = 42;" && fixture.textContent.includes("已复制"), "Retry must succeed before showing copied");
    passed.push("Clipboard pending → failure → retry → success");

    const gateway = createMockGateway({ delayMs: 0 });
    let folded = createThreadState("copy");
    let expected;
    for await (const event of gateway.stream({ messages: [{ role: "user", text: "检查缓存" }] })) {
      folded = foldChatEvent(folded, event);
      if (event.type === "completed") expected = event.response.assistant.parts
        .filter(part => part.type === "text")
        .map(part => part.text)
        .join("\n\n");
    }
    render(MessageView, { key: "assistant", message: folded.messages.at(-1), streaming: false, onRetry() {} });
    click(fixture.querySelector('[data-slot="message-footer"] button'));
    await wait(30);
    assert(copiedText === expected, "Copied interleaved answer must retain Markdown boundaries");
    assert(copiedText.includes("\n\n## ") && copiedText.includes("\n\n```ts\n"), "Copied Markdown must retain heading and fenced-code boundaries");
    clipboard(undefined);
    render(MessageView, { key: "user", message: { id: "u", role: "user", state: "done", parts: [{ kind: "text", text: "用户原文" }] }, streaming: false, onRetry() {} });
    click(fixture.querySelector('[data-slot="message-footer"] button'));
    await wait(30);
    assert(fixture.textContent.includes("复制失败"), "Missing clipboard API must fail visibly without throwing");
    passed.push("Normal mock copy preserves Markdown; missing clipboard fails safely");
    result.textContent = `PASS (${reduced ? "reduced-motion CSS" : "normal motion"})\n${passed.join("\n")}`;
    result.dataset.passed = "true";
  } catch (error) {
    result.textContent = `FAIL: ${error.message}\nCompleted: ${passed.join("; ")}`;
    result.dataset.passed = "false";
    throw error;
  } finally {
    if (clipboardDescriptor) Object.defineProperty(navigator, "clipboard", clipboardDescriptor);
    else delete navigator.clipboard;
  }
</script>
