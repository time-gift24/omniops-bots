<!doctype html>
<meta charset="utf-8" />
<title>Concurrent desktop runtime regression</title>
<pre id="result">Running…</pre>
<script type="module">
import { createTauriRuntime } from "/src/adapters/tauri/runtime.ts"
const result = document.querySelector("#result")
const assert = (condition, message) => { if (!condition) throw new Error(message) }
const deferred = () => Promise.withResolvers()
const metadata = { providerName: "fixture", protocolName: "langgraph", requestedModel: "fixture" }
const empty = { simulated: false, tasks: [], task: null, browserThreadId: null, browserRequest: 0, browser: { url: "", title: "", status: "empty", canGoBack: false, canGoForward: false } }
const prepare = new Map([["a", deferred()], ["b", deferred()]])
const requests = [], calls = []
let listener
const bridge = {
  async listen(_event, handler) { listener = handler; return () => { listener = undefined } },
  async invoke(command, args) {
    calls.push([command, args])
    if (command === "runtime_prepare_run") return prepare.get(args.threadId).promise
    if (command !== "runtime_request") return null
    if (args.method === "status") return empty
    if (args.method === "chat_start") {
      const run = args.params
      requests.push(run)
      listener({ event: "chat_event", runId: run.runId, threadId: run.threadId, data: { type: "started", metadata } })
      return { runId: run.runId }
    }
    return {}
  },
}
const runtime = createTauriRuntime(bridge)
try {
  await runtime.initialize()
  await runtime.desktop.selectBrowserThread("a")
  const first = runtime.gatewayFor("a"), second = runtime.gatewayFor("b")
  const input = { messages: [{ role: "user", text: "inspect" }] }
  const a = first.stream(input)[Symbol.asyncIterator](), b = second.stream(input)[Symbol.asyncIterator]()
  const firstEvent = a.next(), secondEvent = b.next()
  assert(runtime.desktop.getState().tasks.length === 2, "Both preparations must be reserved independently")
  listener({ event: "desktop_state", state: empty })
  assert(runtime.desktop.getState().tasks.length === 2, "An old empty snapshot must retain both preparations")
  await runtime.desktop.selectBrowserThread("b")
  assert(!calls.some(([, args]) => args?.method === "browser_select" && args.params.focus), "Normal thread selection must not open or focus Chrome")
  assert(runtime.desktop.getState().task.threadId === "b", "Visible task must follow the selected page")
  const stopped = first.abort()
  prepare.get("a").resolve()
  await stopped
  assert((await firstEvent).value.error.kind === "aborted", "Stopping A must cancel A")
  assert((await a.next()).done, "Cancelled stream must finish")
  assert(runtime.desktop.getState().tasks.length === 1 && runtime.desktop.getState().task.threadId === "b", "Stopping A must retain B")
  prepare.get("b").resolve()
  assert((await secondEvent).value.type === "started", "B must proceed independently")
  assert(requests.length === 1 && requests[0].threadId === "b", "Cancelled preparation must never start a model")
  const run = requests[0]
  listener({ event: "chat_event", runId: run.runId, threadId: "b", data: { type: "completed", response: { assistant: { parts: [{ type: "text", text: "done" }] }, finish: { reason: "stop" }, usage: {}, metadata } } })
  assert((await b.next()).value.type === "completed" && (await b.next()).done, "B must complete normally")
  assert(runtime.desktop.getState().tasks.length === 0, "Both task reservations must be released")
  await runtime.desktop.selectBrowserThread("b", { focus: true })
  assert(calls.filter(([, args]) => args?.method === "browser_select").at(-1)[1].params.threadId === "b", "Chrome refocus must identify the selected page")
  assert(calls.filter(([, args]) => args?.method === "browser_select").at(-1)[1].params.focus === true, "Chrome refocus must explicitly request focus")
  assert(!calls.some(([command]) => command === "browser_set_bounds"), "External Chrome must not receive native viewport commands")
  result.textContent = "PASS: concurrent preparation, selected page projection, isolated cancellation, independent completion, Chrome page identity"
  result.dataset.passed = "true"
} catch (error) {
  result.textContent = `FAIL: ${error.stack}`
  result.dataset.passed = "false"
  throw error
} finally { runtime.dispose() }
</script>
