<!doctype html>
<meta charset="utf-8" />
<title>Message rendering boundary regressions</title>
<!-- Run npm run dev, then open /tests/rendering.browser.html. -->
<div id="fixture"></div>
<div id="reference"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { createTestDependencies, withDependencies } from "/tests/support.tsx";
  import { MessageView } from "/src/components/chat/message-view.tsx";
  import { TooltipProvider } from "/src/components/ui/tooltip.tsx";
  import { useHighlightedCode } from "/src/hooks/use-highlighted-code.ts";
  import { loadHighlighter } from "/src/lib/highlighter.tsx";

  const fixture = document.querySelector("#fixture");
  const reference = document.querySelector("#reference");
  const root = createRoot(fixture);
  const referenceRoot = createRoot(reference);
  const results = [];
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const dependencies = createTestDependencies();
  const render = element => flushSync(() => root.render(withDependencies(element, dependencies)));
  const until = async predicate => {
    const deadline = performance.now() + 5000;
    while (!predicate() && performance.now() < deadline) await new Promise(resolve => setTimeout(resolve, 20));
    assert(predicate(), "Highlighting did not settle");
  };
  const check = async (name, run) => {
    try { await run(); results.push({ name, passed: true }); }
    catch (error) { results.push({ name, passed: false, error: error.message }); }
  };
  await check("user messages retain line breaks and indentation", () => {
    const text = "first line\n  second line\n\n<script>literal text<\/script>";
    render(React.createElement(TooltipProvider, null, React.createElement(MessageView, {
      message: { id: "user", role: "user", state: "done", parts: [{ kind: "text", text }] },
      streaming: false, onRetry() {},
    })));
    const bubble = fixture.querySelector('[data-slot="bubble-content"]');
    assert(bubble.innerText === text, "User message collapsed whitespace or newlines");
    assert(!bubble.querySelector("script"), "User text must remain literal text");
  });
  await check("unsupported language names never resolve inherited object properties", async () => {
    for (const language of ["unsupported", "constructor", "__proto__", "toString"]) {
      assert(await loadHighlighter(language) === null, `Unsupported language ${language} must use plain text`);
    }
  });
  function Lines({ lines }) {
    return lines.map((line, index) => React.createElement("div", { key: index, "data-line": true }, line));
  }
  function Highlighted({ value, language }) {
    return React.createElement(Lines, { lines: useHighlightedCode(value, language) });
  }
  await check("ANSI colors continue across line breaks until reset", async () => {
    const highlighter = await loadHighlighter("ansi");
    const { lines } = highlighter.highlight("\u001b[31mred\nred too\u001b[0m");
    assert(lines[0][0].props.style["--shiki-light"] === lines[1][0].props.style["--shiki-light"],
      "ANSI foreground color was lost at the line break");
  });
  await check("incremental multiline highlighting matches a full render after edits and language changes", async () => {
    for (const [language, value] of [
      ["ts", "/* opening\n"], ["ts", "/* opening\ncomment\n"],
      ["ts", "/* opening\ncomment\n*/ const answer = 42;\n"],
      ["ts", "const revised = 7;\n\n"], ["json", '{\n  "ok": true\n}\n'],
      ["text", "plain\n\ntext\n"], ["ts", "const final = `first\nsecond`;\n"],
      ["ansi", "\u001b[31mred\nred too\u001b[0m\n"], ["ansi", "\u001b[32mgreen\nmore green\nlast\u001b[0m"],
    ]) {
      const highlighter = await loadHighlighter(language);
      const code = value.endsWith("\n") ? value.slice(0, -1) : value;
      const expected = highlighter ? highlighter.highlight(code).lines : code.split("\n");
      flushSync(() => referenceRoot.render(React.createElement(Lines, { lines: expected })));
      render(React.createElement(Highlighted, { value, language }));
      await until(() => fixture.innerHTML === reference.innerHTML);
    }
  });
  document.querySelector("#result").textContent = results.map(r => `${r.passed ? "PASS" : "FAIL"}: ${r.name}${r.error ? ` — ${r.error}` : ""}`).join("\n");
  document.querySelector("#result").dataset.passed = String(results.every(r => r.passed));
</script>
