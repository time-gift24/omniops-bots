<!doctype html>
<meta charset="utf-8" />
<title>Workspace interaction regression</title>
<!-- Run npm run dev, then open /tests/workspace.browser.html. Both viewport sizes run automatically. -->
<div id="fixture"></div>
<pre id="result">Running…</pre>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { flushSync } from "react-dom";
  import "/src/index.css";
  import { App } from "/src/App.tsx";
  import { createTestDependencies, withTestTheme } from "/tests/support.tsx";
  import { createMockGateway } from "/src/adapters/demo/chat.ts";

  const result = document.querySelector("#result");
  const fixture = document.querySelector("#fixture");
  const viewport = new URLSearchParams(location.search).get("viewport");
  const mobile = viewport === "mobile";
  const passed = [];
  const wait = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms));
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const until = async (condition, message, timeout = 5000) => {
    const deadline = performance.now() + timeout;
    while (!condition() && performance.now() < deadline) await wait();
    assert(condition(), message);
  };
  const click = element => {
    assert(element && !element.disabled && !element.closest("[inert]"), "Target must be an enabled, reachable control");
    flushSync(() => { element.focus(); element.click(); });
  };
  const button = (text, scope = document) => [...scope.querySelectorAll("button")]
    .find(element => element.textContent.trim() === text);
  const labeled = label => [...document.querySelectorAll("button[aria-label]")]
    .find(element => element.getAttribute("aria-label") === label);
  const dialog = () => document.querySelector('[data-slot="dialog-content"]');
  const drawer = () => document.querySelector('[data-mobile="true"]');
  const editor = () => fixture.querySelector('[role="textbox"][aria-label="消息输入"]');
  const model = () => fixture.querySelector('button[aria-label^="选择模型:"]');
  const group = name => labeled(`在 ${name} 中新建会话`)?.closest("section");
  const row = (name, title) => [...(group(name)?.querySelectorAll("li > button[title]") ?? [])]
    .find(element => element.title === title);
  const sessionRow = title => [...document.querySelectorAll('ul[aria-label="会话"] > li > button[title]')]
    .find(element => element.title === title);
  const setInput = (input, value) => flushSync(() => {
    Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(input, value);
    input.dispatchEvent(new Event("input", { bubbles: true }));
  });
  const write = text => flushSync(() => {
    editor().focus();
    editor().textContent = text;
    editor().dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: text }));
  });
  const navigation = async () => {
    click(labeled("工作区"));
    await until(() => Boolean(labeled("添加工作区")) && (!mobile || drawer()?.getAttribute("aria-hidden") === "false"),
      "Workspace navigation did not open");
  };
  const closedDrawer = async () => {
    if (mobile) await until(() => drawer()?.getAttribute("aria-hidden") === "true", "Selecting a session must close the mobile drawer");
  };
  const newSession = async (name) => {
    await navigation();
    click(name ? labeled(`在 ${name} 中新建会话`) : button("新会话"));
    await closedDrawer();
  };
  const openAdd = async () => {
    await navigation();
    click(labeled("添加工作区"));
    await until(() => dialog()?.querySelector("input"), "Directory picker did not open");
    await until(() => dialog()?.querySelector("button[aria-pressed]"),
      "Directory choices did not finish loading");
    await closedDrawer();
  };
  const addDirectory = async path => {
    await until(() => button(path, dialog()) && !button(path, dialog()).disabled,
      "Directory choices did not finish loading");
    click(button(path, dialog()));
    click(button("打开工作区", dialog()));
    await until(() => !dialog() && editor(), "Opening a directory did not create a conversation");
    await closedDrawer();
  };
  const selectModel = async label => {
    click(model());
    await until(() => [...document.querySelectorAll('[role="menuitemradio"]')].some(element => element.textContent.trim() === label),
      "Model choices did not open");
    click([...document.querySelectorAll('[role="menuitemradio"]')].find(element => element.textContent.trim() === label));
    await until(() => model()?.textContent.trim() === label && !document.querySelector('[data-morph-popover-portal]:not([inert]) [role="menuitemradio"]'),
      "Model selection did not close its menu");
  };
  const searchSession = async title => {
    await navigation();
    click(labeled("搜索导航"));
    await until(() => document.querySelector("[data-slot=command-input]"), "Navigation search did not open");
    setInput(document.querySelector("[data-slot=command-input]"), title);
    const match = () => [...document.querySelectorAll("[data-slot=command-item]")]
      .find(element => element.textContent.trim() === title && !element.closest("[hidden]"));
    await until(match, "Search did not find the existing conversation");
    click(match());
    await until(() => !dialog(), "Selecting the search result did not close search");
    await closedDrawer();
  };

  let root;
  let releaseStream = () => {};
  try {
    if (!viewport) {
      for (const [name, width] of [["desktop", 1100], ["mobile", 390]]) {
        const frame = document.createElement("iframe");
        frame.title = `${name} workspace regression`;
        frame.width = width;
        frame.height = 844;
        frame.src = `${location.pathname}?viewport=${name}`;
        fixture.append(frame);
        await until(() => frame.contentDocument?.querySelector("#result")?.dataset.passed,
          `${name} fixture did not finish`, 45000);
        const childResult = frame.contentDocument.querySelector("#result");
        assert(childResult.dataset.passed === "true", childResult.textContent);
        passed.push(childResult.textContent);
      }
    } else {
      const created = [];
      const requests = [];
      let aborted = 0;
      let held = false;
      let events = 0;
      const gate = new Promise(resolve => { releaseStream = resolve; });
      const dependencies = createTestDependencies({ gatewayFor: id => {
        created.push(id);
        const mock = createMockGateway({ delayMs: 0 });
        return {
          abort() { aborted += 1; mock.abort(); },
          async *stream(request) {
            requests.push({ id, request });
            for await (const event of mock.stream(request)) {
              if (!held && event.type === "delta") { held = true; await gate; }
              events += 1;
              yield event;
            }
          },
        };
      } });
      root = createRoot(fixture);
      flushSync(() => root.render(React.createElement(React.StrictMode, null,
        withTestTheme(React.createElement(App), dependencies))));
      await until(() => Boolean(editor()) && Boolean(labeled("工作区")) && Boolean(drawer()) === mobile, "StrictMode App did not mount at the requested viewport");
      assert(created.length === 1 && !dialog(), "Mounting must create one usable conversation without requiring a workspace");
      const temporary = dependencies.threads.get(created[0]);
      write("temporary conversation draft");
      await selectModel("Sonnet 5");
      await navigation();
      assert(!document.querySelector('ul[aria-label="会话"]'), "An unsent temporary conversation must stay out of the sidebar");
      assert(temporary.send("   ") === false && !sessionRow("新会话"), "Rejected whitespace sends must not publish a temporary conversation");

      await newSession();
      assert(created.length === 1 && editor().textContent === "temporary conversation draft" && !dialog(), "New conversation must reuse the unbound draft without opening a workspace picker");
      await openAdd();
      await addDirectory("/workspace/omniops-bots");
      assert(created.length === 2, `Adding one directory must create one more thread, received ${created.length}: ${created.join(", ")}`);
      assert(editor().textContent === "" && model().textContent.trim() === "Pine 1", "A workspace conversation must have its own draft and model");
      assert(!row("omniops-bots", "新会话"), "An active empty conversation must not appear in the sidebar");
      const first = dependencies.threads.get(created[1]);
      write("first workspace draft");
      await selectModel("GPT 5.6");
      const files = new DataTransfer();
      files.items.add(new File(["keep this file"], "notes.txt", { type: "text/plain" }));
      flushSync(() => {
        const input = fixture.querySelector('input[type="file"]');
        input.files = files.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
      });
      await until(() => first.getDraft().attachments.length === 1 && labeled("移除附件 notes.txt"), "Selecting a file must populate the current draft and attachment tray");
      // The input's FileList may wrap the selected File differently from DataTransfer.
      const selectedFile = first.getDraft().attachments[0].file;
      assert(selectedFile?.name === "notes.txt" && await selectedFile.text() === "keep this file", "The selected attachment must retain its actual file contents");
      await newSession();
      assert(created.length === 2 && editor().textContent === "temporary conversation draft" && model().textContent.trim() === "Sonnet 5" && !labeled("移除附件 notes.txt"), "Global new conversation must return to the independent temporary draft");
      await newSession("omniops-bots");
      assert(created.length === 2 && editor().textContent === "first workspace draft", "The workspace entry must reuse its own blank draft");
      assert(first.getDraft().attachments[0]?.file === selectedFile, "Reusing a blank conversation must retain its attachment");
      assert(!row("omniops-bots", "新会话"), "Typing, model selection and attachments must not publish a conversation");
      assert(first.send("   ") === false && !row("omniops-bots", "新会话"), "Rejected whitespace sends must not publish a conversation");
      passed.push("StrictMode mount, directory add and blank conversation reuse");

      await openAdd();
      await addDirectory("/workspace/客户支持");
      assert(created.length === 3 && editor().textContent === "" && model().textContent.trim() === "Pine 1", "A second workspace must start with an independent draft and model");
      const second = dependencies.threads.get(created[2]);
      write("support workspace draft");
      await newSession("omniops-bots");
      assert(editor().textContent === "first workspace draft" && model().textContent.trim() === "GPT 5.6", "Returning to a workspace must restore its text and model");
      assert(labeled("移除附件 notes.txt") && second.getDraft().attachments.length === 0, "Attachments must remain visible only in their own conversation");
      assert(second.getDraft().text === "support workspace draft", "Switching away must preserve the other workspace draft");
      passed.push("text, model and attachment isolation across workspaces");

      const title = "侧边栏回归：工作区会话";
      write(title);
      click(labeled("发送"));
      await until(() => held && first.streaming && row("omniops-bots", title), "Starting generation must turn the blank row into a titled history entry");
      assert(requests[0]?.id === created[1] && requests[0].request.model === "gpt-5.6", "The request must use the selected thread and model");
      assert(requests[0].request.messages[0].attachments?.[0]?.name === "notes.txt", "The request must include the selected thread's attachment");
      assert(editor().textContent === "" && first.getDraft().attachments.length === 0, "Accepted send must clear only its submitted draft");
      await newSession("omniops-bots");
      assert(created.length === 4 && !row("omniops-bots", "新会话"), "Explicit workspace action must create a new conversation without publishing an empty row");
      write("next conversation draft");
      await newSession("客户支持");
      assert(editor().textContent === "support workspace draft" && first.streaming && aborted === 0, "Switching during generation must retain the other draft without aborting");
      const beforeResume = events;
      releaseStream();
      await until(() => !first.streaming && first.getState().status === "idle", "Background generation did not finish", 15000);
      assert(events > beforeResume && first.getState().messages.at(-1)?.state === "done" && aborted === 0, "An unmounted conversation must continue consuming its real mock stream");
      assert(editor().textContent === "support workspace draft", "Background completion must not alter the visible draft");
      passed.push("history title, explicit workspace selection and uninterrupted background generation");

      await searchSession(title);
      assert(row("omniops-bots", title)?.getAttribute("aria-current") === "page", "Search must select the existing conversation rather than create one");
      assert(fixture.textContent.includes(title) && fixture.textContent.includes("缓存键") && created.length === 4, "Search must restore the completed conversation content");
      click(labeled("编辑"));
      assert(editor().textContent === title && model().textContent.trim() === "GPT 5.6", "Editing must restore the user's text without changing models");
      const edited = `${title}，补充检查`;
      write(edited);
      await newSession("客户支持");
      await searchSession(title);
      assert(editor().textContent === edited, "An edited message draft must survive a conversation switch");
      passed.push("search navigation and edited draft restoration");

      const count = created.length;
      await openAdd();
      setInput(dialog().querySelector("input"), "/missing/mock-directory");
      click(button("打开工作区", dialog()));
      await until(() => dialog()?.querySelector('[role="alert"]'), "Unknown mock directories must show a recoverable error");
      assert(dialog().querySelector("input").value === "/missing/mock-directory" && button("重试", dialog()), "Directory failure must preserve input and expose retry");
      assert(created.length === count, "A failed directory selection must not create a conversation");
      click(button("取消", dialog()));
      await until(() => !dialog(), "Cancel must close the failed picker");
      assert(editor().textContent === edited, "Cancelling a failed picker must preserve the active draft");

      await openAdd();
      click(button("/workspace/研发协作", dialog()));
      click(button("打开工作区", dialog()));
      assert(button("正在添加…", dialog())?.disabled, "An in-flight directory request must prevent duplicate submits");
      click(button("取消", dialog()));
      await until(() => !dialog(), "An in-flight picker must be cancellable");
      await openAdd();
      click(button("/workspace/客户支持", dialog()));
      await wait(300);
      assert(dialog()?.querySelector("input")?.value === "/workspace/客户支持", "A late result from the cancelled picker must not close or overwrite its replacement");
      assert(created.length === count && !group("研发协作"), "Cancelled directory results must not create a workspace or conversation");
      click(button("取消", dialog()));
      await until(() => !dialog(), "Replacement picker did not close");
      assert(editor().textContent === edited && aborted === 0, "Directory failures and cancellation must leave the active conversation intact");
      passed.push("directory errors, cancellation and stale result isolation");
      await newSession("客户支持");
      assert(editor().textContent === "support workspace draft", "The support workspace must still own its original unsent draft");
      await selectModel("Sonnet 5");
      flushSync(() => {
        const input = fixture.querySelector('input[type="file"]');
        const supportFiles = new DataTransfer();
        supportFiles.items.add(selectedFile);
        input.files = supportFiles.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
      });
      await until(() => second.getDraft().attachments.length === 1 && labeled("移除附件 notes.txt"), "The support draft must retain its selected attachment");
      const supportFile = second.getDraft().attachments[0].file;
      const suggestion = "总结一下这个仓库本周的变更";
      const requestCount = requests.length;
      click(button(suggestion, fixture));
      await until(() => requests.length === requestCount + 1 && row("客户支持", suggestion), "A suggestion must create a titled conversation in its own workspace");
      const suggestionRequest = requests[requestCount];
      assert(suggestionRequest.id === created[2] && suggestionRequest.request.model === "sonnet-5", "The suggestion must use the support conversation and its selected model");
      assert(suggestionRequest.request.messages.length === 1 && suggestionRequest.request.messages[0].text === suggestion && !suggestionRequest.request.messages[0].attachments?.length, "The suggestion must send only its own text, without draft attachments");
      assert(editor().textContent === "support workspace draft" && second.getDraft().attachments[0]?.file === supportFile, "Suggestion acceptance must preserve the original draft text and File");

      const beforeNewSession = created.length;
      await newSession("客户支持");
      assert(created.length === beforeNewSession + 1 && !row("客户支持", "新会话"), "New conversation after a suggestion must remain absent until sent");
      const freshSupport = dependencies.threads.get(created.at(-1));
      assert(editor().textContent === "" && model().textContent.trim() === "Pine 1" && freshSupport.getDraft().attachments.length === 0, "The new conversation must have an independent empty draft and default model");
      await until(() => !second.streaming && second.getState().messages.at(-1)?.state === "done", "The background suggestion response did not finish", 15000);
      await searchSession(suggestion);
      assert(editor().textContent === "support workspace draft" && model().textContent.trim() === "Sonnet 5" && labeled("移除附件 notes.txt"), "Returning through search must restore the suggestion conversation's unsent text, model and attachment");
      assert(second.getDraft().attachments[0]?.file === supportFile && await supportFile.text() === "keep this file", "Returning through search must retain the original draft File and contents");
      click(labeled("编辑"));
      await until(() => !labeled("移除附件 notes.txt"), "Editing the suggestion message must remove its unsent draft attachment");
      assert(editor().textContent === suggestion && second.getDraft().attachments.length === 0 && model().textContent.trim() === "Sonnet 5", "Editing must replace the draft text, clear attachments and retain the model");
      await searchSession(title);
      assert(editor().textContent === edited, "Editing another workspace's conversation must leave the original draft unchanged");
      await searchSession(suggestion);
      assert(editor().textContent === suggestion && second.getDraft().attachments.length === 0 && !labeled("移除附件 notes.txt") && model().textContent.trim() === "Sonnet 5", "The edited suggestion draft must stay attachment-free after switching conversations");
      assert(freshSupport.getDraft().text === "" && freshSupport.getDraft().attachments.length === 0 && aborted === 0, "Suggestion and edit navigation must leave the new conversation empty without aborting requests");
      passed.push("suggestion, new conversation, search and edit preserve per-conversation draft semantics");

      await newSession();
      assert(editor().textContent === "temporary conversation draft" && model().textContent.trim() === "Sonnet 5" && !labeled("移除附件 notes.txt"), "The global entry must preserve its temporary draft after workspace activity");
      assert(!sessionRow("新会话"), "The temporary draft must remain absent until accepted send");
      const temporaryTitle = "侧边栏回归：临时会话";
      write(temporaryTitle);
      click(labeled("发送"));
      await until(() => sessionRow(temporaryTitle), "An accepted temporary send must publish its conversation below New conversation");
      assert(!row("omniops-bots", temporaryTitle) && !row("客户支持", temporaryTitle), "The temporary conversation must not inherit any workspace");
      const temporaryRequest = requests.find(entry => entry.id === created[0]);
      assert(temporaryRequest?.request.model === "sonnet-5" && temporaryRequest.request.messages[0].text === temporaryTitle, "The temporary send must use its own thread and selected model");
      const beforeTemporary = created.length;
      await newSession();
      assert(created.length === beforeTemporary + 1 && editor().textContent === "" && model().textContent.trim() === "Pine 1", "New temporary conversation after sending must own an independent blank draft");
      write("next temporary draft");
      await navigation();
      click(sessionRow(temporaryTitle));
      await closedDrawer();
      assert(editor().textContent === "" && model().textContent.trim() === "Sonnet 5", "Sidebar revisit must restore the sent temporary conversation");
      write("temporary follow-up draft");
      await searchSession(title);
      assert(editor().textContent === edited, "Returning from a temporary conversation must preserve the workspace draft");
      await navigation();
      click(sessionRow(temporaryTitle));
      await closedDrawer();
      assert(editor().textContent === "temporary follow-up draft", "Temporary follow-up draft must survive workspace navigation");
      await newSession();
      assert(editor().textContent === "next temporary draft" && created.length === beforeTemporary + 1 && aborted === 0, "Global new conversation must reuse the separate temporary blank draft without aborting requests");
      passed.push("optional workspace, temporary conversation sidebar admission, revisit and draft isolation");
      if (mobile) passed.push("mobile selections close the navigation drawer");
    }
    result.textContent = `PASS ${viewport ?? "all viewports"}: ${passed.join("; ")}`;
    result.dataset.passed = "true";
  } catch (error) {
    result.textContent = `FAIL ${viewport ?? "all viewports"}: ${error.message}`;
    result.dataset.passed = "false";
    throw error;
  } finally {
    releaseStream();
    if (root) root.unmount();
  }
</script>
