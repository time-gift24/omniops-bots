# Set LLM_API_KEY in your environment; never put the real key in this file.
# cargo run -p omniops-bots-cli --features omniops-bots-test -- chat \
#   --config providers.example.toml --provider chatanywhere --model gpt-4.1-nano
# Enter one message per line. Blank lines are ignored; /exit or input EOF exits.

[[providers]]
name = "chatanywhere"
base_url = "https://api.chatanywhere.tech/v1/"
auth = { type = "header_env", name = "authorization", prefix = "Bearer ", env = "LLM_API_KEY" }

[[models]]
provider = "chatanywhere"
name = "gpt-4.1-nano"
protocol = "openai.chat-completions"
