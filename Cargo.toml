[workspace]
resolver = "2"
members = ["crates/*", "vendor/sqlx-db-tester"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cognacta/cognacta"

[workspace.dependencies]
cognacta-core = { version = "0.1.0", path = "crates/cognacta-core" }
cognacta-provider = { version = "0.1.0", path = "crates/cognacta-provider" }
async-trait = "0.1"
async-stream = "0.3"
bon = "3.10"
clap = { version = "4.6", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sse-core = { version = "0.2.3", default-features = false, features = ["std", "stream"] }
thiserror = "2"
toml = "1.1"
sqlx-db-tester = { version = "0.7.1-cognacta.1", path = "vendor/sqlx-db-tester" }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring-native-roots",
    "macros",
    "migrate",
] }
anyhow = "1"
csv = "1.4"
itertools = "0.14"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread"] }
uuid = { version = "1.18", features = ["v4"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
