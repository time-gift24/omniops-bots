[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cognacta/cognacta"

[workspace.dependencies]
cognacta-core = { version = "0.1.0", path = "crates/cognacta-core" }

[profile.release]
lto = true
codegen-units = 1
