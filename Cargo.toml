[workspace]
resolver = "2"
members = ["crates/*", "vendor/sqlx-db-tester"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cognacta/cognacta"

[workspace.dependencies]
cognacta-collector = { version = "0.1.0", path = "crates/cognacta-collector" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace", "logs", "metrics"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
opentelemetry-appender-tracing = "0.33.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
prost = "0.14"
http = "1"
bytes = "1"
percent-encoding = "2"
cognacta-core = { version = "0.1.0", path = "crates/cognacta-core" }
cognacta-provider = { version = "0.1.0", path = "crates/cognacta-provider" }
async-trait = "0.1"
async-stream = "0.3"
bon = "3.10"
clap = { version = "4.6", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sse-core = { version = "0.2.3", default-features = false, features = ["std", "stream"] }
thiserror = "2"
toml = "1.1"
sqlx-db-tester = { version = "0.7.1-cognacta.1", path = "vendor/sqlx-db-tester" }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring-native-roots",
    "macros",
    "migrate",
] }
anyhow = "1"
csv = "1.4"
itertools = "0.14"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread"] }
uuid = { version = "1.18", features = ["v4"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
