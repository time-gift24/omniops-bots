<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
    <title id="title">SKILL用例图</title>
    <desc id="desc">Skill 管理与使用的主要用例：编辑与上传完整草稿；选择 Agent 实验草稿；发布 Skill 并联动 Agent；使用官方 / 复制为本地。角色与椭圆之间为无方向参与关系，未表示执行先后。</desc>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#16354b; }
      .heading { font-size:28px; font-weight:700; }
      .boundary { fill:#f5f9fc; stroke:#a0b8c9; stroke-width:2; }
      .boundary-label { font-size:20px; font-weight:600; }
      .association { stroke:#688296; stroke-width:2; fill:none; }
      .usecase { fill:#ffffff; stroke:#26749c; stroke-width:2.5; }
      .usecase-label { font-size:22px; font-weight:500; text-anchor:middle; dominant-baseline:central; }
      .actor circle { fill:#ffffff; stroke:#294f67; stroke-width:2.5; }
      .actor path { fill:none; stroke:#294f67; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .actor-label { font-size:22px; font-weight:600; text-anchor:middle; }
      .legend { font-size:20px; fill:#4b6577; }
    </style>
    <rect width="1000" height="520" fill="#ffffff" />
    <text x="32" y="44" class="heading">SKILL · 用例</text>
    <rect x="250" y="76" width="500" height="400" rx="10" class="boundary" />
    <text x="270" y="106" class="boundary-label">Skill 管理与使用</text>
<line x1="157" y1="250" x2="290" y2="160" class="association" />
<line x1="157" y1="250" x2="290" y2="250" class="association" />
<line x1="157" y1="250" x2="290" y2="340" class="association" />
<line x1="843" y1="430" x2="710" y2="430" class="association" />
<ellipse cx="500" cy="160" rx="210" ry="31" class="usecase" /><text x="500" y="160" class="usecase-label">编辑与上传完整草稿</text>
<ellipse cx="500" cy="250" rx="210" ry="31" class="usecase" /><text x="500" y="250" class="usecase-label">选择 Agent 实验草稿</text>
<ellipse cx="500" cy="340" rx="210" ry="31" class="usecase" /><text x="500" y="340" class="usecase-label">发布 Skill 并联动 Agent</text>
<ellipse cx="500" cy="430" rx="210" ry="31" class="usecase" /><text x="500" y="430" class="usecase-label">使用官方 / 复制为本地</text>
<g class="actor" aria-label="运维人员">
      <circle cx="125" cy="210" r="14" />
      <path d="M 125 224 V 261 M 101 240 H 149 M 125 261 L 102 290 M 125 261 L 148 290" />
      <text x="125" y="319" class="actor-label">运维人员</text>
    </g>
<g class="actor" aria-label="用户">
      <circle cx="875" cy="390" r="14" />
      <path d="M 875 404 V 441 M 851 420 H 899 M 875 441 L 852 470 M 875 441 L 898 470" />
      <text x="875" y="499" class="actor-label">用户</text>
    </g>
<text x="32" y="508" class="legend">角色参与关系 · 无方向关联线 · 不表示执行顺序</text></svg>
