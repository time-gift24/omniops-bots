<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
    <title id="title">总体架构用例图</title>
    <desc id="desc">运维人员编辑、实验与发布；线上用户在服务端 Console 发起和查看任务，在客户端只查看连接等基础状态；服务端 Agent 以任务调用客户端 Agent。角色与椭圆之间为无方向参与关系，未表示执行先后。</desc>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#16354b; }
      .heading { font-size:28px; font-weight:700; }
      .boundary { fill:#f5f9fc; stroke:#a0b8c9; stroke-width:2; }
      .boundary-label { font-size:20px; font-weight:600; }
      .association { stroke:#688296; stroke-width:2; fill:none; }
      .usecase { fill:#ffffff; stroke:#26749c; stroke-width:2.5; }
      .usecase-label { font-size:22px; font-weight:500; text-anchor:middle; dominant-baseline:central; }
      .actor circle { fill:#ffffff; stroke:#294f67; stroke-width:2.5; }
      .actor path { fill:none; stroke:#294f67; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .actor-label { font-size:22px; font-weight:600; text-anchor:middle; }
      .legend { font-size:20px; fill:#4b6577; }
    </style>
    <rect width="1000" height="520" fill="#ffffff" />
    <text x="32" y="44" class="heading">总体架构 · 用例</text>
    <rect x="250" y="76" width="500" height="400" rx="10" class="boundary" />
    <text x="270" y="106" class="boundary-label">服务端 Console 与本地客户端</text>
<line x1="157" y1="160" x2="290" y2="160" class="association" />
<line x1="157" y1="365" x2="290" y2="250" class="association" />
<line x1="157" y1="365" x2="290" y2="430" class="association" />
<line x1="843" y1="340" x2="710" y2="340" class="association" />
<ellipse cx="500" cy="160" rx="210" ry="31" class="usecase" /><text x="500" y="160" class="usecase-label">编辑、实验与发布</text>
<ellipse cx="500" cy="250" rx="210" ry="31" class="usecase" /><text x="500" y="250" class="usecase-label">Console 发起与查看任务</text>
<ellipse cx="500" cy="340" rx="210" ry="31" class="usecase" /><text x="500" y="340" class="usecase-label">以任务调用客户端 Agent</text>
<ellipse cx="500" cy="430" rx="210" ry="31" class="usecase" /><text x="500" y="430" class="usecase-label">查看客户端基础连接状态</text>
<g class="actor" aria-label="运维人员">
      <circle cx="125" cy="120" r="14" />
      <path d="M 125 134 V 171 M 101 150 H 149 M 125 171 L 102 200 M 125 171 L 148 200" />
      <text x="125" y="229" class="actor-label">运维人员</text>
    </g>
<g class="actor" aria-label="普通用户">
      <circle cx="125" cy="325" r="14" />
      <path d="M 125 339 V 376 M 101 355 H 149 M 125 376 L 102 405 M 125 376 L 148 405" />
      <text x="125" y="434" class="actor-label">普通用户</text>
    </g>
<g class="actor" aria-label="服务端 Agent">
      <circle cx="875" cy="300" r="14" />
      <path d="M 875 314 V 351 M 851 330 H 899 M 875 351 L 852 380 M 875 351 L 898 380" />
      <text x="875" y="409" class="actor-label">服务端 Agent</text>
    </g>
<text x="32" y="508" class="legend">角色参与关系 · 无方向关联线 · 不表示执行顺序</text></svg>
